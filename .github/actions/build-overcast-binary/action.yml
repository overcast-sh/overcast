name: Build Overcast binary
description: Build one Overcast release binary for a target OS, architecture, and build-tag set.

inputs:
  asset:
    description: Output asset file name.
    required: true
  goos:
    description: Target GOOS.
    required: true
  goarch:
    description: Target GOARCH.
    required: true
  version:
    description: Version string embedded in the binary.
    required: true
  tags:
    description: Optional comma-separated Go build tags.
    required: false
    default: ""
  output-dir:
    description: Directory for the built binary.
    required: false
    default: dist

runs:
  using: composite
  steps:
    # Every overcast binary embeds the in-container Lambda init for both Linux
    # architectures. It is build output rather than a committed file, and
    # //go:embed reads the tree at compile time — so without this step the asset
    # ships with nothing but the placeholder and fails at the first Lambda
    # invoke that needs it. Before the build, always.
    #
    # The init does not vary with this action's target: it is always the same
    # two linux binaries, and this matrix builds it ten times per run. The
    # composite below restores it from a content-addressed cache instead, and
    # asserts both binaries are present either way — so a cache that came back
    # incomplete fails here rather than shipping an asset with a placeholder in
    # it.
    - uses: ./.github/actions/lambda-init
    # The aws-sdk shape tables internal/awsshapes embeds: build output, like
    # the Lambda init above, packed from the committed text tables.
    - name: Pack the aws-sdk shape tables
      shell: bash
      run: go run ./cmd/awsshapes-pack

    - name: Build binary
      shell: bash
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ inputs.goos }}
        GOARCH: ${{ inputs.goarch }}
        VERSION: ${{ inputs.version }}
        TAGS: ${{ inputs.tags }}
        ASSET: ${{ inputs.asset }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        mkdir -p "$OUTPUT_DIR"
        if [ -n "$TAGS" ]; then
          go build -trimpath -tags "$TAGS" -ldflags="-w -s -X main.version=$VERSION" -o "$OUTPUT_DIR/$ASSET" ./cmd/overcast
        else
          go build -trimpath -ldflags="-w -s -X main.version=$VERSION" -o "$OUTPUT_DIR/$ASSET" ./cmd/overcast
        fi
