name: AWS API model refresh

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # Keeps an *open* refresh PR current when main moves under it. The PR is one
  # generated commit, and a change to what it is generated from or written
  # over (#1955 added a line to models/aws/VERSION) makes it conflict or go
  # stale until the next weekly run, which can be six days. Only those paths:
  # unrelated merges leave it mergeable, since the ruleset does not require the
  # branch to be up to date. A push only refreshes a PR that is already open
  # and never opens one, so the weekly cadence stays what starts a refresh.
  push:
    branches: [main]
    paths:
      - models/aws/**
      - internal/awsapi/**
      - internal/awsshapes/**
      - cmd/awsmodelgen/**
      - scripts/aws-models.go
      - .github/workflows/aws-model-refresh.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aws-api-model-refresh
  cancel-in-progress: false

env:
  UPDATE_BRANCH: automation/aws-api-models

jobs:
  refresh:
    name: Refresh pinned models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_MIRROR: /tmp/overcast-api-models-aws.git
      MODEL_CHECKOUT: /tmp/overcast-api-models-aws

    steps:
      # The branch push and the PR need a GitHub App installation token, not
      # GITHUB_TOKEN. `gh pr create` with GITHUB_TOKEN is refused outright
      # ("GitHub Actions is not permitted to create or approve pull requests"),
      # and even where that setting is enabled a PR opened as
      # github-actions[bot] starts no workflow runs, so the PR would sit on
      # required checks that never run. The App needs exactly two repository
      # permissions — Contents: read & write (push the dedicated branch) and
      # Pull requests: read & write (open and edit the PR). Not Workflows: the
      # refresh commit touches only the generated manifest, the pin, and the
      # shape snapshot.
      #
      # Identify the App by its Client ID, not its App ID: `app-id` carries a
      # deprecationMessage as of the action's v3, and GitHub recommends the
      # client ID as the JWT `iss` claim.
      - name: Require the release App credentials
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY must be set." >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The App token is persisted as the checkout's credential, which is what
      # the push step below authenticates with. Do not set
      # persist-credentials: false here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Only one step reads a file at another revision — `git show
          # "$update_ref:models/aws/VERSION"`, a two-line file — and a partial
          # clone fetches it on demand. Everything else is `git rev-parse`,
          # `git fetch`, `git switch` onto a ref whose tree the checkout
          # already materialised, and generator runs against the working tree.
          # This is the mirror of api-models-aws being cloned below: the
          # revision-pinned upstream mirror is the large fetch this job cares
          # about, and it is already cached. Overcast's own blobs never were.
          filter: blob:none

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compare the pinned and upstream revisions
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(sed -n 's/^source=//p' models/aws/VERSION)"
          pinned_revision="$(sed -n 's/^revision=//p' models/aws/VERSION)"
          if [[ "$source_url" != "https://github.com/aws/api-models-aws" ]]; then
            echo "Unexpected AWS model source: $source_url" >&2
            exit 1
          fi
          latest_revision="$(git ls-remote "$source_url" HEAD | awk '{print $1}')"
          test -n "$pinned_revision"
          test -n "$latest_revision"
          {
            echo "source_url=$source_url"
            echo "pinned_revision=$pinned_revision"
            echo "latest_revision=$latest_revision"
          } >> "$GITHUB_OUTPUT"
          if [[ "$pinned_revision" == "$latest_revision" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "AWS API models are current at $pinned_revision." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect the dedicated update branch
        if: steps.upstream.outputs.changed == 'true'
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST_REVISION: ${{ steps.upstream.outputs.latest_revision }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          expected_revision=""
          refresh_needed="true"
          pr_number="$(gh pr list \
            --state open \
            --base main \
            --head "$UPDATE_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ "$EVENT_NAME" == "push" && -z "$pr_number" ]]; then
            # main moved, but there is no open PR for it to have gone stale.
            # Opening one is the weekly run's job.
            refresh_needed="false"
            echo "A push to main touched the model inputs, but no refresh PR is open; the weekly run opens the next one." >> "$GITHUB_STEP_SUMMARY"
          elif git fetch origin "+refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"; then
            update_ref="refs/remotes/origin/$UPDATE_BRANCH"
            expected_revision="$(git rev-parse "$update_ref")"
            update_pin="$(git show "$update_ref:models/aws/VERSION" | sed -n 's/^revision=//p')"
            update_parent="$(git rev-parse "$update_ref^")"
            current_main="$(git rev-parse origin/main)"
            if [[ "$update_pin" == "$LATEST_REVISION" && "$update_parent" == "$current_main" && -n "$pr_number" ]]; then
              refresh_needed="false"
              echo "Open PR #$pr_number already contains $LATEST_REVISION on current main." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "expected_revision=$expected_revision"
            echo "refresh_needed=$refresh_needed"
          } >> "$GITHUB_OUTPUT"
          if [[ "$refresh_needed" == "true" ]]; then
            git switch --force-create "$UPDATE_BRANCH" origin/main
          fi

      - name: Restore the verified upstream Git mirror
        if: steps.upstream.outputs.changed == 'true' && steps.branch.outputs.refresh_needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.MODEL_MIRROR }}
          key: aws-api-models-${{ runner.os }}-${{ steps.upstream.outputs.latest_revision }}
          restore-keys: |
            aws-api-models-${{ runner.os }}-

      - name: Fetch and verify the model revisions
        if: steps.upstream.outputs.changed == 'true' && steps.branch.outputs.refresh_needed == 'true'
        shell: bash
        env:
          SOURCE_URL: ${{ steps.upstream.outputs.source_url }}
          PINNED_REVISION: ${{ steps.upstream.outputs.pinned_revision }}
          LATEST_REVISION: ${{ steps.upstream.outputs.latest_revision }}
        run: |
          set -euo pipefail
          if [[ ! -d "$MODEL_MIRROR" ]]; then
            git clone --mirror "$SOURCE_URL" "$MODEL_MIRROR"
          else
            git --git-dir="$MODEL_MIRROR" remote set-url origin "$SOURCE_URL"
            git --git-dir="$MODEL_MIRROR" fetch --prune origin '+refs/*:refs/*'
          fi
          git --git-dir="$MODEL_MIRROR" cat-file -e "$PINNED_REVISION^{commit}"
          git --git-dir="$MODEL_MIRROR" cat-file -e "$LATEST_REVISION^{commit}"
          test "$(git --git-dir="$MODEL_MIRROR" rev-parse HEAD)" = "$LATEST_REVISION"

      - name: Generate the baseline and refreshed inventories
        if: steps.upstream.outputs.changed == 'true' && steps.branch.outputs.refresh_needed == 'true'
        id: generate
        shell: bash
        env:
          PINNED_REVISION: ${{ steps.upstream.outputs.pinned_revision }}
          LATEST_REVISION: ${{ steps.upstream.outputs.latest_revision }}
        run: |
          set -euo pipefail
          git clone "$MODEL_MIRROR" "$MODEL_CHECKOUT"
          git -C "$MODEL_CHECKOUT" checkout --detach "$PINNED_REVISION"
          go run ./cmd/awsmodelgen \
            -models "$MODEL_CHECKOUT/models" \
            -output "$RUNNER_TEMP/baseline-manifest.go" \
            -source-revision "$PINNED_REVISION" \
            -inventory-output "$RUNNER_TEMP/baseline-inventory.json"

          # The committed manifest, pruned shape snapshot and SDK shape tables must already be
          # faithful to the revision they record, or this refresh would carry
          # that drift silently forward. This is the only genuine staleness
          # check in the run: the -check that aws-models-check performs below
          # compares both artifacts against the revision they were just
          # generated from, so it can only prove determinism.
          go run ./cmd/awsmodelgen \
            -models "$MODEL_CHECKOUT/models" \
            -output internal/awsapi/manifest.gen.go \
            -source-revision "$PINNED_REVISION" \
            -shapes-out models/aws/shapes \
            -shapes-services models/aws/shapes-services.txt \
            -sdk-shapes-out internal/awsshapes \
            -sdk-shapes-services models/aws/sdk-shapes-services.txt \
            -check

          git -C "$MODEL_CHECKOUT" checkout --detach "$LATEST_REVISION"
          model_date="$(git -C "$MODEL_CHECKOUT" show -s --format=%cs "$LATEST_REVISION")"
          # Named from the upstream commit date and revision, not from today, so
          # a re-run of the same refresh rewrites one fragment instead of
          # leaving a second one behind under a new date.
          fragment=".changelog/${model_date//-/}-aws-models-${LATEST_REVISION:0:12}.md"
          go run ./cmd/awsmodelgen \
            -models "$MODEL_CHECKOUT/models" \
            -output internal/awsapi/manifest.gen.go \
            -source-revision "$LATEST_REVISION" \
            -inventory-output "$RUNNER_TEMP/current-inventory.json" \
            -baseline-inventory "$RUNNER_TEMP/baseline-inventory.json" \
            -summary-output "$RUNNER_TEMP/aws-model-summary.md" \
            -changelog-output "$fragment" \
            -shapes-out models/aws/shapes \
            -shapes-services models/aws/shapes-services.txt \
            -sdk-shapes-out internal/awsshapes \
            -sdk-shapes-services models/aws/sdk-shapes-services.txt \
            -version-file models/aws/VERSION \
            -model-date "$model_date"
          echo "model_date=$model_date" >> "$GITHUB_OUTPUT"
          # awsmodelgen writes the fragment only when the diff moves a category
          # a caller can observe, so its absence is the evidence the PR step
          # waives the changelog gate on — not an assumption that a bot's PR
          # never needs an entry.
          if [[ -f "$fragment" ]]; then
            echo "changelog_fragment=$fragment" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "### Changelog fragment"
              echo
              echo "\`$fragment\`"
              echo
              sed 's/^/> /' "$fragment"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changelog_fragment=" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/aws-model-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate generated ownership and full regeneration
        if: steps.upstream.outputs.changed == 'true' && steps.branch.outputs.refresh_needed == 'true'
        id: validate
        continue-on-error: true
        shell: bash
        env:
          AWS_MODELS_DIR: ${{ env.MODEL_CHECKOUT }}/models
          AWS_MODELS_REVISION: ${{ steps.upstream.outputs.latest_revision }}
        run: |
          set -euo pipefail
          # A failure here is a legitimate finding (AWS moved a binding this
          # repo implements), not noise. continue-on-error lets the branch
          # and PR steps below still run so that finding lands somewhere a
          # maintainer will see it, instead of a red scheduled run nobody
          # opens. The captured log feeds the PR body.
          make aws-models-check 2>&1 | tee "$RUNNER_TEMP/aws-models-check.log"

      - name: Commit and update the dedicated branch
        if: steps.upstream.outputs.changed == 'true' && steps.branch.outputs.refresh_needed == 'true'
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_REVISION: ${{ steps.branch.outputs.expected_revision }}
          LATEST_REVISION: ${{ steps.upstream.outputs.latest_revision }}
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code; then
            echo "The upstream commit produced no tracked model changes." >&2
            exit 1
          fi
          # Author the commit as the App that pushes it. The old identity
          # paired an "overcast-model-bot" name with the github-actions[bot]
          # noreply address, which GitHub attributed to neither.
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          # The shape snapshot is regenerated in the same run and must land in
          # the same commit as the revision bump, or shapes-sha256 would already
          # describe a snapshot that is not in the tree. The changelog fragment
          # is here for the same reason: it describes this revision's diff, so a
          # commit carrying one without the other would misdescribe itself.
          # .changelog/ is added as a directory because the fragment is written
          # only for a refresh that warrants one.
          git add internal/awsapi/manifest.gen.go models/aws/VERSION models/aws/shapes internal/awsshapes .changelog
          git commit -m "chore(aws-models): refresh pinned API models"
          if [[ -n "$EXPECTED_REVISION" ]]; then
            git push \
              --force-with-lease="refs/heads/$UPDATE_BRANCH:$EXPECTED_REVISION" \
              origin "HEAD:refs/heads/$UPDATE_BRANCH"
          else
            git push \
              --force-with-lease="refs/heads/$UPDATE_BRANCH:" \
              origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi

      - name: Create or update the model refresh pull request
        if: steps.upstream.outputs.changed == 'true' && steps.branch.outputs.refresh_needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST_REVISION: ${{ steps.upstream.outputs.latest_revision }}
          MODEL_DATE: ${{ steps.generate.outputs.model_date }}
          CHANGELOG_FRAGMENT: ${{ steps.generate.outputs.changelog_fragment }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          short_revision="${LATEST_REVISION:0:12}"
          # This label already reads "Blocked on a named dependency, decision,
          # or verification step" — a failed gate is exactly that, and it
          # keeps anyone merging on autopilot from missing it.
          gate_label="status/blocked"

          if [[ "$VALIDATE_OUTCOME" == "failure" ]]; then
            pr_title="chore(aws-models): refresh to $short_revision — verification failed"
          else
            pr_title="chore(aws-models): refresh to $short_revision"
          fi

          {
            if [[ "$VALIDATE_OUTCOME" == "failure" ]]; then
              echo "**Verification failed — a modeled binding moved.**"
              echo
              echo "\`make aws-models-check\` failed against this refresh: a REST-bound"
              echo "operation, a protocol binding, or a Supported row likely moved"
              echo "upstream. Review the gate output below before merging this by hand —"
              echo "this PR is not safe to merge as-is."
              echo
              echo "<details><summary>Gate output (<code>make aws-models-check</code>)</summary>"
              echo
              echo '```'
              if [[ -s "$RUNNER_TEMP/aws-models-check.log" ]]; then
                tail -c 8000 "$RUNNER_TEMP/aws-models-check.log"
                if [[ "$(wc -c < "$RUNNER_TEMP/aws-models-check.log")" -gt 8000 ]]; then
                  echo
                  echo "... (truncated to the last 8000 characters; see the workflow run for the full log)"
                fi
              else
                echo "(no output captured)"
              fi
              echo '```'
              echo
              echo "</details>"
              echo
            else
              echo "Verification passed — \`make aws-models-check\` is clean against this revision."
              echo
            fi
            echo "This automated PR refreshes the pinned AWS Smithy models to \`$LATEST_REVISION\` ($MODEL_DATE)."
            echo
            cat "$RUNNER_TEMP/aws-model-summary.md"
            echo
            echo "## Verification"
            echo
            if [[ "$VALIDATE_OUTCOME" == "failure" ]]; then
              echo "- \`make aws-models-check\` — **failed**, see gate output above"
            else
              echo "- \`make aws-models-check\` — passed"
            fi
            echo "- Full byte-for-byte regeneration from the verified upstream checkout"
            echo
            echo "This workflow never merges the PR automatically."
          } > "$RUNNER_TEMP/aws-model-pr.md"

          pr_number="$(gh pr list \
            --state open \
            --base main \
            --head "$UPDATE_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --title "$pr_title" \
              --body-file "$RUNNER_TEMP/aws-model-pr.md"
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "$pr_title" \
              --body-file "$RUNNER_TEMP/aws-model-pr.md"
            pr_number="$(gh pr list \
              --state open \
              --base main \
              --head "$UPDATE_BRANCH" \
              --json number \
              --jq '.[0].number // empty')"
          fi

          if [[ "$VALIDATE_OUTCOME" == "failure" ]]; then
            gh pr edit "$pr_number" --add-label "$gate_label"
          else
            gh pr edit "$pr_number" --remove-label "$gate_label"
          fi

          # The changelog gate asks a question only the author can answer, and
          # for this PR the author is awsmodelgen — which answered it by
          # diffing the corpus. A fragment in the commit is one answer; this is
          # the other, and it names what was checked so the waiver can be
          # audited rather than taken on trust. Posting it is only safe because
          # it is unconditional on the *absence* of a fragment, never on the
          # PR being a bot's.
          #
          # A waiver posted after `Changelog entry` has already run is picked up
          # by changelog-waiver.yml re-running it, so this does not race the
          # check that the PR creation above started.
          #
          # Said once per PR: a refresh of an open PR now also runs when main
          # moves, and repeating an unchanged waiver each time only buries the
          # thread. The check reads the latest command, so the first one stands
          # (and so does a maintainer's later /needs-changelog).
          existing_comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" --paginate --jq '.[].body' || true)"
          if [[ -z "$CHANGELOG_FRAGMENT" ]] && ! grep -qF '/no-changelog awsmodelgen diffed this revision' <<<"$existing_comments"; then
            gh pr comment "$pr_number" --body \
              "/no-changelog awsmodelgen diffed this revision against the previous corpus and found no operation added or removed, no protocol-trait or HTTP/target-binding change, and no collision change — the categories that move a request between the S3 fallback, a protocol-correct 501 and a scoped-credential error. Nothing a caller can observe moved, so there is no entry to write. A refresh that does move one of those carries a generated fragment in the commit instead."
          fi
