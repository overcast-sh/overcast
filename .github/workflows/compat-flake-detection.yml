name: Compat Flake Detection

# Runs each compat suite repeatedly against the same code and reports any test
# that does not answer the same way every time.
#
# Both flaky tests found so far were found by accident — someone happened to run
# an unchanged tree through CI twice and noticed the answer had changed. That is
# not a detection strategy, and the cost of missing one is a gate that fails
# unrelated pull requests until somebody investigates. This makes the check
# deliberate and scheduled.
#
# It does not gate anything: it runs nightly on main, and on demand.

on:
  schedule:
    # 03:00 UTC — after the day's merges, before anyone starts.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite(s) to check — comma-separated (empty = all)"
        required: false
        default: ""
      runs:
        description: "How many times to run each suite"
        required: false
        default: "3"

permissions:
  contents: read
  # A detected flake raises its own tracking issue — quarantine without an
  # investigation is just a silenced test.
  issues: write

jobs:
  prepare-matrix:
    name: Prepare suite matrix
    runs-on: ubuntu-latest
    # 3 s: one python step, no checkout.
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - name: Resolve suites
        id: suites
        env:
          SUITE_INPUT: ${{ github.event.inputs.suite }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          all_suites = [
              "node-js-sdk",
              "python-sdk",
              "go-sdk",
              "cli",
              "cdk",
              "java-sdk",
              "dotnet-sdk",
              "rust-sdk",
          ]
          raw = os.environ.get("SUITE_INPUT", "")
          if raw.strip():
              requested = [s.strip() for s in raw.split(",") if s.strip()]
              unknown = [s for s in requested if s not in all_suites]
              if unknown:
                  print(f"Unknown compat suite(s): {', '.join(unknown)}", file=sys.stderr)
                  sys.exit(1)
              suites = [s for s in all_suites if s in requested]
          else:
              suites = all_suites
          print(f"suites={json.dumps(suites)}")
          PY

  detect:
    name: Flake detection (${{ matrix.suite }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    # This job runs each suite N times (3 by default), so it is legitimately
    # long and the default 10 would fail it every night. Measured on the last
    # two nightlies: `cli` 25m00s (33850053762) and 20m40s (33729983159),
    # every other suite 2-8 minutes. Sixty is ~2.4x the slowest, and still
    # leaves room for the `runs` input to be raised to 4 by hand before this
    # needs revisiting.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.prepare-matrix.outputs.suites) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            compat/suites/go-sdk/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: contains(fromJson('["node-js-sdk", "cdk"]'), matrix.suite)
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            compat/suites/node-js-sdk/package-lock.json
            compat/suites/cdk/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: compat/suites/python-sdk/requirements.txt

      - name: Install Node.js deps
        if: contains(fromJson('["node-js-sdk", "cdk"]'), matrix.suite)
        run: npm ci
        working-directory: compat/suites/${{ matrix.suite }}

      - name: Install Python deps
        if: matrix.suite == 'python-sdk'
        run: pip install --quiet -r requirements.txt
        working-directory: compat/suites/python-sdk

      # `-tags slim` does not drop the Lambda init — slim images run Lambda —
      # so this needs it as much as the console build does. Eight matrix legs,
      # one content hash between them.
      - uses: ./.github/actions/lambda-init
      # The aws-sdk shape tables internal/awsshapes embeds: build output, like
      # the Lambda init above, packed from the committed text tables.
      - name: Pack the aws-sdk shape tables
        shell: bash
        run: go run ./cmd/awsshapes-pack

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -tags slim,nosqlite -o bin/overcast ./cmd/overcast
          go build -o bin/compat ./cmd/compat

      - name: Pre-pull the Lambda runtime image
        run: docker pull --quiet public.ecr.aws/lambda/nodejs:20 || true

      # Each iteration gets a freshly started emulator, so state left by the
      # previous run cannot mask — or cause — the variance being looked for.
      - name: Run the suite repeatedly
        env:
          RUNS: ${{ github.event.inputs.runs || '3' }}
        run: |
          set -u
          for i in $(seq 1 "${RUNS}"); do
            echo "── run $i of ${RUNS}"
            # OVERCAST_RDS_MODE=mock matches the compat workflow — flake
            # detection has to run the same emulator the gate does, or it
            # measures a configuration nothing else uses. See issue #614.
            # OVERCAST_LISTEN=0.0.0.0 for the same reason compat.yml sets it:
            # the rust-sdk suite's client runs in a sibling container reaching
            # this binary over the Docker bridge gateway, which the native
            # loopback-only default (#761) is invisible from on this runner.
            OVERCAST_PORT=4566 OVERCAST_STATE=memory OVERCAST_LOG_LEVEL=warn OVERCAST_RDS_MODE=mock OVERCAST_LISTEN=0.0.0.0 ./bin/overcast serve &
            pid=$!
            # 127.0.0.1, not localhost: avoids a dual-stack ::1-first
            # resolution paying an IPv6-then-IPv4 fallback on every retry
            # and on every suite connection (matches compat.yml).
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:4566/_overcast/health > /dev/null && break
              sleep 1
            done
            ./bin/compat \
              --endpoint http://127.0.0.1:4566 \
              --format pretty \
              --suite "${{ matrix.suite }}" \
              --results-file "flake-run-$i.json" || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          done

      - name: Compare the runs
        id: compare
        continue-on-error: true
        env:
          SUITE: ${{ matrix.suite }}
        run: python3 scripts/compat-flake-detect.py flake-run-*.json

      # Detecting a flake and leaving it in a job log achieves nothing: nobody
      # reads a green-by-default nightly. Each cluster of related tests — same
      # suite, same group, so almost certainly one root cause — gets one issue,
      # reopened and re-commented rather than duplicated if it recurs.
      - name: Raise a tracking issue for new flakes
        if: steps.compare.outcome == 'failure' && hashFiles('flake-findings.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE: ${{ matrix.suite }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/compat-flake-issue.py flake-findings.json

      - name: Report quarantine that has gone stale
        if: always()
        run: |
          go run ./cmd/compat --report-flaky-overdue || true

      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-runs-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            flake-run-*.json
            flake-findings.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if new flakes were found
        if: steps.compare.outcome == 'failure'
        run: |
          echo "New flaky test(s) detected — see the job summary and the tracking issue." >&2
          exit 1

  # The candidate → gated soak (docs/plans/compat-coverage-modelgen.md § 3.6).
  #
  # The runs above are already the soak: `./bin/compat --suite <s>` passes no
  # --shard and no OVERCAST_COMPAT_GROUPS, so every suite runs every group it is
  # scoped to, and each loader concatenates registry.generated.json onto
  # registry.json — candidate groups included. Nothing had to be added to make
  # them run; what was missing was anything that reads the result.
  #
  # This job does. It merges the per-suite artifacts back into one report per
  # run (run i of every suite = one nightly), promotes the candidate groups that
  # answered identically across all of them with zero failures, regenerates, and
  # opens the bot PR. It writes compat/model/promotions.json only — the registry
  # is cmd/compatgen's, rewritten by `make generate-compat-model` here, so the
  # two files land in one commit and `compatgen -check` stays green.
  #
  # It is a strict no-op until there is something to promote: with no generated
  # groups, or with the ledger unchanged, no branch is pushed and no PR opened.
  promote:
    name: Promote soaked candidate groups
    needs: detect
    # !cancelled() rather than always(): a red detect leg means that suite found
    # a flake, which is exactly the evidence the promotion rule needs to see,
    # and a leg that did not run at all leaves its suite missing from every run,
    # which the rule blocks on — so nothing is promoted on incomplete evidence
    # either way. A *cancelled* workflow is neither. Somebody pressed cancel, or
    # a newer run superseded this one, and the artifacts are whatever happened
    # to be uploaded before the axe fell; always() would run the soak over that
    # truncated evidence, and a run cancelled midway is the likeliest way for a
    # suite's later runs to be missing without anyone noticing.
    #
    # Only for a full run: a dispatch narrowed to one suite has no evidence
    # about the other backends a group is scoped to, and a promotion is supposed
    # to rest on the whole nightly.
    if: ${{ !cancelled() && github.event.inputs.suite == '' }}
    runs-on: ubuntu-latest
    # A checkout, a Go build, an artifact download and two generator runs. No
    # suite runs here.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # persist-credentials: false for the same reason compat.yml's promotion
      # job sets it: checkout otherwise writes GITHUB_TOKEN into .git/config as
      # an http.extraheader that wins over the App token embedded in the push
      # URL, and the push would go out as github-actions[bot] — whose pushes
      # start no workflow runs, leaving the PR waiting on required checks that
      # never run. Do not re-enable persisted credentials here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download the suite runs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flake-runs-*-${{ github.run_id }}
          path: flake-runs

      # Its own step, and deliberately so. The merge step below runs under
      # `set -uo pipefail` *without* `-e`, so that one run whose artifacts will
      # not merge is dropped rather than killing the job — the soak then sees
      # fewer runs than it needs and blocks, which is the safe outcome. The
      # build has no business inheriting that tolerance: built here, a `go
      # build` failure made every merge fail silently, left `merged` at 0,
      # skipped the soak step through its own `if:`, and finished green having
      # promoted nothing and reported nothing. Under this step's default
      # `bash -e` a broken build fails the job, which is what it is.
      - name: Build the compat CLI
        run: go build -o bin/compat ./cmd/compat

      # One report per nightly run, not per suite: the promotion rule asks
      # whether every suite a group is scoped to answered the same way in run i,
      # so run i has to be a single report spanning the matrix. --merge-results
      # is what compat.yml already uses to fold the suite legs together.
      - name: Merge each run across the suites
        id: merge
        env:
          RUNS: ${{ github.event.inputs.runs || '3' }}
        run: |
          set -uo pipefail
          mkdir -p soak
          merged=0
          for i in $(seq 1 "${RUNS}"); do
            # A run no suite reported is skipped rather than merged into an
            # empty report. An empty run would read as "every suite reported
            # nothing", which the rule treats as a missing suite — a different
            # and misleading finding from "that run did not happen".
            if ! compgen -G "flake-runs/*/flake-run-$i.json" > /dev/null; then
              echo "No suite reported run $i — skipping it."
              continue
            fi
            # Counted only when it actually merged. Incrementing regardless
            # would offer a run as evidence that produced no report, and the
            # warning is what keeps a merge failure from passing for a quiet
            # night.
            if ./bin/compat \
              --merge-results "flake-runs/*/flake-run-$i.json" \
              --results-file "soak/run-${GITHUB_RUN_ID}-$i.json" \
              --format pretty > /dev/null; then
              merged=$((merged + 1))
            else
              echo "::warning title=Compat soak::Could not merge run $i — it does not count toward the soak."
            fi
          done
          echo "Merged $merged of ${RUNS} nightly run(s) for the generated group soak." >> "$GITHUB_STEP_SUMMARY"
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

      # --annotate turns an overdue candidate into a ::warning, so a group that
      # has been unable to agree with itself for a month surfaces on the run
      # rather than only in this log.
      - name: Soak the candidate groups
        id: soak
        if: steps.merge.outputs.merged != '0'
        env:
          RUNS: ${{ github.event.inputs.runs || '3' }}
        run: |
          set -euo pipefail
          ./bin/compat \
            --promote-generated \
            --promote-runs soak \
            --promote-min-runs "${RUNS}" \
            --annotate | tee "$RUNNER_TEMP/soak.log"
          {
            echo
            echo "### Generated group soak"
            echo
            echo '```'
            cat "$RUNNER_TEMP/soak.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$(git status --porcelain -- compat/model/promotions.json)" ]]; then
            echo "Nothing to promote — the ledger is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Step 2 of the native-group migration, beside the promotion soak because
      # it reads the same merged runs: does the authored port of a hand-written
      # group answer exactly as the natives it will replace, per (suite, test)?
      # docs/plans/compat-coverage-modelgen.md §3.11 says a divergence blocks the
      # deletion of the native code and never the gate, so this step reports and
      # does not fail the nightly; the flip PR cites the summary it writes.
      # `continue-on-error` keeps a divergence — which is a finding, not a broken
      # build — from reddening a run whose job is promotion.
      - name: Compare the shadow groups against their natives
        if: steps.merge.outputs.merged != '0'
        continue-on-error: true
        run: |
          set -uo pipefail
          # No --annotate: the flag exists and emits ::error, which is the right
          # loudness for a gate and the wrong one here. A divergence is a finding
          # to triage, not a broken build, and an error annotation on a run whose
          # job is promotion would read as the promotion having failed.
          #
          # The loop writes to a file rather than through a pipe: `... | tee` runs
          # the loop in a subshell, and the exit status it collects would be lost
          # with it.
          : > "$RUNNER_TEMP/shadow.log"
          status=0
          for run in soak/*.json; do
            [ -e "$run" ] || continue
            echo "--- $run" >> "$RUNNER_TEMP/shadow.log"
            if ! ./bin/compat --compare-shadow --results-file "$run" >> "$RUNNER_TEMP/shadow.log" 2>&1; then
              status=1
            fi
          done
          cat "$RUNNER_TEMP/shadow.log"
          {
            echo
            echo "### Shadow-group comparison"
            echo
            echo '```'
            cat "$RUNNER_TEMP/shadow.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The generator owns compat/suites/registry.generated.json and rewrites it
      # wholly from its inputs, of which the ledger is now one. Regenerating in
      # the same job is what keeps the two files consistent in a single commit;
      # -check afterwards proves the commit is byte-for-byte the generator's own
      # output, so the PR cannot land a registry a reviewer would have to trust.
      - name: Regenerate the compat model
        if: steps.soak.outputs.changed == 'true'
        run: |
          set -euo pipefail
          make generate-compat-model
          go run -tags dev ./cmd/compatgen -check

      # A GitHub App installation token, not GITHUB_TOKEN: a PR opened as
      # github-actions[bot] starts no workflow runs, so it would sit forever on
      # required checks that never run. These are the same two secrets
      # compat.yml's baseline promotion uses — this is the other half of the
      # same bot's job — and the same two repository permissions suffice:
      # Contents (push the branch, merge once checks pass) and Pull requests
      # (open it, arm auto-merge). Not Workflows: the commit touches
      # compat/model/ and compat/suites/ and nothing else.
      - name: Check promotion App credentials
        id: app-check
        if: steps.soak.outputs.changed == 'true'
        env:
          CLIENT_ID: ${{ secrets.COMPAT_PROMOTION_CLIENT_ID }}
          APP_KEY: ${{ secrets.COMPAT_PROMOTION_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$APP_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Compat soak::Promotions computed but NOT published: the promotion App credentials (secrets.COMPAT_PROMOTION_CLIENT_ID / secrets.COMPAT_PROMOTION_PRIVATE_KEY) are not configured — see issue #440. Apply compat/model/promotions.json by hand and regenerate until then."
          fi

      - name: Mint promotion App token
        id: promotion-token
        if: steps.app-check.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.COMPAT_PROMOTION_CLIENT_ID }}
          private-key: ${{ secrets.COMPAT_PROMOTION_PRIVATE_KEY }}

      # One coalescing PR on a fixed branch, force-pushed, exactly as the
      # baseline promotion does: successive nights overwrite a superseded
      # promotion rather than opening a second pull request. Branch protection
      # rejects a direct push to main — automation included — so this lands
      # through the same required checks a human edit would.
      - name: Publish the promotion PR
        if: steps.app-check.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.promotion-token.outputs.token }}
          APP_SLUG: ${{ steps.promotion-token.outputs.app-slug }}
        run: |
          set -uo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add compat/model/promotions.json compat/suites/registry.generated.json
          # Belt to the braces of the `changed` output above: an empty commit
          # would be force-pushed as main's own tip and open a pull request with
          # no diff, which is the one outcome this job must never produce.
          if git diff --cached --quiet; then
            echo "Nothing staged — no promotion to publish."
            exit 0
          fi
          git commit -m "chore(compat): promote soaked generated groups" -m "Automated: the nightly flake-detection runs (run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}) agreed on these candidate groups with zero failures."
          # Non-fatal from here down: a promotion is an optimisation, and a
          # dropped one is recomputed by tomorrow's nightly.
          if ! git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:automation/promote-generated; then
            echo "::warning title=Compat soak::Could not push the promotion branch — tomorrow's nightly will recompute it."
            exit 0
          fi
          {
            echo "Automated: generated compat groups that answered identically across the nightly runs"
            echo "with zero failures move from candidate to gated (run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA})."
            echo
            echo "compat/model/promotions.json is the soak ledger cmd/compatgen reads;"
            echo "compat/suites/registry.generated.json is its regenerated output, written by"
            echo "make generate-compat-model in the same job and verified with compatgen -check."
            echo
            echo "Auto-merges when checks pass; a superseded promotion is force-pushed over."
            echo "See docs/plans/compat-coverage-modelgen.md § 3.6."
          } > "$RUNNER_TEMP/promote-pr.md"
          # One coalescing PR: the create fails harmlessly when it already
          # exists (the force-push above updated it), then auto-merge is armed
          # either way.
          gh pr create --head automation/promote-generated --base main --title "chore(compat): promote soaked generated groups" --body-file "$RUNNER_TEMP/promote-pr.md" || true
          if ! gh pr merge automation/promote-generated --squash --auto; then
            echo "::warning title=Compat soak::Promotion PR exists but auto-merge could not be armed — merge it manually."
          fi
