name: Compatibility Tests

# Runs compatibility suites against live, isolated Overcast instances. Suite
# failures are expected and recorded as coverage data; infrastructure failures
# still fail the affected suite job.

# `support/**` runs the full suite, exactly as `main` does. A maintenance
# release is cut from one of those branches (RELEASE.md § Maintenance
# Releases), and a fix cherry-picked onto a line that stopped moving months ago
# is the change least like the code it lands on — which is the case for running
# the suites, not against it. The branch carries the `compat/baseline/` it
# was cut from, so the ratchet it is measured against is its own line's, not
# `main`'s. Inert until such a branch exists; nothing in the repository matches
# it today.
#
# Baseline *promotion* stays on `main` alone — its step is already guarded on
# `github.ref == 'refs/heads/main'` — because a support branch's baseline
# describes an older line and must not drift.
on:
  push:
    branches: [main, "support/**"]
    # The auto-merged baseline-promotion PR lands a commit touching only these
    # files; it must not trigger another full run — see "Publish promotion PR".
    # The baseline is a directory of per-suite shards, so this has to be the
    # glob: naming the old single file would let every promotion start a new
    # run, and each of those runs promotes again.
    paths-ignore:
      - compat/baseline/**
  pull_request:
    branches: [main, "support/**"]
    # Deliberately no `paths-ignore:` here. There used to be one, skipping
    # prose-only pull requests, and its stated premise was that no compat check
    # sat in the branch ruleset's required set. That premise is no longer true:
    # "Aggregate Compatibility Results" is required now. `paths-ignore:` skips
    # the *whole workflow*, so the required check never reported and the pull
    # request waited on it forever — merging #719, a `tests/AGENTS.md`-only
    # change, failed with `Required status check "Aggregate Compatibility
    # Results" is expected.` and no Markdown-only change could land at all.
    #
    # The `changes` job below buys the same saving without that failure mode:
    # every job keeps its name and still reports, and only the expensive steps
    # are conditional. The rule lives in scripts/ci-scope.py and is shared
    # unchanged with test.yml, which gates its own required jobs this way.
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite(s) to run — comma-separated (empty = all)"
        required: false
        default: ""

# One run per pull request; everything else gets a group of its own — see the
# same block in test.yml for why, and for why a ref-keyed fallback is not a
# safe default: GitHub cancels a group's *pending* run when the next arrives
# whatever cancel-in-progress says, and on 2026-08-22 that cost this workflow
# 56 of its 103 push runs to main (32599735265, 32600275730, 32602968080 and
# 32604073853 among them). It matters more here: a run is nine suite jobs
# against live Overcast instances, and the baseline promotion on main reads
# the result of a completed run — a cancelled one promotes nothing. Runs on
# main are not serialized by the group any more, so two can finish out of
# order; the promotion step already tolerates that — successive promotions
# force-push over one fixed branch, the baseline-change lint rejects a
# downgrade, and an improvement a stale promotion overwrote is recomputed by
# the next main run, because it is still an improvement over the recorded
# baseline. The ref group never promised ordering anyway: it dropped the
# pending run rather than queue it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Does this pull request need the suites at all?
  #
  # Same job, same script and same reasoning as test.yml's `changes` — read the
  # long comment there and scripts/ci-scope.py's docstring for why this is a
  # classifier rather than a `paths-ignore:` or a twin "skip" workflow. The
  # short version: a required check that never reports blocks the pull request
  # forever, and a twin workflow reports twice under one name on the mixed
  # doc-plus-handler change.
  #
  # Two things differ from test.yml, both because `compat` and `aggregate` run
  # under `if: always()` and so cannot be skip-cascaded by a failure here:
  #
  #   * the dependent jobs read `code != 'false'`, not `code == 'true'`. A
  #     failed `changes` job leaves the output empty, and empty must mean "run
  #     the suites" — skipping requires positive proof that the change is
  #     prose. `ci-scope.py` already biases this way for every input it sees;
  #     this keeps the bias when it never got to answer.
  #   * `prepare-matrix` does not wait on this job, so it stays off the
  #     critical path: its output feeds the `if:` guards on `compat` and
  #     `aggregate`, which must hold whatever the changed paths are.
  changes:
    name: Changed-path scope
    runs-on: ubuntu-latest
    # 6 s on the last two real runs (33945978853, 33944965489): a shallow
    # checkout and one paginated API call. Five minutes is the floor this
    # file uses for a job whose work is seconds — enough that a slow runner
    # or a retried API call never trips it, short enough that a wedged one
    # does not hold a concurrency slot for six hours.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # --paginate so a pull request over 100 files is classified on all of
          # them; a truncated list could read as prose-only. On anything that is
          # not a pull request — a push to main, a release, a manual dispatch —
          # the script answers true before reading stdin.
          #
          # `|| true` is load-bearing, exactly as in test.yml: a hard failure
          # here would decide the compat gate on a GitHub API blip. An empty
          # list means "could not tell", which ci-scope.py answers with
          # code=true: run everything.
          files=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' || true)
          fi
          printf '%s\n' "$files" | python3 scripts/ci-scope.py >> "$GITHUB_OUTPUT"
      - name: What was decided
        env:
          CODE: ${{ steps.scope.outputs.code }}
        run: |
          if [ "$CODE" = "true" ]; then
            echo "Code changed — running the compat suites."
          else
            echo "Prose only — an SDK cannot talk to the emulator any differently."
          fi

  # Not gated: one python step, no checkout, and both `compat` and `aggregate`
  # guard themselves on `needs.prepare-matrix.result == 'success'`, so this has
  # to run and succeed even when there is nothing to test.
  prepare-matrix:
    name: Prepare suite matrix
    runs-on: ubuntu-latest
    # 3-4 s: one python step, no checkout.
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - name: Resolve suites
        id: suites
        env:
          SUITE_INPUT: ${{ github.event.inputs.suite }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          all_suites = [
              "node-js-sdk",
              "python-sdk",
              "go-sdk",
              "cli",
              "cdk",
              "java-sdk",
              "dotnet-sdk",
              "rust-sdk",
          ]
          raw = os.environ.get("SUITE_INPUT", "")
          if raw.strip():
              requested = [s.strip() for s in raw.split(",") if s.strip()]
              unknown = [s for s in requested if s not in all_suites]
              if unknown:
                  print(f"Unknown compat suite(s): {', '.join(unknown)}", file=sys.stderr)
                  sys.exit(1)
              suites = [s for s in all_suites if s in requested]
          else:
              suites = all_suites
          print(f"suites={json.dumps(suites)}")
          PY

  # A job-level `if:` rather than the step-level gate the jobs below use: this
  # job already skips itself whenever rust-sdk is not in the matrix, so it
  # demonstrably reports nothing anyone waits on, and `compat` tolerates it
  # being skipped (`if: always()` plus an explicit result test on the two jobs
  # it does need).
  rust-sdk-image:
    name: Prepare rust-sdk compat image
    needs: [changes, prepare-matrix]
    if: needs.changes.outputs.code != 'false' && contains(needs.prepare-matrix.outputs.suites, '"rust-sdk"')
    runs-on: ubuntu-latest
    # 7-12 s when it decides nothing changed, which is almost always; 115 s
    # the last time it actually built (run 33944335768). Thirty rather than
    # 3x that, deliberately: 115 s was a warm `type=gha` buildx cache, and a
    # cold one compiles the Rust SDK suite from source. This is the one job
    # here whose worst case is not in the sample.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits, not the whole history. The only history this job has
          # ever read is `git diff --name-only HEAD^1 HEAD` in "Detect
          # rust-sdk image input changes" below, which needs HEAD and its
          # first parent and nothing further back — the same shape, and the
          # same reasoning, as test.yml's `version-guard`. On a `pull_request`
          # HEAD is GitHub's refs/pull/N/merge, so HEAD^1 is the base tip and
          # the diff is this pull request's own changes.
          #
          # The push branch of that step diffs github.event.before against
          # github.sha instead. This repository squash-merges, so a push to
          # main is one commit and `before` is HEAD^1 — in the clone at depth
          # 2. It does not have to be, and it does not matter if it is not:
          # on anything but a pull request the rebuild is decided by the
          # `exists` check below, against a tag that is a content hash of the
          # rust-sdk sources and both registry halves
          # (compat/suites/rust-sdk/image-tag.sh). Changed inputs mean a tag
          # nothing has published, so the image is built and pushed whatever
          # the diff said. The path list is the *conservative* trigger — it
          # also names .github/workflows/compat.yml, which the tag deliberately
          # does not — and it is the pull-request path that relies on it.
          #
          # So nothing here wanted 1098 commits and a ~317 MiB pack; it wanted
          # one parent.
          fetch-depth: 2

      - name: Compute image tag
        id: tag
        run: |
          TAG=$(compat/suites/rust-sdk/image-tag.sh)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed rust-sdk compat image tag: ${TAG}"

      - name: Detect rust-sdk image input changes
        id: changes
        run: |
          changed=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files=$(git diff --name-only HEAD^1 HEAD)
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              changed_files=$(git ls-tree -r --name-only "$head")
            else
              changed_files=$(git diff --name-only "$before" "$head")
            fi
          else
            changed_files=""
          fi

          while IFS= read -r path; do
            case "$path" in
              compat/suites/rust-sdk/*|compat/suites/registry.json|.github/workflows/compat.yml)
                changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Rust SDK image inputs changed: ${changed}"

      - name: Set lowercase image name
        id: img
        run: |
          REPO_LC=$(tr '[:upper:]' '[:lower:]' <<< "${{ github.repository }}")
          echo "image=ghcr.io/${REPO_LC}/rust-sdk-compat" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: exists
        if: github.event_name != 'pull_request'
        run: |
          if docker manifest inspect "${{ steps.img.outputs.image }}:${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Exact rust-sdk compat image already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Exact rust-sdk compat image is missing."
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.changes.outputs.changed == 'true' || (github.event_name != 'pull_request' && steps.exists.outputs.exists != 'true')

      - name: Build and maybe push image
        if: steps.changes.outputs.changed == 'true' || (github.event_name != 'pull_request' && steps.exists.outputs.exists != 'true')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: compat/suites
          file: compat/suites/rust-sdk/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest
          cache-from: type=gha,scope=rust-sdk-compat
          cache-to: type=gha,mode=max,scope=rust-sdk-compat

  build-binaries:
    name: Build Overcast compat binaries
    needs: [changes, prepare-matrix]
    runs-on: ubuntu-latest
    # 82 s (33945978853) and 70 s (33944965489), before the SPA build came
    # out of it and the Lambda init started coming from cache.
    timeout-minutes: 10
    # Named once, read by every step below. `!= 'false'` and not `== 'true'`:
    # see the note on the `changes` job — anything other than a definite "this
    # is prose" runs the suites.
    env:
      RUN_SUITES: ${{ needs.changes.outputs.code != 'false' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_SUITES == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN_SUITES == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: ./.github/actions/lambda-init
        if: env.RUN_SUITES == 'true'
      # The aws-sdk shape tables internal/awsshapes embeds: build output, like
      # the Lambda init above, packed from the committed text tables.
      - name: Pack the aws-sdk shape tables
        if: env.RUN_SUITES == 'true'
        shell: bash
        run: go run ./cmd/awsshapes-pack

      # No SPA build, and no pnpm at all. `bin/overcast` is untagged, so it
      # embeds `all:web/dist` — but the committed `web/dist/.gitkeep` is what
      # keeps that pattern resolving, and a binary without a real SPA serves
      # the API normally and answers 503 on the UI port. That is documented
      # behaviour, not a broken build (test.yml says the same thing above its
      # `vet` job, and docs/plans/ci-streamlining.md § C is where it was first
      # established).
      #
      # Nothing the suites do could tell the difference. None of the eight
      # touches the UI port or asks for SPA content: grepping every suite for
      # `4567` finds only CloudFront key-group ids (`K1234567890ABCDE`) and an
      # EC2 AMI id, `index.html` finds only the S3
      # PutBucketWebsite/GetBucketWebsite configuration literal, and `web/dist`
      # finds nothing. The suites speak to the API over 4566.
      #
      # compat-flake-detection.yml already had this shape — it builds
      # `-tags slim,nosqlite` and has never set up Node — so there is nothing
      # to remove there.
      - name: Build binaries
        if: env.RUN_SUITES == 'true'
        run: |
          mkdir -p bin
          go build -o bin/overcast ./cmd/overcast
          go build -o bin/compat ./cmd/compat

      # if-no-files-found: error below is why this needs the gate rather than
      # relying on an empty bin/ being harmless.
      - name: Upload binaries
        if: env.RUN_SUITES == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overcast-compat-binaries-${{ github.sha }}
          path: |
            bin/overcast
            bin/compat
          if-no-files-found: error
          retention-days: 7

  compat:
    name: Compatibility Tests (${{ matrix.suite }})
    needs:
      - changes
      - prepare-matrix
      - build-binaries
      - rust-sdk-image
    if: always() && needs.prepare-matrix.result == 'success' && needs.build-binaries.result == 'success'
    runs-on: ubuntu-latest
    # One value for every leg, so it has to fit the slowest: `cli` at 476 s
    # (33945978853) and 363 s (33944965489), against 44-103 s for the other
    # seven. Thirty is above compat/runner.go's own `suiteHardTimeout` of 25
    # minutes on purpose — the runner's per-suite net should fire first,
    # because it kills the subprocess and writes a result that says which
    # suite hung, where this cancels the job and says nothing.
    timeout-minutes: 30
    # The job keeps its name and still reports; only the steps are conditional.
    # A gated-off build-binaries still concludes `success`, so the guard above
    # is unaffected.
    env:
      RUN_SUITES: ${{ needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.prepare-matrix.outputs.suites) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_SUITES == 'true'

      - name: Download binaries
        if: env.RUN_SUITES == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overcast-compat-binaries-${{ github.sha }}
          path: bin

      - name: Make binaries executable
        if: env.RUN_SUITES == 'true'
        run: chmod +x bin/overcast bin/compat

      # Must precede the Lambda runtime pre-pull below and every suite image:
      # this restarts the Docker daemon, so anything already running would be
      # torn down with it.
      - uses: ./.github/actions/docker-hub-mirror
        if: env.RUN_SUITES == 'true'

      # ECS task definitions intentionally use the public-ECR nginx reference,
      # but Docker daemon registry mirrors only apply to Docker Hub. Seed a
      # compatible nginx image through mirror.gcr.io and tag it with the
      # exact task image name. These tests exercise task lifecycle, not image
      # contents. ImagePuller still tries the configured reference, then safely
      # falls back to this local copy when public ECR throttles the request.
      - name: Pre-pull the ECS task image through the Docker Hub mirror
        if: env.RUN_SUITES == 'true'
        run: |
          docker pull --quiet nginx:latest
          docker tag nginx:latest public.ecr.aws/nginx/nginx:latest

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN_SUITES == 'true' && contains(fromJson('["go-sdk", "cli"]'), matrix.suite)
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            compat/suites/go-sdk/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN_SUITES == 'true' && contains(fromJson('["node-js-sdk", "cdk"]'), matrix.suite)
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            compat/suites/node-js-sdk/package-lock.json
            compat/suites/cdk/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.RUN_SUITES == 'true' && matrix.suite == 'python-sdk'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: compat/suites/python-sdk/requirements.txt

      - name: Install Node.js deps (node-js-sdk)
        if: env.RUN_SUITES == 'true' && matrix.suite == 'node-js-sdk'
        run: npm ci
        working-directory: compat/suites/node-js-sdk

      - name: Install Node.js deps (cdk)
        if: env.RUN_SUITES == 'true' && matrix.suite == 'cdk'
        run: npm ci
        working-directory: compat/suites/cdk

      - name: Type check cdk suite
        if: env.RUN_SUITES == 'true' && matrix.suite == 'cdk'
        run: npm run typecheck
        working-directory: compat/suites/cdk

      - name: Install Python deps (python-sdk)
        if: env.RUN_SUITES == 'true' && matrix.suite == 'python-sdk'
        run: pip install --quiet -r requirements.txt
        working-directory: compat/suites/python-sdk

      # Lambda invocation, ESM delivery and the CDK stream tests execute real
      # containers. The runner has a Docker daemon, so pull the runtime image up
      # front: a cold pull inside a test's function-Active wait is what used to
      # time out. Best-effort — a pull failure shows up as the test failing,
      # which is the honest result.
      # Both images the suites' functions actually use: node for the JS/CDK
      # groups, python for the cli and python-sdk lambda groups. Without the
      # python pre-pull, cli/lambda-invoke's function sat in Pending behind a
      # cold pull for its whole invoke sequence (the R7 InvokeDryRun failure).
      - name: Pre-pull the Lambda runtime images
        if: env.RUN_SUITES == 'true'
        run: |
          docker pull --quiet public.ecr.aws/lambda/nodejs:20 || true
          docker pull --quiet public.ecr.aws/lambda/python:3.12 || true

      # OVERCAST_RDS_MODE=mock keeps RDS metadata-only here. `available` now
      # means the engine answered, which is honest but costs a real MySQL first
      # boot — image pull plus data-directory initialisation — per instance,
      # across eight suites, on a shared runner. The python suite timed out
      # waiting and the java suite reported the timeout as a bogus precondition
      # error. This leaves the RDS container path with no automated coverage at
      # all — issue #614 covers both getting compat back to live mode and the
      # Go-side integration test that should have been guarding it regardless.
      # OVERCAST_LISTEN=0.0.0.0 is explicit rather than relying on the
      # native default (#761, which narrows an unset OVERCAST_LISTEN to
      # loopback): the rust-sdk suite's test client runs in a sibling
      # container reaching this binary over the Docker bridge gateway
      # (compat/suites/rust-sdk/run.sh's host.docker.internal rewrite), and
      # a loopback-only bind is invisible from there on this runner's plain
      # (non-Desktop) Docker daemon. This job is a throwaway CI runner, so
      # the wildcard costs nothing here.
      - name: Start Overcast
        if: env.RUN_SUITES == 'true'
        run: |
          OVERCAST_PORT=4566 \
          OVERCAST_STATE=memory \
          OVERCAST_LOG_LEVEL=warn \
          OVERCAST_RDS_MODE=mock \
          OVERCAST_LISTEN=0.0.0.0 \
            ./bin/overcast serve &
          echo "OVERCAST_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Overcast to become healthy
        if: env.RUN_SUITES == 'true'
        run: |
          # 127.0.0.1, not localhost: avoids a dual-stack ::1-first resolution
          # paying an IPv6-then-IPv4 fallback on every retry.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4566/_overcast/health > /dev/null; then
              echo "Overcast ready (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "Overcast did not become healthy within 30 s" >&2
          exit 1

      # OVERCAST_COMPAT_SKIP_DOCKER is deliberately NOT set: skipping the
      # Docker-dependent tests in CI hid Lambda invocation and ESM delivery
      # entirely — the emulator answered from its stub and nothing noticed. It
      # stays available as a local opt-out for machines without a daemon.
      - name: Run compat suite
        if: env.RUN_SUITES == 'true'
        env:
          # 127.0.0.1, not localhost: see the health-check step above.
          OVERCAST_ENDPOINT: http://127.0.0.1:4566
          OVERCAST_COMPAT_RESULTS_FILE: compat-results-${{ matrix.suite }}.json
          # A tuning knob, for the `cli` suite only.
          #
          # `cli` is the one suite that does not hold a client library open: it
          # spawns a fresh `aws` process per API call — at least 1149 static
          # call sites under compat/suites/cli/internal/groups/, dispatched
          # through awscli.go — so a slot spends most of its life blocked on
          # process start and Python import, not on the emulator. Eight slots
          # on a 4-vCPU runner therefore under-subscribes badly: `go-sdk` runs
          # the same registry in 61 s where `cli` takes 348 s. Sixteen lets
          # twice as many of those waits overlap without asking anything more
          # of Overcast, which is answering the same requests either way.
          #
          # Unset for every other suite, so each keeps the runner's own
          # `max(8, 2×CPU)` budget.
          #
          # RE-CHECK THIS AGAINST compat-flake-detection.yml after a week. More
          # concurrency is the classic way to turn a latent ordering bug into
          # an intermittent one, and the nightly N-runs-per-suite job is what
          # would see it first. If `cli` starts appearing in flake findings,
          # this is the first thing to put back.
          OVERCAST_COMPAT_PARALLEL_SLOTS: ${{ matrix.suite == 'cli' && '16' || '' }}
        run: |
          ./bin/compat \
            --endpoint http://127.0.0.1:4566 \
            --format pretty \
            --suite "${{ matrix.suite }}" \
            --results-file "compat-results-${{ matrix.suite }}.json"

      - name: Stop Overcast
        if: always() && env.RUN_SUITES == 'true'
        run: |
          if [[ -n "${OVERCAST_PID:-}" ]]; then
            kill "$OVERCAST_PID" 2>/dev/null || true
          fi

      - name: Upload suite compat results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.RUN_SUITES == 'true'
        with:
          name: compat-results-${{ matrix.suite }}-${{ github.sha }}
          path: compat-results-${{ matrix.suite }}.json
          if-no-files-found: error
          retention-days: 90

  # This job's name is a required status check on main, which is what makes the
  # shape below mandatory rather than stylistic: it must run, and report, on
  # every pull request — including one that changed nothing worth testing. So
  # the job is unconditional and its whole body is gated, and when there is
  # nothing to aggregate it says so and succeeds. Nothing here runs against an
  # empty result set: the download would match no artifact and --merge-results
  # would be handed zero files, both of which fail.
  #
  # The baseline-promotion steps are the exception and deliberately carry no
  # gate. They only ever run on a push to main, where the classifier answers
  # true unconditionally, and each is already chained on a step output or
  # outcome that a skipped predecessor cannot produce — so they are inert here
  # without a fourth condition to keep in sync.
  aggregate:
    name: Aggregate Compatibility Results
    needs:
      - changes
      - prepare-matrix
      - compat
    if: always() && needs.prepare-matrix.result == 'success'
    runs-on: ubuntu-latest
    # 43 s (33945978853) and 29 s (33944965489). Ten because the promotion
    # path on main does more than the sample ever measured — a force-push,
    # `gh pr create` and arming auto-merge — and each of those is a network
    # call that can retry.
    timeout-minutes: 10
    env:
      RUN_SUITES: ${{ needs.changes.outputs.code != 'false' }}
    permissions:
      # contents: write — the baseline-promotion commit on main.
      # pull-requests: write — the sticky digest comment.
      # checks: write — the JUnit check run.
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Nothing to aggregate
        if: env.RUN_SUITES != 'true'
        run: |
          echo "Prose-only pull request: no suite ran, so there are no results" \
               "to merge and no baseline to compare. Reporting success."

      # persist-credentials: false — by default checkout writes GITHUB_TOKEN
      # into .git/config as an `http.extraheader` Authorization header on every
      # github.com request, and that header wins over credentials embedded in a
      # URL. "Publish promotion PR" below force-pushes with the promotion App
      # token in the URL, and under the default that push went out as
      # github-actions[bot] anyway (the PR timeline showed it: the PR *opened*
      # as overcast-compat[bot] via `gh`, which reads GH_TOKEN, but every
      # force-push was github-actions[bot]). Since mid-2026 GitHub holds
      # pull_request workflows for a head updated by github-actions[bot] in
      # `action_required` until a maintainer approves them — so every
      # promotion sat waiting for a click (PR #1347). Nothing else in this job
      # fetches or pushes through git; the base checkout below authenticates
      # itself, and the push supplies its own token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_SUITES == 'true'
        with:
          persist-credentials: false

      # The two lint steps below compare this PR's compat files against the
      # base revision, which the shallow checkout above (fetch-depth 1, the
      # merge ref only) does not put in the object store. Letting checkout
      # fetch it beats shelling out to `git fetch` inside each lint step: the
      # action retries a transient git failure, where a bare fetch under
      # `bash -e` aborts the step on the first one. That is how run
      # 30799505091 failed on #562 — a 503 from GitHub killed the step before
      # the linter ran, and `continue-on-error` handed the gate an outcome it
      # reported as "a new quarantine, or an entry without a reason" on a PR
      # that touches no compat files at all.
      #
      # sparse-checkout because only compat/ is read. base.sha rather than the
      # live tip of main so the verdict is deterministic — the same commit
      # cannot pass one run and fail the next because main moved underneath it
      # — and so the lint agrees with the diff a reviewer sees on the PR.
      - name: Check out base compat files
        if: env.RUN_SUITES == 'true' && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: compat

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN_SUITES == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download suite results
        if: env.RUN_SUITES == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compat-results-*-${{ github.sha }}
          path: compat-results
          merge-multiple: true

      - name: Merge suite results
        if: env.RUN_SUITES == 'true'
        run: |
          go run ./cmd/compat \
            --merge-results "compat-results/compat-results-*.json" \
            --results-file compat-results.json \
            --format pretty

      # --annotate turns each regression into an ::error workflow command, so it
      # lands on the PR's checks tab instead of only in this log. Kept
      # continue-on-error so the surfacing steps below always run; the outcome is
      # re-asserted in "Enforce compat gates" at the end of the job.
      - name: Compare compat baseline
        id: baseline
        if: env.RUN_SUITES == 'true'
        continue-on-error: true
        run: |
          go run ./cmd/compat \
            --compare-baseline --annotate \
            --baseline-file compat/baseline \
            --results-file compat-results.json \
            2>baseline-regressions.txt

      # The absolute gate, next to the relative one. --compare-baseline asks
      # whether anything got worse than compat/baseline records; this asks
      # whether anything failed at all. They are not the same question while the
      # baseline can record a `fail`: the recorded fail set reached zero in
      # #462, and this step is what stops it growing again through a stale or
      # hand-edited file. Quarantined flaky tests stay exempt.
      #
      # Unlike the steps around it, stderr stays in the step log: nothing
      # downstream reads it, and with the baseline at zero these failures are
      # baseline regressions too, so the job summary and JUnit report already
      # render them from baseline-regressions.txt.
      - name: Enforce zero compat failures
        id: failures
        if: env.RUN_SUITES == 'true'
        continue-on-error: true
        run: |
          go run ./cmd/compat \
            --max-failures 0 --annotate \
            --results-file compat-results.json

      - name: Check cross-suite parity
        id: parity
        if: env.RUN_SUITES == 'true'
        continue-on-error: true
        run: |
          go run ./cmd/compat \
            --check-parity --annotate \
            --registry-file compat/suites/registry.json \
            --parity-debt-file compat/parity-debt.json \
            --results-file compat-results.json \
            2>parity-issues.txt

      # Gating this lint and the flaky one below is safe for the same reason the
      # whole gate is: compat/baseline/ and compat/flaky.json are not prose,
      # so a pull request that edits either classifies as code and is linted
      # exactly as today.
      #
      # The base commit's baseline is whichever layout that commit had: a
      # directory of shards after the split, a single compat/baseline.json
      # before it. --baseline-file reads both, so both are offered here — a
      # base commit older than the split must still be lintable against, or
      # every long-lived branch loses its downgrade gate on rebase.
      #
      # The registry, by contrast, is deliberately the *pull request's* — the
      # unprefixed paths, not `base/` ones. It is what decides whether a removed
      # expectation is one the suite is still asked to produce, and the pull
      # request is what changes that scope: judging its baseline against the base
      # commit's registry would report every legitimate scope change as a
      # downgrade, which is the fault reading the registry exists to avoid.
      - name: Lint compat baseline changes
        id: baseline-lint
        if: env.RUN_SUITES == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          from=""
          if [[ -d base/compat/baseline ]]; then
            from=base/compat/baseline
          elif [[ -f base/compat/baseline.json ]]; then
            from=base/compat/baseline.json
          fi
          if [[ -n "$from" ]]; then
            go run ./cmd/compat \
              --lint-baseline-from "$from" \
              --lint-baseline-to compat/baseline \
              --registry-file compat/suites/registry.json \
              --generated-registry-file compat/suites/registry.generated.json \
              --annotate
          else
            echo "No baseline exists on the base commit yet; skipping downgrade lint."
          fi

      # The per-shard size budget. Sharding only helps while a shard stays
      # small enough to review; this is what says so out loud instead of
      # letting the files creep back to where they were before the split.
      # Unlike the lint above it is not pull-request-only: the promotion bot on
      # main is what actually grows the baseline.
      - name: Check compat baseline shard sizes
        id: baseline-size
        if: env.RUN_SUITES == 'true'
        continue-on-error: true
        run: |
          go run ./cmd/compat \
            --lint-baseline-size --annotate \
            --baseline-file compat/baseline

      # Quarantining a test removes it from the baseline gate in both
      # directions, so growing the list is how a failure gets silenced. That is
      # a reviewer's call, not CI's — and the reviewer expresses it by applying
      # the quarantine-approved label to the PR. Labels are read live from the
      # API (the event payload is frozen at trigger time), so applying the
      # label and re-running this job is enough; no new push needed. The label
      # waives growth only: entries without a reason/issue/date, and overdue
      # entries, still fail.
      - name: Lint compat flaky list changes
        id: flaky-lint
        if: env.RUN_SUITES == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          growth=""
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' | grep -qx 'quarantine-approved'; then
            echo "quarantine-approved label present — a reviewer has agreed to the new quarantine(s)."
            growth="--flaky-growth-approved"
          fi
          # No guard on the from-file: readFlakyFileRaw treats a missing path
          # as an empty list, which is what a base commit predating the file
          # means. The baseline lint above still needs its guard —
          # readBaselineFile errors on a missing file rather than defaulting.
          go run ./cmd/compat \
            --lint-flaky-from base/compat/flaky.json \
            --lint-flaky-to compat/flaky.json \
            --annotate $growth

      # One report, three renderings: the job summary (full detail), a digest for
      # the PR comment, and JUnit XML for a check run with per-test history.
      # Regressions become JUnit failures; grandfathered gaps become skips, so
      # the check run shows what changed rather than 800 expected gaps.
      - name: Build compat report
        if: always() && env.RUN_SUITES == 'true'
        run: python3 scripts/compat-report.py

      - name: Publish JUnit check run
        if: always() && env.RUN_SUITES == 'true' && hashFiles('compat-junit.xml') != ''
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: compat-junit.xml
          check_name: Compat Report
          # The baseline gate below decides pass/fail; this check run exists to
          # give per-test visibility and history.
          fail_on_failure: false
          require_tests: true
          detailed_summary: true
          include_passed: false
          annotate_only: true

      - name: Comment compat digest on the PR
        if: always() && env.RUN_SUITES == 'true' && github.event_name == 'pull_request' && hashFiles('compat-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: compat-results
          recreate: true
          path: compat-comment.md

      - name: Upload merged compat results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.RUN_SUITES == 'true'
        with:
          name: compat-results-${{ github.sha }}
          path: |
            compat-results.json
            compat-junit.xml
          if-no-files-found: error
          retention-days: 90

      - name: Attach results to release
        if: env.RUN_SUITES == 'true' && github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: compat-results.json

      # Promote improvements automatically so contributors never hand-edit the
      # baseline: a fix merges, the ratchet tightens on the next push. Only ever
      # improves entries (updateBaseline keeps the better status), only runs on
      # main, and only commits compat/baseline/. paths-ignore on the push
      # trigger stops this commit from starting another run.
      # Promotion is PR-based: branch protection (since #393) rejects any
      # direct push to main — automation included — so the old direct-push
      # promotion silently dropped every improvement (issue #440). Instead the
      # promotion is force-pushed to a fixed branch and lands through a normal
      # auto-merged PR, validated by the same required checks (including the
      # baseline-change lint) as a human edit. Successive promotions coalesce
      # on the fixed branch; a superseded one is simply overwritten.
      #
      # The push and the PR need a GitHub App installation token: a push or PR
      # made as github-actions[bot] (GITHUB_TOKEN) either starts no workflows
      # or, since mid-2026, starts them held for manual approval — either way
      # the PR waits on required checks that do not run by themselves. The
      # App needs exactly two repository permissions — Contents: read & write
      # (force-push the branch, and merge once checks pass) and Pull requests:
      # read & write (open the PR, arm auto-merge). Not Workflows: the
      # promotion commit touches compat/baseline/ and nothing else.
      #
      # Both the push and `gh` must actually present that token. `gh` reads
      # GH_TOKEN; `git push` takes it from the URL, which only works because
      # this job's checkout runs with persist-credentials: false — see the
      # comment on that step. Do not re-enable persisted credentials here.
      #
      # The promotion is rebuilt on the live tip of main just before it is
      # published, not on the commit this run tested. A compat run takes
      # twenty-odd minutes and a promotion can sit merged-or-not for far
      # longer, so by the time the job gets here main has often merged the very
      # promotion these results imply. Publishing the run's own diff then
      # opens a PR that changes nothing (#1964: the run began 20 s before #1943
      # merged the same baselines). `--update-baseline` only ever keeps the
      # better status, so re-running it against main's baseline yields exactly
      # the improvements main still lacks, and none at all when it has them.
      # It runs in a separate worktree so the checkout the gates read is left
      # as the earlier steps saw it.
      #
      # Identify the App by its Client ID, not its App ID: `app-id` carries a
      # deprecationMessage as of the action's v3, and GitHub recommends the
      # client ID as the JWT `iss` claim. A client ID is not sensitive and could
      # live in a repository variable, but every other App-authenticated
      # workflow here keeps it in secrets alongside the key
      # (secrets.RELEASE_APP_CLIENT_ID) — one place to look beats one fewer
      # secret. If either is missing the step surfaces an accurate warning
      # instead of failing, and the promotion is applied by hand (recipe in
      # PR #439, issue #440).
      - name: Compute baseline promotion
        id: promote-diff
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.baseline.outcome == 'success'
        run: |
          go run ./cmd/compat \
            --update-baseline \
            --baseline-file compat/baseline \
            --results-file compat-results.json
          # `git status --porcelain`, not `git diff`: a first result from a new
          # suite writes a brand-new shard, and an untracked file is invisible
          # to `git diff` — that promotion would be computed and then silently
          # dropped.
          if [[ -z "$(git status --porcelain -- compat/baseline)" ]]; then
            echo "Baseline unchanged — nothing to promote."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check promotion App credentials
        id: app-check
        if: steps.promote-diff.outputs.changed == 'true'
        env:
          CLIENT_ID: ${{ secrets.COMPAT_PROMOTION_CLIENT_ID }}
          APP_KEY: ${{ secrets.COMPAT_PROMOTION_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$APP_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Compat baseline::Promotion computed but NOT published: branch protection blocks direct pushes and the promotion App credentials (secrets.COMPAT_PROMOTION_CLIENT_ID / secrets.COMPAT_PROMOTION_PRIVATE_KEY) are not configured — see issue #440. Apply by hand per PR #439 until then."
          fi

      - name: Mint promotion App token
        id: promotion-token
        if: steps.app-check.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.COMPAT_PROMOTION_CLIENT_ID }}
          private-key: ${{ secrets.COMPAT_PROMOTION_PRIVATE_KEY }}

      - name: Publish promotion PR
        if: steps.app-check.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.promotion-token.outputs.token }}
        run: |
          git config user.name "overcast-compat-promotion[bot]"
          git config user.email "overcast-compat-promotion[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Non-fatal from here down: promotion is an optimisation, not a gate,
          # and a dropped one is recomputed by the next improved main run.
          if ! git fetch --no-tags --depth=1 "$remote" main; then
            echo "::warning title=Compat baseline::Could not fetch main to build the promotion on — the next improved main run will recompute it."
            exit 0
          fi
          promo="${RUNNER_TEMP}/baseline-promotion"
          git worktree add --detach "$promo" FETCH_HEAD
          cd "$promo"
          if ! go run ./cmd/compat \
              --update-baseline \
              --baseline-file compat/baseline \
              --results-file "${GITHUB_WORKSPACE}/compat-results.json"; then
            echo "::warning title=Compat baseline::Could not recompute the promotion on the tip of main — the next improved main run will recompute it."
            exit 0
          fi
          if [[ -z "$(git status --porcelain -- compat/baseline)" ]]; then
            echo "::notice title=Compat baseline::Main already carries every improvement in this run's results — nothing to promote."
            exit 0
          fi
          git add compat/baseline
          git commit -m "chore(compat): promote baseline improvements" \
            -m "Automated: compat results on main run ${GITHUB_RUN_ID} (commit ${GITHUB_SHA}) improved on the recorded baseline."
          if ! git push --force "$remote" HEAD:automation/baseline-promotion; then
            echo "::warning title=Compat baseline::Could not push the promotion branch — the next improved main run will recompute it."
            exit 0
          fi
          # One coalescing PR: create if absent (the create fails harmlessly
          # when it already exists — the force-push above updated it), then
          # make sure auto-merge is armed either way.
          gh pr create \
            --head automation/baseline-promotion \
            --base main \
            --title "chore(compat): promote baseline improvements" \
            --body "Automated: compat results on main improved on the recorded baseline (run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}). Auto-merges when checks pass; superseded promotions are force-pushed over." \
            || true
          if ! gh pr merge automation/baseline-promotion --squash --auto; then
            echo "::warning title=Compat baseline::Promotion PR exists but auto-merge could not be armed — merge it manually."
          fi

      # continue-on-error above kept the surfacing steps running; the gates are
      # asserted here so the job's conclusion reflects them. Unchanged whenever
      # the suites ran — every gate is read exactly as before.
      - name: Enforce compat gates
        if: always() && env.RUN_SUITES == 'true'
        run: |
          failed=0
          if [[ "${{ steps.baseline.outcome }}" == "failure" ]]; then
            echo "Baseline comparison failed — see the annotations and job summary." >&2
            failed=1
          fi
          if [[ "${{ steps.failures.outcome }}" == "failure" ]]; then
            echo "Compat failures — every failing test is a regression; see the annotations." >&2
            failed=1
          fi
          if [[ "${{ steps.parity.outcome }}" == "failure" ]]; then
            echo "Cross-suite parity check failed — see the annotations and job summary." >&2
            failed=1
          fi
          if [[ "${{ steps.baseline-lint.outcome }}" == "failure" ]]; then
            echo "Baseline change lint failed — a downgrade or a new fail expectation." >&2
            failed=1
          fi
          if [[ "${{ steps.baseline-size.outcome }}" == "failure" ]]; then
            echo "Baseline shard size budget exceeded — shard further; see the annotations." >&2
            failed=1
          fi
          if [[ "${{ steps.flaky-lint.outcome }}" == "failure" ]]; then
            echo "Flaky list check failed — a new quarantine, or an entry without a reason." >&2
            failed=1
          fi
          exit "$failed"
