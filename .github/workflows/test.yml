name: CI

# `support/**` is the post-1.0 maintenance namespace (RELEASE.md § Maintenance
# Releases): one long-lived branch per minor line, cut from its tag the first
# time a fix has to be backported. A release is cut from it, so it needs the
# same CI as `main` — a cherry-pick onto a branch that stopped moving months
# ago is the change *least* like the code it lands on, and it would otherwise
# reach users having run nothing at all. Inert until such a branch exists; no
# branch in the repository matches it today.
on:
  push:
    branches: [main, develop, "support/**"]
  pull_request:
    branches: [main, "support/**"]

permissions:
  contents: read
  checks: write

# One run per pull request; a force-push supersedes the run it replaces.
#
# Revising a PR is normally a force-push — an amend or a rebase — and without
# this the superseded run continues to completion, spending a full CI cycle on
# a commit nobody is waiting for and leaving a verdict against a head that no
# longer exists. scripts/pr-wait.sh already has to defend against reading one:
# its exit 8 means the head moved mid-watch, so the result it collected is
# stale.
#
# Everything that is not a pull request gets a group of its own, keyed on the
# run id, so it is neither cancelled nor queued. A cancelled push to main
# leaves the commit with no verdict at all, and a cancelled release run is
# worse — and cancel-in-progress: false is not enough to prevent either. A
# concurrency group holds at most one *pending* run, and GitHub cancels it
# when the next one arrives whatever cancel-in-progress says: "any existing
# pending job or workflow in the same concurrency group will be canceled and
# the new queued job or workflow will take its place." The flag only decides
# whether the run already *in progress* goes too. This block used to fall back
# to the ref for non-PR events, which is exactly that trap: during a burst of
# merges, every push run that was still pending when the next merge landed was
# dropped. On 2026-08-22, 60 of the day's 104 push runs to main concluded
# `cancelled` without a job ever starting — among them 32599735383,
# 32600052337 and 32600275985 (commits 1b57febb, 4136324a, 928b35ba) — while
# the runs either side of them ran and failed on the broken web/pnpm-lock.yaml
# that #1354 fixed, which is how the gap was noticed.
#
# `queue: max` would keep the ref group and let up to 100 runs wait in it
# instead, but nothing here needs runs on main serialized — a verdict delayed
# behind the whole queue is worse than one computed alongside — and
# actionlint v1.7.7, the version this workflow's own Actionlint job pins,
# rejects the key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job below carries a `timeout-minutes` bar one, which cannot — see the
# end of this note. GitHub's default is 360, so a hung `docker build`,
# `pnpm install` or `docker pull` — none of which the Go suites' own
# `-timeout=1200s` covers, because none of them is `go test` — sits on a runner
# slot for six hours, and on a required check it sits on the pull request with
# it.
#
# Each value is roughly two to three times what that job measured across three
# green runs (33946645470, 33944965566, 33945978965), rounded up, with a
# five-minute floor. These are ceilings for catching a hang, not budgets to run
# against; a job that starts failing on one has grown, and the number should be
# re-derived rather than nudged.
#
# Three sit above that band on purpose. `Lambda invoke (native host binary)`
# ran 91 s, but its worst legitimate path — three image pulls with backoff, a
# 30 s health wait and a 120 s wait for Active — is several times its median.
# `Docker build (…)` ran 136 s, but on a release candidate it also builds two
# platforms and pushes them, which none of the sampled runs did.
# `Release candidate summary` was skipped in all three, so it has no
# measurement at all.
#
# `Cross-build` has none and cannot: it calls a reusable workflow, where
# `timeout-minutes` is not a permitted key — "only following keys are allowed:
# name, uses, with, secrets, needs, if, and permissions" (actionlint
# syntax-check). Its ceiling belongs in build-binaries.yml.
jobs:
  # Does this pull request need the expensive jobs at all?
  #
  # Fifteen of the required check names are produced below — Vet, Lint,
  # Actionlint, Web UI, the three Test suite (-tags …) legs, Full test suite
  # with coverage, both Docker build (…) legs, Script tests, Lambda invoke
  # (native host binary), Changelog fragments, Docs and capability registry
  # and VERSION guard (added to the ruleset 2026-09-05; it had been missing,
  # so a VERSION change was mergeable without it). The rest of the set is
  # reported by other workflows: Breaking-change hold, Changelog entry,
  # Lockfile freshness and Aggregate Compatibility Results. The `Protect Main`
  # ruleset is where the list is maintained (Docs and capability registry and
  # Aggregate Compatibility Results come from classic branch protection);
  # docs/plans/ci-streamlining.md § Tier 3 records it as last read, and is the
  # place to update if it changes. A required check that never reports leaves
  # the pull request waiting on it forever. So this cannot be a `paths-ignore:`
  # on the workflow, and it cannot be a twin "skip" workflow either — GitHub
  # skips on paths-ignore only when *every* changed file matches but runs on
  # `paths` when *any* one does, so a pull request touching a doc and a handler
  # satisfies both and two runs report under the same check name.
  #
  # Instead every job keeps its name and still runs; only the expensive steps
  # are conditional. A prose-only pull request gets the same green checks in
  # seconds. scripts/ci-scope.py holds the rule and scripts/ci_scope_test.py
  # pins it — including that anything unrecognised counts as code.
  # Every other job now waits on this one, so it is kept to a shallow checkout,
  # one API call and one `git ls-remote`. Diffing locally would mean
  # `fetch-depth: 0` — a full history clone — to gain nothing the API does not
  # already know.
  #
  # It answers the release-candidate question too, which used to be a job of
  # its own. That job was a checkout and six seconds of `git ls-remote`, and
  # everything that needed the answer already needed this job's, so it cost a
  # runner slot and a second round of queueing to say something this job was
  # positioned to say.
  changes:
    name: Changed-path scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      rc: ${{ steps.rc.outputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # --paginate so a pull request over 100 files is classified on all of
          # them; a truncated list could read as prose-only. On anything that is
          # not a pull request the script answers true before reading stdin.
          #
          # `|| true` is load-bearing. Every other job needs this one, so a
          # failure here skips them all and none of the required checks
          # reports — which blocks the pull request outright rather than
          # failing it. A GitHub API blip must not be able to do that, and the
          # runner's default shell is `bash -e -o pipefail`, so without this
          # the pipeline would take a transient error straight to a hard block.
          # An empty list means "could not tell", which ci-scope.py answers
          # with code=true: run everything.
          files=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' || true)
          fi
          printf '%s\n' "$files" | python3 scripts/ci-scope.py >> "$GITHUB_OUTPUT"
      - name: What was decided
        env:
          CODE: ${{ steps.scope.outputs.code }}
        run: |
          if [ "$CODE" = "true" ]; then
            echo "Code changed — running the full suite."
          else
            echo "Prose only — the Go, SPA and image jobs have nothing to exercise."
          fi

      # Decided once, here, and read by `web`, `cross-build`, `docker` and
      # `rc-comment`: a same-repo PR whose checked-out VERSION has no
      # v<VERSION> tag yet. That covers the PR that bumps VERSION and — where a
      # release/* branch-name test would go blind — a follow-up PR after a
      # failed release workflow, when the unreleased version already sits on
      # main. The script never fails (errors degrade to rc=false with a
      # warning), so the jobs that hang off this output cannot be
      # skip-cascaded by an infrastructure hiccup.
      #
      # And only when the change can alter an image (ci-scope.py `image`). An
      # RC is named for the version it is a candidate of, and during the window
      # between a release PR merging and its tag every other PR would otherwise
      # be named a candidate of that version too: a baseline promotion or a
      # test-only change built bit-identical images and published them as
      # `<version>-rc.<n>`. Only this output is narrowed.
      # release-candidate-check.sh stays the one shared predicate, because
      # release.yml and changelog-required.yml use it to keep the changelog
      # releasable, which is a question about the window rather than the image.
      # Anything but an explicit `false` counts as changed: a release PR that
      # missed its candidate is the failure to avoid.
      - id: rc
        env:
          IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          IMAGE_CHANGED: ${{ steps.scope.outputs.image }}
        run: |
          rc=false
          if [ "$IS_SAME_REPO_PR" = "true" ] && [ "$IMAGE_CHANGED" != "false" ]; then
            rc=$(bash scripts/release-candidate-check.sh)
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "release candidate: $rc"

  # No `needs: web`. An untagged Go build embeds `all:web/dist`, and the
  # committed `web/dist/.gitkeep` is what keeps that pattern resolving without
  # a built SPA — a binary without one serves the API normally and answers 503
  # on the UI port, which is documented behaviour rather than a broken build.
  #
  # Nothing in the Go suite asks for real SPA content: the BFF's static-serving
  # tests inject an fstest.MapFS of their own (internal/bff/debug_test.go), and
  # no test skips itself when the directory is empty. So waiting for the
  # artifact bought these jobs nothing and cost them the whole SPA build.
  #
  # `cross-build` keeps its dependency, and must: release builds assert a real
  # web/dist/index.html and fail loudly without one.
  vet:
    name: Vet
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: go mod download

      - name: Vet
        if: needs.changes.outputs.code == 'true'
        run: go vet ./...

      # A nested Go module, so the root `./...` above never descends into it.
      - name: Vet the Testcontainers module
        if: needs.changes.outputs.code == 'true'
        working-directory: testcontainers/go
        run: |
          go mod download
          go vet ./...

      # Folded in from the job that used to own it, which opened with the same
      # `go vet ./...` this job had already run and then tested one package.
      # Vet 109 s + SQS 163 s in run 33946645470 is ~250 s once the duplicated
      # checkout, setup-go, module download and vet are paid once — well inside
      # the 689 s `coverage` sets as the critical path, for one runner slot
      # instead of two.
      #
      # OVERCAST_PROTOCOL_DISPATCH turns on the Smithy-aligned typed dispatcher
      # (internal/router/service.go), a passthrough in every other job here, so
      # this is the SQS suite over a routing path nothing else in CI takes.
      - name: SQS integration tests (protocol dispatch)
        if: needs.changes.outputs.code == 'true'
        run: OVERCAST_PROTOCOL_DISPATCH=1 go test -race -count=1 -timeout=300s ./tests/integration/sqs/...

  # The longest job in the workflow, and it used to start 187 s late waiting on
  # the SPA it never read — see the note on `vet`. It sets the critical path,
  # so this is where dropping the dependency is worth the most.
  coverage:
    name: Full test suite with coverage
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'

      # A cache scope of its own, rather than setup-go's shared one.
      #
      # setup-go's `cache: true` keys on runner OS/arch, Go version and
      # hash(go.sum) and nothing else, so every root-module job in a run
      # computes the *same* key. Only one of them ever saves it — the first to
      # miss — and the rest log "Cache hit occurred on the primary key …, not
      # saving cache". In run 33924023153 the one that saved was
      # `Docs and capability registry`, 29 s into a 23 s `make docs-check`;
      # this job, all three `Test suite (-tags …)` legs, Vet, Lint,
      # `Lambda invoke`, the SQS job and all ten Cross-build legs then restored
      # what it had compiled and declined to save. The size of main's cache for
      # a given go.sum says the same thing from the other side: 35.9 MB for the
      # current generation of the key against 231 MB and 261 MB for two
      # earlier ones. Which job wins the race decides what everyone restores.
      #
      # So the heavy jobs opt out and keep their own. `-race` in the key is not
      # decoration: a race-instrumented build cache shares no object with a
      # plain one, and this job compiles the whole module and every test binary
      # in it that way. The restore-keys prefix means a go.sum bump degrades to
      # the previous run's cache rather than to nothing, and — unlike the
      # shared key — a prefix-only restore still saves at the end of the job,
      # so the cache tracks this job's own output from then on.
      #
      # The short jobs stay on setup-go's default. They are the ones the shared
      # cache was already good enough for.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-race-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-race-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: go mod download

      # The Docker-gated Lambda tests need the in-container init embedded in the
      # binary under test; it is build output, not a committed file. The
      # composite restores it from a content-addressed cache and rebuilds only
      # when its inputs moved (see .github/actions/lambda-init).
      - uses: ./.github/actions/lambda-init
        if: needs.changes.outputs.code == 'true'
      # The aws-sdk shape tables internal/awsshapes embeds: build output, like
      # the Lambda init above, packed from the committed text tables.
      - name: Pack the aws-sdk shape tables
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: go run ./cmd/awsshapes-pack

      # The suite pulls images (registry:2, alpine, postgres, redis, …) for the
      # Docker-backed services. Mirror them so the pulls do not compete for the
      # shared anonymous Docker Hub limit on GitHub's egress IPs.
      - uses: ./.github/actions/docker-hub-mirror
        if: needs.changes.outputs.code == 'true'

      # Start the Lambda base-image pulls now, detached, so they overlap the Go
      # build instead of landing inside a test's own deadline. A function has
      # 2 minutes to reach Active (waitForFunctionActive in
      # tests/integration/lambda/lambda_test.go), and a cold pull of a runtime
      # image inside that window is what times out.
      #
      # The mirror above does not cover these. It points the daemon at
      # mirror.gcr.io, which is a Docker Hub pull-through cache; these images
      # live on public.ecr.aws, which it never sees.
      #
      # Detached and unchecked on purpose. `nohup … &` outlives the step — the
      # runner does not reap it, which is how the Lambda invoke job below
      # backgrounds a whole server — so this step neither waits nor fails. If a
      # pull is slow or fails outright the test pulls the image itself, exactly
      # as it does today; this can only make that pull already done.
      #
      # Only what the Docker-gated tests actually create: nodejs20.x dominates
      # and python3.11 is the rest (the layer, hot-reload and deleted-layer
      # cases). Tags from internal/services/lambda/runtime_catalog.go, which is
      # where the emulator resolves a runtime ID to an image.
      - name: Warm the Lambda runtime images in the background
        if: needs.changes.outputs.code == 'true'
        run: |
          for image in public.ecr.aws/lambda/nodejs:20 public.ecr.aws/lambda/python:3.11; do
            nohup docker pull "$image" >/dev/null 2>&1 &
          done

      - name: Full test suite with coverage
        if: needs.changes.outputs.code == 'true'
        run: |
          go test -race -count=1 -timeout=1200s -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  build-tags:
    name: Test suite (-tags ${{ matrix.tags }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Deliberately no `needs: web` and no download-artifact: dropping the
    # embedded SPA is the whole point of the slim build (embed_slim.go), so this
    # job needs no web/dist and can start immediately.
    strategy:
      fail-fast: false
      matrix:
        # `slim` is what AGENTS.md tells agents to use for backend-only
        # verification; `slim,nosqlite` is what actually ships — both the
        # released overcastd binary (the cross-build matrix below) and the slim
        # Docker image (`build-slim` in the Makefile) are built with it. Gating
        # only the untagged suite left the shipped tag set ungated.
        # `slim,dev` compiles in the per-service capabilities_dev.go inventories
        # and their //go:build dev cross-check tests (capabilities vs initOps
        # dispatch); without it that drift is invisible to CI.
        #
        # `include:` rather than the bare list this was, so each leg can name a
        # cache scope below: actions/cache rejects a key containing a comma
        # ("Key Validation Error: … cannot contain commas"), and the job name
        # has to keep rendering `matrix.tags` verbatim because all three names
        # are required checks.
        include:
          - tags: slim
            cache-scope: slim
          - tags: slim,nosqlite
            cache-scope: slim-nosqlite
          - tags: slim,dev
            cache-scope: slim-dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'

      # A cache scope of its own, per tag set — see the long note on
      # `coverage`. The same argument applies here and one more with it: each
      # tag set produces its own objects, so three legs sharing one key would
      # thrash it even if they were the only jobs using it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-tags-${{ matrix.cache-scope }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-tags-${{ matrix.cache-scope }}-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: go mod download

      - name: Vet
        if: needs.changes.outputs.code == 'true'
        run: go vet -tags ${{ matrix.tags }} ./...

      # -tags slim does not drop the Lambda init: slim images run Lambda.
      - uses: ./.github/actions/lambda-init
        if: needs.changes.outputs.code == 'true'
      # The aws-sdk shape tables internal/awsshapes embeds: build output, like
      # the Lambda init above, packed from the committed text tables.
      - name: Pack the aws-sdk shape tables
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: go run ./cmd/awsshapes-pack

      - uses: ./.github/actions/docker-hub-mirror
        if: needs.changes.outputs.code == 'true'

      # Same detached pre-pull as `coverage`, for the same reason; the note there
      # has the full rationale. Same image list, on purpose: keep the two in step.
      - name: Warm the Lambda runtime images in the background
        if: needs.changes.outputs.code == 'true'
        run: |
          for image in public.ecr.aws/lambda/nodejs:20 public.ecr.aws/lambda/python:3.11; do
            nohup docker pull "$image" >/dev/null 2>&1 &
          done

      # No -race: these tags change which routes register, which assets embed,
      # and whether SQLite is compiled in — not concurrency. The untagged
      # coverage job owns race coverage, and dropping it here roughly halves
      # the runtime.
      - name: Test suite
        if: needs.changes.outputs.code == 'true'
        run: go test -count=1 -timeout=1200s -tags ${{ matrix.tags }} ./...

  # Can a Lambda container reach the Runtime API of an Overcast that is NOT
  # itself a container?
  #
  # Nothing else in CI asks. Every other Lambda test — the Go suites and the
  # whole compat matrix — is a request against an emulator the test itself
  # started, and the invoke path underneath it was only ever exercised with
  # Overcast and its functions as siblings on one Docker network. That is the
  # arrangement where a container's packets arrive on-link, which is what made
  # identifying a container by its source address look correct for so long. It
  # is not the arrangement two of the three binaries build-binaries.yml
  # publishes run in: on Windows and macOS, Docker Desktop's userspace proxy
  # re-originates every container's connection from the host, the source address
  # matches no registered container, and every invocation fails at INIT blaming
  # the user's function.
  #
  # ubuntu-latest cannot reproduce Desktop's proxy — its daemon is native, so a
  # container dialling the bridge gateway does arrive on-link. So this job is
  # not a test of the Desktop failure; it is the guard that the host path works
  # at all, in the one host configuration a GitHub runner can offer, and it
  # covers the published Linux binary directly.
  #
  # One function, one invoke, deliberately: the cost that matters is the runtime
  # image pull, and nothing here is made more convincing by a second case.
  #
  # A required check since it first reported green on main. It is a
  # start-to-invoke race detector as much as a runtime test: it drives an
  # invocation within ~100 ms of the process starting, which is what caught the
  # Lambda service answering Runtime.DockerUnavailable while its own Docker
  # probe was still wiring the container runtime.
  lambda-host-runtime:
    name: Lambda invoke (native host binary)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true

      # The init first, from cache where its inputs have not moved: the binary
      # below embeds it, and this job exists to invoke a function that needs it.
      - uses: ./.github/actions/lambda-init
        if: needs.changes.outputs.code == 'true'
      # The aws-sdk shape tables internal/awsshapes embeds: build output, like
      # the Lambda init above, packed from the committed text tables.
      - name: Pack the aws-sdk shape tables
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: go run ./cmd/awsshapes-pack

      # Built here rather than in a container, and with the tags the released
      # overcastd binary carries, so this is the artifact a user runs.
      - name: Build the binary natively
        if: needs.changes.outputs.code == 'true'
        env:
          CGO_ENABLED: "0"
        run: go build -tags slim,nosqlite -o bin/overcast ./cmd/overcast

      - uses: ./.github/actions/docker-hub-mirror
        if: needs.changes.outputs.code == 'true'

      # A cold pull inside the function's Active wait is what times out; pull it
      # up front. Not best-effort: without the image there is no invoke to test,
      # and a silent skip is the failure mode this whole job exists to end.
      # Retried: public.ecr.aws has intermittently failed pulls with a TLS
      # handshake timeout unrelated to the change under test (run 33919940280,
      # job 101176485363, on PR #1682), which otherwise fails this required
      # check for a transient registry problem rather than a real regression.
      - name: Pre-pull the Lambda runtime image
        if: needs.changes.outputs.code == 'true'
        run: |
          image=public.ecr.aws/lambda/nodejs:20
          for delay in 0 5 15; do
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
            if docker pull --quiet "$image"; then
              exit 0
            fi
          done
          echo "failed to pull $image after 3 attempts" >&2
          exit 1

      # A free ephemeral port on loopback. 4566 and 4567 are never candidates —
      # the kernel hands out ports well above them — and picking one rather than
      # pinning keeps this job able to run next to anything else on the runner.
      - name: Start Overcast on a free loopback port
        if: needs.changes.outputs.code == 'true'
        run: |
          port=$(python3 -c 'import socket
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          print(s.getsockname()[1])
          s.close()')
          echo "OVERCAST_ENDPOINT=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          # No SPA in a slim build and nothing here looks at the UI, so the UI
          # listener is off rather than parked on its default port.
          OVERCAST_PORT="$port" \
          OVERCAST_UI_PORT=0 \
          OVERCAST_STATE=memory \
          OVERCAST_LOG_LEVEL=debug \
            ./bin/overcast serve > overcast.log 2>&1 &
          echo "OVERCAST_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Overcast to become healthy
        if: needs.changes.outputs.code == 'true'
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "$OVERCAST_ENDPOINT/_overcast/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Overcast did not become healthy within 30 s" >&2
          exit 1

      - name: Create a nodejs20.x function
        if: needs.changes.outputs.code == 'true'
        run: |
          # The marker is what proves the handler's own stdout came back, rather
          # than only that something answered with a 200.
          echo "LOG_MARKER=host-runtime-probe-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          python3 - "host-runtime-probe-$GITHUB_RUN_ID" > create.json <<'PY'
          import base64, io, json, sys, zipfile

          marker = sys.argv[1]
          handler = (
              "exports.handler = async (event) => {\n"
              f"  console.log({json.dumps(marker)});\n"
              "  return { ok: true, echo: event };\n"
              "};\n"
          )
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.writestr("index.js", handler)
          json.dump({
              "FunctionName": "host-runtime-probe",
              "Runtime": "nodejs20.x",
              "Role": "arn:aws:iam::000000000000:role/lambda-ex",
              "Handler": "index.handler",
              "Code": {"ZipFile": base64.b64encode(buf.getvalue()).decode()},
          }, sys.stdout)
          PY
          curl -sf -X POST "$OVERCAST_ENDPOINT/2015-03-31/functions" \
            -H 'Content-Type: application/json' \
            --data @create.json > created.json
          for _ in $(seq 1 60); do
            state=$(curl -sf "$OVERCAST_ENDPOINT/2015-03-31/functions/host-runtime-probe" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["Configuration"]["State"])') || state=""
            if [ "$state" = "Active" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "function did not reach Active (last state: ${state:-unknown})" >&2
          exit 1

      - name: Invoke it and check the handler's own output came back
        if: needs.changes.outputs.code == 'true'
        run: |
          status=$(curl -s -o response.json -D headers.txt -w '%{http_code}' \
            -X POST "$OVERCAST_ENDPOINT/2015-03-31/functions/host-runtime-probe/invocations" \
            -H 'Content-Type: application/json' \
            -H 'X-Amz-Log-Type: Tail' \
            --data '{"ping":"pong"}')
          echo "── response headers"; cat headers.txt
          echo "── response body"; cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "Invoke returned HTTP $status, want 200" >&2
            exit 1
          fi
          # A function error is a 200 with X-Amz-Function-Error set — including
          # the Runtime.InitError an unidentifiable container produces, which is
          # exactly what this job is here to catch.
          if grep -qi '^x-amz-function-error:' headers.txt; then
            echo "Invoke reported a function error" >&2
            exit 1
          fi
          if ! grep -q '"ok":true' response.json; then
            echo "Invoke payload is not the handler's return value" >&2
            exit 1
          fi
          log_result=$(grep -i '^x-amz-log-result:' headers.txt | tr -d '\r' | cut -d' ' -f2-)
          if [ -z "$log_result" ]; then
            echo "No X-Amz-Log-Result header on the response" >&2
            exit 1
          fi
          echo "── log tail"
          echo "$log_result" | base64 -d | tee tail.txt
          if ! grep -q "$LOG_MARKER" tail.txt; then
            echo "The handler's own output never reached the log tail" >&2
            exit 1
          fi

      # The whole log, not a tail: OVERCAST_LOG_LEVEL=debug is on precisely so
      # this is readable when something fails, and the lines that explain a
      # Lambda failure — the Docker probe's verdict and the container runtime
      # coming up — are written at startup, which a tail is exactly what cuts
      # off. Failure only; a green run's log changes no decision.
      - name: Overcast log
        if: failure() && needs.changes.outputs.code == 'true'
        run: cat overcast.log || true

      - name: Stop Overcast
        if: always() && needs.changes.outputs.code == 'true'
        run: |
          if [ -n "${OVERCAST_PID:-}" ]; then
            kill "$OVERCAST_PID" 2>/dev/null || true
          fi

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true
      # No install step: `make lint-go` runs golangci-lint via a pinned
      # `go run`, so CI and local runs cannot drift onto different versions.
      # The pin lives in the Makefile (GOLANGCI_LINT_VERSION).
      - name: Run Go lint
        if: needs.changes.outputs.code == 'true'
        run: make lint-go

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  # The public one-line installers (install/README.md): lint both scripts and
  # run the real files against a local fake release server on each OS they
  # ship for, under every shell the host has. The post-release smoke test in
  # release.yml covers the real asset layout; this covers the logic.
  installers:
    name: Installers (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.14"
      # Shells the tests pick up when present: dash and bash come with the
      # image, busybox and zsh do not.
      - name: Install extra shells
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q busybox zsh
      - name: shellcheck
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: shellcheck -s sh -S style install/install.sh
      - name: PSScriptAnalyzer
        if: needs.changes.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $findings = Invoke-ScriptAnalyzer -Path install/install.ps1 -Severity Warning,Error
          if ($findings) {
            $findings | Format-Table -AutoSize RuleName,Severity,Line,Message | Out-String -Width 200 | Write-Host
            exit 1
          }
      - name: Installer tests
        if: needs.changes.outputs.code == 'true'
        run: python install/install_test.py

  # The repo's helper scripts carry unittest files next to them; they are cheap
  # and guard logic CI depends on (the compat report's JUnit mapping decides
  # whether a check run goes red).
  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run script unit tests
        run: |
          status=0
          for t in scripts/*_test.py; do
            echo "── $t"
            python3 "$t" || status=1
          done
          exit "$status"
      # Mojibake, stray BOMs, and U+FFFD in tracked text files — the class of
      # damage a CP1252 write leaves behind (PR #1065 removed 219 instances
      # that had reached shipped UI strings). Fails on any new instance;
      # `--fix` repairs locally.
      - name: Encoding lint
        run: python3 scripts/check_encoding.py
      # Comment markers the TODO-to-issue Action would misread. It matches its
      # marker anywhere in a comment and takes the rest of the line as the
      # issue title, so prose that merely mentions one files a nonsense issue
      # (#1138). Nothing in the action's config anchors the match, so the
      # anchoring is this gate.
      - name: Comment marker lint
        run: python3 scripts/check_todos.py

      # Folded in from the Compat registry schema job. Both jobs were a
      # checkout, the same setup-python, and a few seconds of Python over files
      # on disk — no emulator, no Docker, no network — and both are ungated, so
      # the conditions carry over unchanged. jsonschema is the only thing the
      # folded job had that this one did not.
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      - name: Validate compat registry against its schema
        run: python3 scripts/validate-compat-registry.py
      - name: Compat suite name hygiene
        run: python3 scripts/compat-name-hygiene.py

  # The compat suites carry unit tests, and until this job nothing ran them.
  #
  # Every suite is its own module — its own go.mod, package.json,
  # requirements.txt — so the root `go test ./...` in the jobs above matches no
  # package under compat/suites/, and compat.yml installs each suite's
  # dependencies only to run that suite against a live emulator. The tests
  # below fell between the two and executed nowhere.
  #
  # What they pin is not incidental. They are the checks that a suite's
  # registered implementations resolve against compat/suites/registry.json:
  # impl-key resolution (a bare key for a name several groups declare binds
  # whichever group registered last, so the run reports another service's
  # result as this one's), duplicate registration, and the ordering a group's
  # `depends` edges imply. A regression in any of those changes what a compat
  # run *reports* while every suite still passes — the one class of compat bug
  # a compat run cannot catch itself.
  #
  # Cheap by construction: no emulator, no Overcast binary, no Docker. Each
  # test either builds a registry in memory or reads registry.json off disk.
  #
  # This is also the one place every suite answers the shared error-fixture
  # corpus (compat/model/testdata/errors) — see compat/AGENTS.md § Where the
  # shared error corpus runs for the rule and why every suite's fixture step
  # is here rather than in an image build. OVERCAST_COMPAT_FIXTURES_REQUIRED=1
  # is set for the whole job below so a suite that cannot see the corpus here
  # fails loudly, naming the reason, instead of reporting green.
  compat-suite-unit-tests:
    name: Compat suite unit tests
    needs: changes
    runs-on: ubuntu-latest
    # Raised from 10 when the java-sdk and rust-sdk suites joined, and again
    # for dotnet-sdk: each brings its own conversation with a package registry
    # — Maven resolves the AWS SDK BOM, cargo compiles a dozen aws-sdk crates,
    # NuGet resolves AWSSDK.* — minutes on a cold cache, seconds on a warm one.
    timeout-minutes: 30
    env:
      # Set only in this job. Every suite's fixture test checks for it and, if
      # set, fails loudly naming the reason instead of skipping when the
      # corpus is not where it expects — see compat/AGENTS.md § Where the
      # shared error corpus runs.
      OVERCAST_COMPAT_FIXTURES_REQUIRED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'

      # go-version-file is the root go.mod, which is what compat.yml already
      # uses to build the go-sdk and cli suites. cache-dependency-path names
      # only go-sdk's go.sum: cli/ and cdk/ declare no requirements and so have
      # no go.sum at all, and setup-go fails outright on a path that matches
      # nothing.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: compat/suites/go-sdk/go.sum

      # Two lockfiles: the node-js-sdk suite's, and compat/ui's for the steps
      # folded in at the end of this job. setup-node hashes every path it is
      # given into one npm cache key, so a change to either invalidates it —
      # which is the behaviour that keeps both installs honest.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            compat/suites/node-js-sdk/package-lock.json
            compat/ui/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: compat/suites/python-sdk/requirements.txt

      # Temurin 17 is what the suite's own Dockerfile builds and runs on, and
      # pom.xml sets `maven.compiler.release` to 17; a newer JDK here would
      # compile against a different platform API than the image does.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # setup-dotnet's own `cache` input needs a packages.lock.json, which this
      # project does not generate (no RestorePackagesWithLockFile), so this
      # keys a plain NuGet cache on the csproj files directly — the same shape
      # a lockfile-less restore actually varies with.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('compat/suites/dotnet-sdk/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          dotnet-version: "8.0.x"

      # `npm ci` rather than a bare `node --test`: the last case in
      # registry.test.ts imports the suite's real group files, and those import
      # the AWS SDK clients they drive. The `test:unit` script is what
      # contributors run, so CI invokes it rather than restating the command.
      - name: node-js-sdk suite
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/suites/node-js-sdk
        run: |
          npm ci
          npm run test:unit

      # `pip install` for the same reason `npm ci` is above — the
      # real-registration cases import the suite's own group modules, and those
      # import lib/clients.py, which imports boto3 — and it reaches further
      # than that import: lib/harness.py imports botocore lazily, inside the
      # path that classifies a raised exception, so the cases that deliberately
      # raise need it too.
      #
      # Both failure modes were live on main between #843 and this change, and
      # they are worth telling apart. The lazy botocore import errored, which
      # is loud. The real-registration cases *skipped* — they called skipTest
      # on the failed group import — and a skip is indistinguishable from a
      # pass at the exit code, so the only checks in this job that read
      # registry.json against a suite's own registrations were reported green
      # without running. That half is now a hard failure in the test itself.
      - name: python-sdk suite
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/suites/python-sdk
        run: |
          pip install --quiet -r requirements.txt
          python3 -m unittest discover -s tests

      - name: go-sdk suite
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/suites/go-sdk
        run: go test -count=1 ./...

      - name: cli suite
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/suites/cli
        run: go test -count=1 ./...

      # From the suite directory, not from the repository root: ErrorFixturesTest
      # walks up from the working directory to find compat/model/testdata/errors
      # (see the note above this job). It also runs the registry loader tests,
      # the scenario runtime tests and JavaSdkWireFactsTest — no emulator, no
      # Docker, no live AWS.
      - name: java-sdk suite
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/suites/java-sdk
        run: mvn -B test --no-transfer-progress

      # ubuntu-latest ships a stable Rust toolchain, so nothing is installed.
      # rust-cache rather than actions/cache: it keys on the resolved
      # dependency set and the compiler version, keeps only the parts of the
      # target directory worth restoring, and skips the save on a hit. Caching
      # this suite's whole `target` would be gigabytes against the repository's
      # 10 GB LRU budget, and would evict the Go and npm caches the steps above
      # depend on.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.code == 'true'
        with:
          workspaces: compat/suites/rust-sdk

      # Here for the same reason java-sdk is: the shared error-matching
      # fixtures are reachable only from the whole checkout (see the note above
      # this job). It also runs the registry loader tests and the scenario
      # runtime tests — no emulator, no Docker, no live AWS.
      - name: rust-sdk suite
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/suites/rust-sdk
        run: cargo test

      # This suite's own `dotnet test` already runs inside its Docker image
      # build, but only to prove the registrations compile and resolve — the
      # build context there is compat/suites/, which does not reach the shared
      # corpus (see the Dockerfile and compat/AGENTS.md § Where the shared
      # error corpus runs). Here, from the full checkout, ScenarioErrorFixtureTests
      # finds the corpus and really answers it.
      - name: dotnet-sdk suite
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/suites/dotnet-sdk
        run: dotnet test Tests/OvercastCompat.Tests.csproj -c Release

      # compat/ui (the compat dashboard) is a separate Vite/React app from web/
      # (see compat/AGENTS.md § Separation boundary) and had no CI coverage at
      # all until it got a job of its own — a broken tsc, Vite build, or vitest
      # run could reach main undetected (issue #1185). Folded in here because
      # that job's whole cost beyond the work was a second checkout and a
      # second Node install, and this job already installs Node with an npm
      # cache; 26 s of checks did not need a runner slot of their own.
      #
      # Its gate was identical to this job's — on whether *some* code changed,
      # not scoped to compat/ui specifically, because ci-scope.py is a
      # prose-vs-code classifier and not a per-directory path filter (see its
      # docstring) — so the steps carry the same condition as everything else
      # here rather than a narrower one nothing else uses.
      - name: compat/ui install
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/ui
        run: npm ci

      # Attributable failure before `build` (which also typechecks via
      # `tsc -b`) would otherwise surface it inside the build step instead.
      - name: compat/ui type check
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/ui
        run: npm run typecheck

      - name: compat/ui unit tests
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/ui
        run: npm run test

      - name: compat/ui build
        if: needs.changes.outputs.code == 'true'
        working-directory: compat/ui
        run: npm run build

  # Unreleased changes live as one fragment file per PR under .changelog/
  # (files at unique paths cannot merge-conflict); CHANGELOG.md's [Unreleased]
  # section stays empty between releases. This check lints every fragment and
  # fails any change that writes into [Unreleased] directly.
  changelog-check:
    name: Changelog fragments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint fragments and enforce empty [Unreleased]
        run: python3 scripts/changelog.py check

  # Two jobs in one: this was "Docs and capability registry" (make docs-check,
  # 23 s) and "AWS operation coverage" (make aws-models-check-ci since #1780,
  # 88 s), and each was a checkout, a setup-go and one `make` target over the
  # same module. The
  # second was paying a runner start and a module download for its 88 s of
  # work. The job keeps the first name because the `Protect Main` ruleset
  # requires it (read 2026-09-05); the second survives as a step name, which is
  # where a failure is read from anyway.
  #
  # Gated, where neither of them was. Both compile Go, and ci-scope.py counts
  # docs/ as code — deliberately, because embed.go compiles the published docs
  # into the binary — so anything either check can react to already sets
  # `code`. A prose-only pull request was spending ~110 s and two slots on two
  # checks with nothing to read.
  docs-check:
    name: Docs and capability registry
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Docs and capability registry
        if: needs.changes.outputs.code == 'true'
        run: make docs-check
      - name: AWS operation coverage
        if: needs.changes.outputs.code == 'true'
        run: make aws-models-check-ci
      - name: Validate the generated compat model
        if: needs.changes.outputs.code == 'true'
        run: make compat-model-check

  # Gated like the Go jobs from `Lint` down, with one extra consequence: this
  # job produces the web-dist artifact, so anything downstream of it has to be
  # gated on the same output or it will wait for an upload that is not coming.
  # cross-build is the only such consumer.
  #
  # The install is NOT gated. Two pull requests that each regenerate
  # web/pnpm-lock.yaml can both be green and still leave main with a lockfile
  # neither of them had: #1257 and #1258 did exactly that (jest-dom's peer
  # suffix naming a vitest snapshot the file no longer held), and
  # `pnpm install --frozen-lockfile` failed on main for five commits while every
  # pull request in between was prose-only and skipped this job. The push runs
  # on main did go red, and nothing gates on those. So the install runs on
  # every pull request whatever the paths say: with the store cache hit it is
  # ~20 s all told (checkout, pnpm, node, install), and a broken lockfile fails
  # at the first step that reads it. Nothing cheaper catches it — pnpm's
  # `--lockfile-only` checks that the lockfile satisfies package.json, which a
  # badly merged lockfile still does; the missing-snapshot error only fires when
  # the dependency graph is built for a real install (verified against the
  # #1257/#1258 lockfile: `--frozen-lockfile --lockfile-only` exits 0 on it).
  web:
    name: Web UI
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same two reasons to run as `docker`: a release candidate needs the SPA
    # built whatever the changed paths say, because cross-build consumes this
    # job's artifact.
    env:
      RUN_BUILD: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.rc == 'true' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup-go, and nothing generated before the build: the console
      # fetches its docs navigation from the Go BFF at runtime rather than
      # importing a generated module, so this job is Node-only and stays that
      # way. See internal/docsindex.
      # pnpm/action-setup must precede setup-node: `cache: pnpm` resolves the
      # store path by running pnpm, so pnpm has to be on PATH by then.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Ungated on purpose — see the note above the job. This is the lockfile
      # validity check for main; everything below it is the SPA build.
      - name: Install (lockfile validity check, every pull request)
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: env.RUN_BUILD == 'true'
        run: pnpm run lint
      # Not `tsc --noEmit`: that resolves web/tsconfig.json, a
      # solution-style config with "files": [] and only project references, so
      # it compiles zero files and always passes. `pnpm run typecheck` runs
      # tsconfig.app.json and tsconfig.node.json explicitly.
      - name: Type check
        if: env.RUN_BUILD == 'true'
        run: pnpm run typecheck
      # Runs before the build so a test failure is attributable to this step
      # rather than surfacing (or not) somewhere inside the build.
      - name: Unit tests
        if: env.RUN_BUILD == 'true'
        run: pnpm run test
      # `pnpm run build` re-runs typecheck. That duplication is deliberate: the
      # dedicated step above gives an attributable failure, and invoking the
      # published script keeps CI from drifting from what contributors run
      # locally.
      - name: Build SPA
        if: env.RUN_BUILD == 'true'
        run: VITE_BUNDLED=true pnpm run build
      - name: Upload web assets
        if: env.RUN_BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # version-guard replaces the push ruleset GitHub does not offer public
  # repos: VERSION may only change in a PR authored by the release App or by
  # someone CODEOWNERS already trusts with the file. Fork PRs run this with a
  # read-only token — it only reads the diff — and a release PR passes
  # untouched. Enforced by being a required status check ("VERSION guard") on
  # main.
  #
  # The release App is allowed because release PRs are generated by the Release
  # Prep workflow rather than hand-written, and dispatching that workflow needs
  # write access to this repository — so the set of people who can produce a
  # VERSION change is unchanged. What the App additionally buys is a PR the
  # owner is not the author of, and therefore one they can review: CODEOWNERS
  # owns VERSION, and nobody can approve their own PR.
  #
  # The owners come from the VERSION rule in CODEOWNERS, read from the PR's
  # BASE commit (HEAD^1 of the merge commit) rather than from the branch: a PR
  # that added its own author to CODEOWNERS must not thereby pass the guard
  # that same file defines. This used to compare the author against
  # github.repository_owner — the maintainer's own login until the repository
  # moved into an organisation, after which it is `overcast-sh`, a login nobody
  # has, so no human author could satisfy the guard any more (#1604).
  version-guard:
    name: VERSION guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_BOT: overcast-release[bot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: VERSION changes only by a VERSION code owner or the release App
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if ! git diff --name-only HEAD^1 HEAD | grep -qx 'VERSION'; then
            echo "VERSION untouched."
            exit 0
          fi
          if [ "$AUTHOR" = "$RELEASE_BOT" ]; then
            echo "VERSION changed by @$AUTHOR (the release App) - allowed."
            exit 0
          fi
          # Owners of the VERSION rule in CODEOWNERS as the BASE commit has it.
          # A team (@org/team) cannot be resolved without an API call, so it is
          # not honoured: the guard fails closed and says who is listed.
          owners="$(git show HEAD^1:.github/CODEOWNERS \
            | awk '$1 == "VERSION" { for (i = 2; i <= NF; i++) if ($i ~ /^@[^\/]+$/) print tolower(substr($i, 2)) }')"
          author="$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')"
          if printf '%s\n' "$owners" | grep -qx "$author"; then
            echo "VERSION changed by @$AUTHOR (a VERSION code owner) - allowed."
            exit 0
          fi
          echo "::error::VERSION may only be changed by @$RELEASE_BOT (release PRs) or a VERSION code owner in .github/CODEOWNERS. Author of this PR: @$AUTHOR. Code owners of VERSION: $(printf '%s' "$owners" | tr '\n' ' ')" >&2
          exit 1

  # The binary set is defined once in build-binaries.yml and shared with
  # release.yml, so the PR check builds exactly what a release would ship.
  # On a release-candidate build the binaries are also uploaded as artifacts;
  # on every other PR this stays a pure build check.
  # A job-level `if:` here rather than the step-level gate the others use: this
  # calls a reusable workflow, where steps are not ours to condition. That is
  # safe precisely because Cross-build is not a required check — skipping it
  # reports nothing, which for a required check would block the pull request
  # forever. It also has to be gated: it consumes web-dist, which a gated-off
  # `web` job does not upload.
  cross-build:
    name: Cross-build
    needs: [changes, web]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.rc == 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ci
      upload-artifacts: ${{ needs.changes.outputs.rc == 'true' }}
      retention-days: 14

  docker:
    name: Docker build (${{ matrix.image }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One condition, named once, because this job has two reasons to build and
    # six later steps that assume a checkout happened.
    #
    # A release candidate must be built and published whatever the paths say:
    # release-candidate-check reads the *checked-out* VERSION, so during a
    # release window `rc` is true on any pull request, not only the one that
    # changed VERSION. Gating on paths alone would leave those steps running
    # against an empty workspace.
    env:
      RUN_BUILD: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.rc == 'true' }}
    # contents: read restates the default that adding a job-level block would
    # otherwise drop; packages: write is exercised only on same-repo release
    # PRs, where the freshly built image is pushed as a release candidate.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: console
            tag: overcast:ci
            target: ""
          - image: slim
            tag: overcast-slim:ci
            target: slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_BUILD == 'true'
      # The test jobs already pull through the mirror; this one did not, and it
      # is the job that pulls the most — every base layer of a two-stage build,
      # twice over the matrix. This configures the daemon, which is what the
      # smoke tests' `docker run` and `docker pull` go through; the build
      # itself now runs in BuildKit, which needs the same mirror stated again
      # in its own configuration — see the next step.
      - uses: ./.github/actions/docker-hub-mirror
        if: env.RUN_BUILD == 'true'

      # buildx, so the build can read and write a layer cache. The pull-request
      # build used the classic builder and rebuilt from scratch every time
      # (107 s per flavour when this was measured; 116-136 s in runs
      # 33946645470, 33944965566 and 33945978965), while the release-candidate
      # push below has had `cache-from: type=gha` all along. Same scope string
      # as that push, so the two share one cache: the candidate build reuses
      # what the pull-request build just produced instead of starting over.
      #
      # buildkitd-config-inline restates the registry mirror. The
      # docker-container driver runs BuildKit in a container of its own, which
      # does not read /etc/docker/daemon.json, so without this the step above
      # would stop applying to base-layer pulls — the exact gap that turned a
      # Docker Hub timeout into a red main (docs/plans/ci-streamlining.md,
      # finding 5). The `docker` driver would inherit the daemon's mirror but
      # cannot export a cache, which is the whole point here.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: env.RUN_BUILD == 'true'
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # `load: true` puts the image in the local daemon under the same tag the
      # classic build used, which is what the smoke tests and the
      # Testcontainers Go module below run against. Single-platform, so it can
      # be loaded — the multi-arch candidate below cannot be, which is why that
      # one builds and pushes in a single step.
      - name: Build image
        if: env.RUN_BUILD == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          target: ${{ matrix.target }}
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=overcast-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=overcast-${{ matrix.image }}
      # Liveness, plus the two surfaces that tell a slim image apart from a
      # console one at runtime. The Dockerfile already asserts the same thing
      # statically against the compiled binary; this checks the assembled
      # image actually behaves that way, which is the form the bug was
      # reported in (#798): /_overcast/mcp answered 406 rather than 404, and the UI
      # port served the SPA, for several releases of a supposedly slim image.
      - name: Smoke test (slim)
        if: env.RUN_BUILD == 'true' && matrix.image == 'slim'
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker run -d --name oc-smoke -p 4566:4566 -p 4567:4567 "$TAG"
          trap 'docker rm -f oc-smoke >/dev/null 2>&1 || true' EXIT
          sleep 2
          curl -sf http://localhost:4566/_overcast/health

          # 404 because internal/router/mcp_routes.go is !slim only. Any other
          # status means the route is registered, i.e. this is not a slim build.
          mcp=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4566/_overcast/mcp)
          if [[ "$mcp" != "404" ]]; then
            echo "slim image answers $mcp on /_overcast/mcp, expected 404 — /_overcast/mcp is registered, so this is not a slim build" >&2
            exit 1
          fi

          # cmd/overcast/embed_web_slim.go serves this in place of the SPA.
          ui=$(curl -s http://localhost:4567/)
          if [[ "$ui" != *"web UI not included in slim build"* ]]; then
            echo "slim image serves something other than the slim UI stub on the web port:" >&2
            printf '%.200s\n' "$ui" >&2
            exit 1
          fi

          # #1546: what the LocalStack Testcontainers modules need from the
          # image, which no Go test can see. Java, Node and Python block on
          # this exact line (cmd/overcast/readiness.go); Java also replaces the
          # entrypoint and execs LocalStack's path from a #!/bin/bash script.
          # Checked on slim only — stage 5 of the Dockerfile is shared, so the
          # console image cannot differ.
          # Polled rather than grepped once. cmd/overcast/cmd_serve.go emits the
          # marker before any listener is served, so it is out before health can
          # answer — but a loaded runner can still interleave the container's
          # stderr with docker's log fetch, and a single grep turns that into a
          # red build for a line that arrives a moment later.
          ready=false
          for _ in $(seq 1 20); do
            if docker logs oc-smoke 2>&1 | grep -qx 'Ready\.'; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != "true" ]]; then
            echo "image did not print the LocalStack-compatible readiness line 'Ready.' within 10s — see cmd/overcast/readiness.go and docs/testcontainers.md" >&2
            docker logs oc-smoke 2>&1 | tail -20 >&2
            exit 1
          fi
          if ! docker run --rm --entrypoint sh "$TAG" \
              -c 'test -x /usr/local/bin/docker-entrypoint.sh && command -v bash >/dev/null'; then
            echo "image is missing /usr/local/bin/docker-entrypoint.sh or bash — the Java LocalStack Testcontainers module needs both (#1546)" >&2
            exit 1
          fi

      # The Testcontainers Go module (testcontainers/go), exercised against
      # the image built from this pull request rather than a published tag —
      # so a change that breaks the module's contract (the health endpoint,
      # /_overcast/info, the edge port) fails here, before it ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN_BUILD == 'true' && matrix.image == 'slim'
        with:
          go-version-file: go.mod
          cache: true
      - name: Testcontainers Go module tests
        if: env.RUN_BUILD == 'true' && matrix.image == 'slim'
        working-directory: testcontainers/go
        env:
          OVERCAST_TESTCONTAINERS_IMAGE: ${{ matrix.tag }}
        run: go test -count=1 -timeout 600s ./...

      # The same two probes with the opposite expectation. Without it, "make
      # the slim image slim" has a passing shortcut that breaks the console
      # image, and nothing in CI would say so.
      - name: Smoke test (console)
        if: env.RUN_BUILD == 'true' && matrix.image == 'console'
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker run -d --name oc-smoke -p 4566:4566 -p 4567:4567 "$TAG"
          trap 'docker rm -f oc-smoke >/dev/null 2>&1 || true' EXIT
          sleep 2
          curl -sf http://localhost:4566/_overcast/health

          # Registered, so anything but 404. A bare GET without an SSE Accept
          # header is refused with 406 by the MCP transport — that refusal is
          # itself the evidence the route exists.
          mcp=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4566/_overcast/mcp)
          if [[ "$mcp" == "404" ]]; then
            echo "console image answers 404 on /_overcast/mcp — the runtime MCP surface is missing" >&2
            exit 1
          fi

          ui=$(curl -s http://localhost:4567/)
          if [[ "$ui" != *"<!doctype html>"* && "$ui" != *"<!DOCTYPE html>"* ]]; then
            echo "console image does not serve the SPA on the web port:" >&2
            printf '%.200s\n' "$ui" >&2
            exit 1
          fi
      # On a release PR, publish this commit to GHCR as a release candidate:
      # {version}-rc.{run_number}. run_number increments per CI run, so every
      # push to the release branch mints a fresh RC and earlier ones stay
      # pullable for comparison.
      #
      # Built for the same platforms the release publishes, not just the
      # runner's. A candidate exists to be smoke tested, and an amd64-only one
      # left an arm64 maintainer testing emulated bits — which for an emulator
      # that itself launches containers is a different environment, not merely
      # a slower one, and makes a platform problem indistinguishable from a
      # regression. Mirrors the publish job's buildx setup rather than
      # inventing another: a multi-arch manifest cannot be `docker load`ed, so
      # this builds and pushes in one step instead of tagging the local image.
      # The native build above still runs, and is what the slim smoke test
      # exercises; the amd64 half of this build reuses its layers from cache.
      #
      # No setup-buildx step of its own any more. RUN_BUILD is
      # `code || rc`, so the builder the pull-request build sets up is always
      # already there by the time rc is true — and it carries the registry
      # mirror, which the second setup never did.
      - name: Log in to GHCR
        if: needs.changes.outputs.rc == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # .dockerignore ignores everything and then allowlists, so the build
      # context is a closed, explicit set of paths. The image is therefore a
      # pure function of those paths plus the build args — nothing else in the
      # repository can reach it, because Docker never receives it. Hashing that
      # set gives a content address the build can be keyed on, which is what
      # makes skipping safe rather than a guess about which paths "look"
      # relevant: a change to anything Docker can see changes the hash.
      #
      # The hash lands on the image as a second tag, so a later run can ask the
      # registry "have these exact bits been built?" without keeping state.
      - name: Name the release candidate
        id: rc-name
        if: needs.changes.outputs.rc == 'true'
        env:
          IMAGE_SUFFIX: ${{ matrix.image == 'slim' && '-slim' || '' }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/overcast${IMAGE_SUFFIX}"
          # There are exactly four routes from the context into the image:
          # the compiled ./cmd/overcast, the two files the runtime stage COPYs
          # from docker/, `//go:embed all:web/dist`, and
          # `//go:embed docs/*.md docs/cdk docs/services`. The paths below are
          # that list, so anything omitted provably cannot change the image:
          #
          #   cmd/overcast only  — every cmd/* is `package main`, and Go cannot
          #                        import a main package, so no other one can
          #                        reach this binary.
          #   docs, partially    — only what embed.go embeds. docs/plans,
          #                        docs/dev and docs/generated are excluded
          #                        there deliberately, and the runtime stages
          #                        copy in nothing but the binary, so an
          #                        unembedded doc has no way in.
          #   no *_test.go or testdata/ — the toolchain drops both from
          #                        `go build`, and non-test code cannot even
          #                        reference them.
          #
          # Web test files are deliberately NOT excluded: nothing stops app
          # code importing one into the bundle, so it would rest on a habit
          # rather than a rule.
          #
          # These narrowings guard themselves. Building another cmd would
          # change the Dockerfile; embedding more docs would change embed.go;
          # both are hashed, so widening the image's inputs forces a rebuild.
          #
          # scripts/ci-scope.py `reaches_image` restates this path list to
          # decide whether a PR gets a candidate at all. Change one, change the
          # other: ci_scope_test.py fails if they drift.
          hash=$(
            {
              git ls-tree -r HEAD -- go.mod go.sum embed.go embed_slim.go \
                cmd/overcast internal web docker Dockerfile .dockerignore \
                docs/cdk docs/services docs/*.md \
                | grep -vE '_test\.go$|/testdata/'
              echo "VERSION=${version}"
              echo "TARGET=${TARGET}"
            } | sha256sum | cut -c1-16
          )
          {
            echo "version=${version}"
            echo "image=${repo}:${version}-rc.${RUN_NUMBER}"
            echo "context=${repo}:ctx-${hash}"
          } >> "$GITHUB_OUTPUT"
          echo "Build context hash: ${hash}"

      # Retagging a manifest is a registry-side operation — no pull, no build,
      # a couple of seconds — so an unchanged context costs nothing beyond the
      # lookup. A prose-only push to a release branch takes this path.
      - name: Reuse an identical candidate when one exists
        id: rc-reuse
        if: needs.changes.outputs.rc == 'true'
        env:
          RC_IMAGE: ${{ steps.rc-name.outputs.image }}
          CONTEXT_IMAGE: ${{ steps.rc-name.outputs.context }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$CONTEXT_IMAGE" >/dev/null 2>&1; then
            echo "Build context unchanged — retagging instead of rebuilding."
            docker buildx imagetools create -t "$RC_IMAGE" "$CONTEXT_IMAGE"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "Build context is new — building."
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release-candidate image
        id: rc-push
        if: needs.changes.outputs.rc == 'true' && steps.rc-reuse.outputs.reused == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          tags: ${{ steps.rc-name.outputs.image }},${{ steps.rc-name.outputs.context }}
          build-args: VERSION=${{ steps.rc-name.outputs.version }}
          cache-from: type=gha,scope=overcast-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=overcast-${{ matrix.image }}

      # Resolved from the registry either way, so the recorded digest is the
      # manifest actually tagged whether it was just built or retagged.
      - name: Record release-candidate image reference
        id: rc-record
        if: needs.changes.outputs.rc == 'true'
        env:
          RC_IMAGE: ${{ steps.rc-name.outputs.image }}
          REUSED: ${{ steps.rc-reuse.outputs.reused }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$RC_IMAGE" --format '{{.Manifest.Digest}}')
          mkdir -p rc-meta
          {
            echo "$RC_IMAGE"
            echo "${RC_IMAGE}@${digest}"
            echo "reused=${REUSED}"
          } > "rc-meta/rc-image-${{ matrix.image }}.txt"
      - name: Upload release-candidate image reference
        if: steps.rc-record.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-image-${{ matrix.image }}
          path: rc-meta/rc-image-${{ matrix.image }}.txt
          retention-days: 14

  # rc-comment maintains one bot comment on a release PR — release-notes
  # shaped: the RC images with pull commands and digests, and a table of the
  # binary artifacts — so the candidate CI built is one click away. The
  # comment is updated in place on every build rather than posted again.
  rc-comment:
    name: Release candidate summary
    needs: [changes, cross-build, docker]
    if: needs.changes.outputs.rc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rc-image-*
          path: rc-meta
          merge-multiple: true
      - name: Upsert RC comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- overcast-rc-build -->';

            const images = [];
            for (const image of ['console', 'slim']) {
              const f = `rc-meta/rc-image-${image}.txt`;
              if (fs.existsSync(f)) {
                const [ref, withDigest, reused] = fs.readFileSync(f, 'utf8').trim().split(/\r?\n/);
                images.push({
                  ref,
                  digest: (withDigest || '').split('@')[1] || '',
                  reused: (reused || '') === 'reused=true',
                });
              }
            }

            const { data: arts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId, per_page: 100,
            });
            const mb = (n) => (n / (1024 * 1024)).toFixed(1) + ' MB';
            const binaries = arts.artifacts
              .filter(a => a.name.startsWith('overcast'))
              .sort((a, b) => a.name.localeCompare(b.name));

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha;
            const rcName = images[0] ? images[0].ref.split(':').pop() : `rc.${context.runNumber}`;

            let body = `${marker}\n## Release candidate \`${rcName}\`\n\n`;
            body += `Current for head \`${sha.slice(0, 8)}\` — [workflow run](${runUrl}).\n`;
            // Say which, so "no rebuild" is a stated outcome rather than
            // something to infer from a fast job.
            const reused = images.length > 0 && images.every(i => i.reused);
            body += reused
              ? `Bit-for-bit identical to the previous candidate — this push changed nothing the image is built from, so it was retagged rather than rebuilt.\n`
              : `Freshly built: this push changed something the image is built from.\n`;
            body += `Every push to this branch mints a new RC tag; earlier RCs stay pullable.\n\n`;
            body += `### Images (linux/amd64, linux/arm64)\n\n`;
            for (const i of images) {
              body += '```\ndocker pull ' + i.ref + '\n```\n';
              if (i.digest) body += `<sub>digest \`${i.digest}\`</sub>\n\n`;
            }
            body += `### Binaries\n\n| Asset | Size |\n| --- | --- |\n`;
            for (const a of binaries) {
              body += `| [${a.name}](${runUrl}#artifacts) | ${mb(a.size_in_bytes)} |\n`;
            }
            body += `\n<sub>Binary artifacts expire after 14 days. RC image tags are transient pre-release builds.</sub>\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const stale = comments.filter(c => c.body && c.body.includes(marker));

            // Post first, delete second: the PR is never left without a
            // candidate to test if the second call fails.
            //
            // Reposting rather than editing in place is the whole point.
            // GitHub anchors an edited comment at its original position and
            // hides the update behind a small "edited" marker, so a refreshed
            // RC was invisible unless you went looking for it. A new comment
            // carries its own timestamp, which is the freshness signal.
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            for (const c of stale) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id,
              });
            }
