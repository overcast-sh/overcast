# Taskfile.yml — cross-platform task runner.
# Works on Mac, Linux, and Windows without GNU Make.
#
# Install Task:
#   Mac/Linux: brew install go-task
#   Windows:   scoop install task  OR  winget install Task.Task
#   Any:       https://taskfile.dev/installation/
#
# Usage:
#   task build
#   task test
#   task --list    (show all tasks)
#
# All targets are equivalent to their Makefile counterparts.

version: "3"

vars:
  BINARY: overcast
  BUILD_DIR: ./bin
  VERSION:
    sh: cat VERSION
  ACTIONLINT_VERSION: v1.7.7
  # Keep in sync with the Makefile and .devcontainer/Dockerfile.
  GOLANGCI_LINT_VERSION: v2.8.0

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ---- Setup ----------------------------------------------------------------

  setup:
    desc: Verify all dev tools are installed
    cmds:
      - go run ./scripts/check-tools.go

  # ---- Build ----------------------------------------------------------------

  lambda-init:
    desc: Build the in-container Lambda init for both Linux architectures
    # Embedded into the overcast binary by internal/services/lambda/initbin. Both
    # architectures always: a function's Architectures picks the one copied into
    # its container, and an arm64 function runs under emulation on an amd64 host.
    cmds:
      - task: lambda-init-arch
        vars: { GOARCH: amd64 }
      - task: lambda-init-arch
        vars: { GOARCH: arm64 }

  lambda-init-arch:
    internal: true
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: "{{.GOARCH}}"
    cmds:
      - go build -trimpath -ldflags="-s -w" -o internal/services/lambda/initbin/dist/lambda-init-linux-{{.GOARCH}} ./cmd/lambda-init

  build:
    desc: Compile the binary for the current platform (includes embedded web UI)
    deps: [lambda-init]
    cmds:
      - cmd: mkdir -p {{.BUILD_DIR}}
        platforms: [darwin, linux]
      - cmd: if not exist {{.BUILD_DIR}} mkdir {{.BUILD_DIR}}
        platforms: [windows]
      - go build -trimpath -ldflags="-w -s -X main.version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.BINARY}}{{exeExt}} ./cmd/overcast
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY}}{{exeExt}}"

  build-web:
    desc: Build the web UI (run before build if assets are stale)
    dir: web
    env:
      VITE_BUNDLED: "true"
    cmds:
      - pnpm run build

  build-slim:
    desc: Compile the slim binary (no web UI) for the current platform
    # -tags slim does not drop the Lambda init: slim images run Lambda.
    deps: [lambda-init]
    cmds:
      - cmd: mkdir -p {{.BUILD_DIR}}
        platforms: [darwin, linux]
      - cmd: if not exist {{.BUILD_DIR}} mkdir {{.BUILD_DIR}}
        platforms: [windows]
      - go build -trimpath -tags slim -ldflags="-w -s -X main.version={{.VERSION}}" -o {{.BUILD_DIR}}/overcastd{{exeExt}} ./cmd/overcast

  # ---- Run ------------------------------------------------------------------

  run:
    desc: Build and run with dev defaults (cross-platform Go script)
    cmds:
      - go run ./scripts/run.go

  dev-server:
    desc: Watch Go sources and hot-reload the server (requires air)
    cmds:
      - air

  # ---- Test -----------------------------------------------------------------

  test:
    desc: Run all tests (race detector enabled where supported)
    cmds:
      - go test -race -count=1 -timeout=120s ./...

  test-unit:
    desc: Run unit tests only (fast — no server startup)
    cmds:
      - go test -race -count=1 -timeout=60s ./internal/...

  test-integration:
    desc: Run integration tests only
    cmds:
      - go test -race -count=1 -timeout=120s ./tests/...

  test-coverage:
    desc: Run tests and open HTML coverage report
    cmds:
      - go test -race -count=1 -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - cmd: open coverage.html
        platforms: [darwin]
      - cmd: start coverage.html
        platforms: [windows]
      - cmd: xdg-open coverage.html
        platforms: [linux]

  # ---- Docs -----------------------------------------------------------------

  generate-caps:
    desc: Generate service capability metadata
    cmds:
      - go run -tags dev ./cmd/capgen --generate

  check-caps:
    desc: Verify capabilities declarations match handlers
    cmds:
      - go run -tags dev ./cmd/capgen --check

  generate-ts:
    desc: Regenerate web/src/types/api.gen.ts from the Go response structs the web UI consumes
    cmds:
      - go run ./cmd/tsgen --write

  check-ts:
    desc: Verify web/src/types/api.gen.ts matches the Go response structs (CI gate)
    cmds:
      - go run ./cmd/tsgen --check

  generate-ddb-reserved-words:
    desc: Refresh internal/services/dynamodb/reserved_words.txt from the AWS DynamoDB Developer Guide (needs network)
    cmds:
      - go run ./scripts/dynamodb-reserved-words.go

  generate-aws-operations:
    desc: Regenerate the AWS operation manifest (requires AWS_MODELS_DIR and AWS_MODELS_REVISION)
    cmds:
      - go run ./cmd/awsmodelgen -models "{{.AWS_MODELS_DIR}}" -output internal/awsapi/manifest.gen.go -source-revision "{{.AWS_MODELS_REVISION}}" -shapes-out models/aws/shapes -shapes-services models/aws/shapes-services.txt -sdk-shapes-out internal/awsshapes -sdk-shapes-services models/aws/sdk-shapes-services.txt

  aws-models-check:
    desc: Validate the AWS operation corpus; set AWS_MODELS_DIR for a full regeneration diff
    cmds:
      - go test -count=1 ./cmd/awsmodelgen ./internal/awsapi ./internal/awsshapes ./internal/protocol/codec ./tests/integration/router
      - go test -count=1 -tags dev ./internal/router
      - go run -tags dev ./cmd/capgen --check-model
      - '{{if .AWS_MODELS_DIR}}go run ./cmd/awsmodelgen -models "{{.AWS_MODELS_DIR}}" -output internal/awsapi/manifest.gen.go -source-revision "{{.AWS_MODELS_REVISION}}" -shapes-out models/aws/shapes -shapes-services models/aws/shapes-services.txt -sdk-shapes-out internal/awsshapes -sdk-shapes-services models/aws/sdk-shapes-services.txt -check{{else}}echo "AWS_MODELS_DIR not set; skipping full regeneration diff"{{end}}'

  generate-compat-model:
    desc: Regenerate the compat scenario IR, gaps.json and registry.generated.json from compat/model/recipes/
    cmds:
      - go run -tags dev ./cmd/compatgen

  compat-model-check:
    desc: Prove the committed compat model is byte-identical to the generator's output
    cmds:
      - go test -count=1 -tags dev ./cmd/compatgen
      - go run -tags dev ./cmd/compatgen -check

  docs-lint:
    desc: Check docs frontmatter, anchors, service page structure and the description budget
    cmds:
      - go run ./scripts/docs-index.go --check

  docs:
    desc: Regenerate the sentinel-bracketed capability tables in docs/services
    deps: [generate-caps]
    cmds:
      - go run -tags dev ./cmd/capgen --write-docs

  docs-check:
    desc: Verify generated docs artifacts are up to date and every doc passes the docs lint
    deps: [check-caps, check-ts, docs-lint]
    cmds:
      - go run -tags dev ./cmd/capgen --generate
      - git diff --exit-code internal/capabilities/all.gen.go
      - go run -tags dev ./cmd/capgen --write-docs
      - git diff --exit-code README.md STATUS.md docs/README.md docs/services/ docs/generated/service-support.json

  compat-registry-check:
    desc: Validate compat/suites/registry.json against registry.schema.json
    cmds:
      - python3 scripts/validate-compat-registry.py

  # ---- Quality --------------------------------------------------------------

  bench:
    desc: Run benchmarks with memory allocation reporting
    cmds:
      - go test -bench=. -benchmem -count=3 ./...

  lint:
    desc: Run all linters (Go/emulation, web UI, GitHub Actions)
    deps: [lint-go, lint-web, lint-actions]

  lint-go:
    desc: Run golangci-lint for Go/emulation code
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./...
      - bash scripts/verify-changed.sh --record go

  lint-web:
    desc: Run web UI linting
    dir: web
    cmds:
      - pnpm run lint

  lint-actions:
    desc: Lint GitHub Actions workflows
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}} .github/workflows/*.yml

  fmt:
    desc: Format all Go source files
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy and verify go.mod / go.sum
    cmds:
      - go mod tidy
      - go mod verify

  check:
    desc: Run all pre-PR checks (fmt + vet + lint + test)
    deps: [fmt, vet, lint, test]

  verify:
    desc: Run the required-CI checks this branch touches (cached — a no-op if nothing changed)
    cmds:
      - bash scripts/verify-changed.sh {{.CLI_ARGS}}

  ci-local:
    desc: Run the whole CI pipeline locally (Go via Docker — no host Go needed)
    cmds:
      - bash scripts/ci-local.sh {{.CLI_ARGS}}

  ci-local-web:
    desc: CI pipeline, web stages only (lint, typecheck, vitest, build)
    cmds:
      - bash scripts/ci-local.sh --web-only

  ci-local-go:
    desc: CI pipeline, Go stages only (docs index, vet, build, unit tests)
    cmds:
      - bash scripts/ci-local.sh --go-only

  # ---- Compatibility suites -------------------------------------------------
  # All of these manage their own throwaway Overcast instance on free ports —
  # 4566/4567 stay yours. Pass --endpoint to target an instance you run.

  compat:
    desc: Run the compat suites headlessly (starts its own Overcast instance)
    cmds:
      - go run ./cmd/compat {{.CLI_ARGS}}

  compat-dev:
    desc: Compat dashboard with a hot-reloading UI, opened in a browser
    cmds:
      - go run ./cmd/compat --dev {{.CLI_ARGS}}

  compat-serve:
    desc: Compat dashboard with a pre-built UI, opened in a browser
    cmds:
      - go run ./cmd/compat --serve --interactive --build-ui --open {{.CLI_ARGS}}

  compat-docker:
    desc: Run the compat suites entirely in containers (no host Go or Node)
    cmds:
      - docker compose -f compat/docker-compose.yml run --rm compat

  compat-report:
    desc: Print an agent-friendly summary of the last compat run
    cmds:
      - go run ./cmd/compat --report

  # ---- Docker ---------------------------------------------------------------

  docker:
    desc: Build both Docker images (console + slim)
    deps: [docker-console, docker-slim]

  # The tag is not hardcoded: it defaults to the sanitised current branch name
  # so that parallel worktrees do not build into one tag and silently run each
  # other's image. scripts/image-tag.{sh,ps1} derives it and documents what a
  # slash, uppercase and a detached HEAD each become; set OVERCAST_IMAGE_TAG to
  # override. These go through the script per platform, the same way
  # container-test does, because a Taskfile `sh:` var would need a POSIX shell
  # on PATH and a Windows box installing Task via scoop has none.
  # Built images are not free: `task docker-clean` removes this branch's pair.

  docker-console:
    desc: Build the Docker image with web console (tagged after the current branch)
    cmds:
      - cmd: 'docker build -t "overcast:$(sh scripts/image-tag.sh)" .'
        platforms: [darwin, linux]
      - cmd: "powershell -NoProfile -ExecutionPolicy Bypass -Command '$t = & ./scripts/image-tag.ps1; docker build -t overcast:$t .'"
        platforms: [windows]

  docker-slim:
    desc: Build the slim Docker image (no web UI, for CI)
    cmds:
      - cmd: 'docker build --target slim -t "overcast-slim:$(sh scripts/image-tag.sh)" .'
        platforms: [darwin, linux]
      - cmd: "powershell -NoProfile -ExecutionPolicy Bypass -Command '$t = & ./scripts/image-tag.ps1; docker build --target slim -t overcast-slim:$t .'"
        platforms: [windows]

  docker-run:
    desc: Run the Docker image with debug logging
    cmds:
      - cmd: 'docker run --rm -p 4566:4566 -e OVERCAST_LOG_LEVEL=debug "overcast:$(sh scripts/image-tag.sh)"'
        platforms: [darwin, linux]
      - cmd: "powershell -NoProfile -ExecutionPolicy Bypass -Command '$t = & ./scripts/image-tag.ps1; docker run --rm -p 4566:4566 -e OVERCAST_LOG_LEVEL=debug overcast:$t'"
        platforms: [windows]

  docker-clean:
    desc: Remove this branch's Docker images
    cmds:
      # ignore_error: neither image is guaranteed to exist — `task docker-console`
      # alone leaves no slim image — and "nothing to remove" is success here.
      - cmd: 'docker image rm "overcast:$(sh scripts/image-tag.sh)" "overcast-slim:$(sh scripts/image-tag.sh)"'
        platforms: [darwin, linux]
        ignore_error: true
      - cmd: "powershell -NoProfile -ExecutionPolicy Bypass -Command '$t = & ./scripts/image-tag.ps1; docker image rm overcast:$t overcast-slim:$t'"
        platforms: [windows]
        ignore_error: true

  docker-clean-test-networks:
    desc: Remove the overcast_*_test_* networks a killed test run left behind (empty, older than 15 minutes; never a shared instance's planes)
    cmds:
      - go run ./scripts/docker-clean-test-networks.go

  docker-compose:
    desc: Start with docker compose (rebuilds image)
    cmds:
      - docker compose up --build

  # ---- Clean ----------------------------------------------------------------

  clean:
    desc: Remove build artefacts
    cmds:
      - go clean ./...
      - cmd: rm -rf {{.BUILD_DIR}} coverage.out coverage.html
        platforms: [darwin, linux]
      - cmd: if exist {{.BUILD_DIR}} rmdir /s /q {{.BUILD_DIR}}
        platforms: [windows]
      - cmd: if exist coverage.out del /q coverage.out
        platforms: [windows]
      - cmd: if exist coverage.html del /q coverage.html
        platforms: [windows]

  # ---- Container-based development (cross-platform) ------------------------
  # These targets work identically on Mac, Linux, and Windows.
  # Require Docker but not a local Go installation.

  # These go through scripts/container-test.{sh,ps1} rather than calling docker
  # compose directly: the wrapper derives the container's CPU cap from the host
  # and hands it to the Compose file, which cannot compute one itself. See that
  # script's header.

  container-test:
    desc: Run all tests inside a Linux container (works on any OS with Docker)
    cmds:
      - cmd: bash scripts/container-test.sh
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\container-test.ps1
        platforms: [windows]

  container-test-unit:
    desc: Run unit tests inside a container
    cmds:
      - cmd: bash scripts/container-test.sh -race -count=1 -timeout=60s ./internal/...
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\container-test.ps1 -race -count=1 -timeout=60s ./internal/...
        platforms: [windows]

  container-test-integration:
    desc: Run integration tests inside a container
    cmds:
      - cmd: bash scripts/container-test.sh -race -count=1 -timeout=120s ./tests/...
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\container-test.ps1 -race -count=1 -timeout=120s ./tests/...
        platforms: [windows]

  dev:
    desc: Start the dev server with source mounted (no local Go needed)
    cmds:
      - docker compose -f docker-compose.dev.yml up overcast

  dev-build:
    desc: Force rebuild of the dev server container
    cmds:
      - docker compose -f docker-compose.dev.yml up --build overcast
