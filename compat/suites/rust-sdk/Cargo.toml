[package]
name = "rust-sdk-compat"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "=1.5.10"
aws-credential-types = "=1.3.0"
aws-sdk-batch = "=1.126.0"
# Added with the authored logs-groups port (#1116): emit_rust.go writes
# aws_sdk_cloudwatchlogs calls for it, and a crate this suite does not depend on
# is a build failure here rather than a generation-time refusal. 1.57.0 is the
# release of the same vintage as its neighbours below, so it resolves under the
# aws-smithy-runtime-api and aws-smithy-types pins without moving them.
aws-sdk-cloudwatchlogs = "=1.57.0"
aws-sdk-dynamodb = "=1.56.0"
aws-sdk-elasticloadbalancing = "=1.111.0"
aws-sdk-eventbridge = "=1.54.0"
# Newer than its neighbours on purpose: emit_rust.go writes a call for every
# operation models/aws/shapes/iam.json carries, and an older crate is a build
# failure of this suite rather than a generation-time refusal. 1.123.0 is the
# version cargo resolves under the aws-smithy-runtime-api and aws-smithy-types
# pins below, and it declares the delegation-request, human-readable-summary
# and outbound-web-identity-federation operations the iam probe group calls.
aws-sdk-iam = "=1.123.0"
aws-sdk-kms = "=1.52.0"
aws-sdk-lambda = "=1.55.0"
aws-sdk-organizations = "=1.102.0"
aws-sdk-s3 = "=1.65.0"
aws-sdk-secretsmanager = "=1.52.0"
aws-sdk-servicediscovery = "=1.110.0"
aws-sdk-sns = "=1.52.0"
aws-sdk-sqs = "=1.51.0"
aws-sdk-ssm = "=1.52.0"
aws-sdk-sts = "=1.51.0"
aws-smithy-runtime-api = "=1.16.0"
aws-smithy-types = "=1.6.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std"] }
flate2 = "1"
regex = "1"
# The tokenizer aws-smithy-xml is built on, and so the reader the AWS SDK
# itself parsed the Query/REST XML response with: src/scenario/xml.rs turns
# that body into the IR's document form.
xmlparser = "0.13"
