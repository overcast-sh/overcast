service: acm
status: fixed
priority: p2
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-25
protocols: [aws_json_1_1, aws_json_1_0, rpcv2_cbor]
implementation: [internal/services/acm]
integration_tests: [tests/integration/acm]
capability_docs: docs/services/acm.md
operation_count_estimate: 11 tracked; 9 supported, 2 partial (ListCertificates, ListCertificateDomainValidations)
current_support_level: "Minimal certificate lifecycle; certificates immediately ISSUED. DomainName, SANs and ValidationMethod are validated against the modeled constraints, DescribeCertificate returns DomainValidationOptions (with a stable synthetic CNAME for DNS), and ListCertificates filters on CertificateStatuses (#1994). Both tag-operation spellings share one tag set, round-trip, validate AWS's reserved-prefix/length/merged-set-limit constraints, and are covered by integration tests (#814, #1275, #1739)."
operations:
  TagResource:
    status: fixed
    priority: p2
    aws_docs:
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_TagResource.html
    implementation:
      - internal/services/acm/typed_logic.go:476 (tagResourceTyped)
    tests:
      present:
        - tests/integration/acm/acm_tagging_test.go::TestACMTagResource_roundTrips
        - tests/integration/acm/acm_tagging_test.go::TestACMTagResource_sharesTagsWithTheCertificateSpelling
        - tests/integration/acm/acm_tagging_test.go::TestACMTagResource_reservedPrefixRejected
        - tests/integration/acm/acm_tagging_test.go::TestACMTagResource_tagLimitEnforcedOnMergedSet
    scenario_matrix:
      - scenario: Tag a certificate by ResourceArn and read it back.
        status: fixed
        evidence: TestACMTagResource_roundTrips.
      - scenario: TagResource and the legacy AddTagsToCertificate address one shared tag set.
        status: fixed
        evidence: TestACMTagResource_sharesTagsWithTheCertificateSpelling — a tag written through either spelling is visible through ListTagsForResource.
      - scenario: "A reserved aws: key prefix."
        status: fixed
        evidence: "TestACMTagResource_reservedPrefixRejected returns InvalidParameterException and stores nothing (#1052)."
      - scenario: The 50-tag limit checked against the existing plus incoming set, not just the incoming call.
        status: fixed
        evidence: TestACMTagResource_tagLimitEnforcedOnMergedSet seeds 50 tags then rejects a 51st.
    findings:
      - Fixed — routed through the shared tag validator so reserved-prefix and merged-set-limit rules apply the same way as every other tagging service (#1275); AWS-shaped tag auditing landed in #814.
  UntagResource:
    status: fixed
    priority: p2
    aws_docs:
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_UntagResource.html
    implementation:
      - internal/services/acm/typed_logic.go:484 (untagResourceTyped)
    tests:
      present:
        - tests/integration/acm/acm_tagging_test.go::TestACMUntagResource_removesNamedKeysOnly
    scenario_matrix:
      - scenario: UntagResource takes TagKeys and removes only the named keys, unlike RemoveTagsFromCertificate's Tags list.
        status: fixed
        evidence: TestACMUntagResource_removesNamedKeysOnly removes one key and leaves an unrelated tag in place.
    findings:
      - Fixed alongside TagResource (#814, #1275).
  ListTagsForResource:
    status: fixed
    priority: p3
    aws_docs:
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_ListTagsForResource.html
    implementation:
      - internal/services/acm/typed_logic.go:498 (listTagsForResourceTyped)
    tests:
      present:
        - tests/integration/acm/acm_tagging_test.go::TestACMDeleteCertificate_dropsItsTags
    scenario_matrix:
      - scenario: Certificate deletion drops its tags with it.
        status: fixed
        evidence: TestACMDeleteCertificate_dropsItsTags — ListTagsForResource after DeleteCertificate returns ResourceNotFoundException, not an empty tag list.
    findings:
      - Fixed alongside TagResource (#814, #1275).
  RequestCertificate:
    status: fixed
    priority: p2
    aws_docs:
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_RequestCertificate.html
    implementation:
      - internal/services/acm/typed_logic.go:150 (requestCertificateTyped)
      - internal/services/acm/validation.go (DomainNameString length/pattern and the ValidationMethod enum)
    tests:
      present:
        - tests/integration/acm/acm_tagging_test.go::TestACMRequestCertificate_appliesTagsAtCreation
        - tests/integration/acm/acm_tagging_test.go::TestACMRequestCertificate_reservedPrefixRejected
        - tests/integration/acm/acm_domain_validation_test.go::TestRequestCertificate_malformedDomainName
        - tests/integration/acm/acm_domain_validation_test.go::TestRequestCertificate_wellFormedDomainNamesAccepted
        - tests/integration/acm/acm_domain_validation_test.go::TestRequestCertificate_domainNameTooLong
        - tests/integration/acm/acm_domain_validation_test.go::TestRequestCertificate_malformedSubjectAlternativeName
        - tests/integration/acm/acm_domain_validation_test.go::TestRequestCertificate_rejectedDomainStrandsNothing
        - tests/integration/acm/acm_domain_validation_test.go::TestRequestCertificate_unknownValidationMethod
        - internal/services/acm/validation_test.go::TestDomainNamePattern_matchesTheModelledLanguage
        - internal/services/acm/validation_test.go::TestValidateDomainName_namesTheMemberAndTheConstraint
        - internal/services/acm/validation_test.go::TestValidateDomainName_lengthBeforePattern
    scenario_matrix:
      - scenario: Inline Tags supplied on RequestCertificate are applied at creation.
        status: fixed
        evidence: TestACMRequestCertificate_appliesTagsAtCreation.
      - scenario: "Inline Tags with a reserved aws: prefix reject the whole create — no certificate is stranded."
        status: fixed
        evidence: TestACMRequestCertificate_reservedPrefixRejected asserts the 400 and that ListCertificates shows no certificate for the rejected domain.
      - scenario: A DomainName outside DomainNameString's pattern (underscore, leading/trailing hyphen, empty or over-long label, misplaced wildcard, trailing dot).
        status: fixed
        evidence: "TestRequestCertificate_malformedDomainName covers 12 shapes; each answers 400 ValidationException with AWS's constraint wording, echoing the model pattern verbatim."
      - scenario: A DomainName of 254 characters that is otherwise well formed.
        status: fixed
        evidence: TestRequestCertificate_domainNameTooLong reports the length trait (253) rather than the pattern.
      - scenario: A malformed SubjectAlternativeNames entry.
        status: fixed
        evidence: "TestRequestCertificate_malformedSubjectAlternativeName — the message names 'subjectAlternativeNames.2.member', the entry that failed."
      - scenario: A rejected DomainName leaves no certificate behind.
        status: fixed
        evidence: TestRequestCertificate_rejectedDomainStrandsNothing — validation runs before the store write, the same ordering the inline-tag check keeps.
      - scenario: A ValidationMethod outside the EMAIL/DNS/HTTP enum.
        status: fixed
        evidence: TestRequestCertificate_unknownValidationMethod.
      - scenario: A wildcard certificate, a 63-character label and a deep subdomain stay legal.
        status: fixed
        evidence: "TestRequestCertificate_wellFormedDomainNamesAccepted, plus the unit table TestDomainNamePattern_matchesTheModelledLanguage, which pins the RE2 rewrite of a pattern Go cannot compile as written (it uses negative lookaheads)."
    findings:
      - Fixed — inline-tag validation and creation-rollback-on-rejection now match the shared tag validator (#814, #1275).
      - >-
        Fixed (#1994) — DomainName and every SAN are validated against
        DomainNameString's length and pattern traits, and ValidationMethod
        against its enum. The error is ValidationException, the front-end
        constraint validator's answer, in AWS's "1 validation error detected:
        Value '<v>' at '<member>' failed to satisfy constraint: ..." wording.
        ACM's model does not list ValidationException among RequestCertificate's
        errors (it lists it on nearly every other operation), but that list
        covers what the service raises after dispatch, not what the framework
        raises before it — ThrottlingException is missing from the same list.
        The modeled InvalidParameterException stays where the service itself
        raises it, on tag violations.
      - >-
        Fixed (#2030) — an absent or empty DomainName now answers
        ValidationException ("1 validation error detected: Value null at
        'domainName' failed to satisfy constraint: Member must not be null"),
        AWS's front-end "required member absent" wording, rather than the
        service's own InvalidParameterException it answered before. Covered by
        tests/integration/acm/acm_test.go::TestRequestCertificate_emptyDomainNameAnswersValidationException.
  DescribeCertificate:
    status: fixed
    priority: p2
    aws_docs:
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_DescribeCertificate.html
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_DomainValidation.html
    implementation:
      - internal/services/acm/typed_logic.go:224 (describeCertificateTyped), :349 (domainValidations)
      - internal/services/acm/service.go (Certificate.DomainValidationOptions, DomainValidation, ResourceRecord)
    tests:
      present:
        - tests/integration/acm/acm_domain_validation_test.go::TestDescribeCertificate_dnsValidationOptions
        - tests/integration/acm/acm_domain_validation_test.go::TestDescribeCertificate_emailValidationOptions
    scenario_matrix:
      - scenario: DNS validation reports one entry per DomainName/SAN with a CNAME to publish.
        status: fixed
        evidence: "TestDescribeCertificate_dnsValidationOptions — _<token>.<domain>. CNAME _<token>.acm-validations.aws., one per domain, distinct per domain and identical across repeated DescribeCertificate calls."
      - scenario: Email validation (and an unset ValidationMethod, which ACM defaults to EMAIL) reports ValidationDomain and no CNAME.
        status: fixed
        evidence: TestDescribeCertificate_emailValidationOptions.
      - scenario: ValidationStatus agrees with the certificate's own Status.
        status: fixed
        evidence: Every entry is SUCCESS because the certificate is ISSUED on return; a PENDING_VALIDATION entry on an ISSUED certificate is a state AWS never reports.
    findings:
      - >-
        Fixed (#1994) — CertificateDetail.DomainValidationOptions is populated
        at RequestCertificate time and stored with the certificate, which is
        both what AWS's own documentation describes ("as a result of the
        RequestCertificate request") and what makes the record stable across
        calls and restarts. The token is a hash of the ARN and the domain, not
        random and not time-based.
      - >-
        The DNS record is the one piece of challenge data Overcast does
        synthesize, because callers act on it: aws_acm_certificate_validation,
        the CDK's DNS-validated certificate and every publish-then-wait script
        read ResourceRecord. ValidationEmails stays absent — nothing reads a
        list of addresses no mail was sent to.
  ListCertificates:
    status: fixed
    priority: p3
    aws_docs:
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_ListCertificates.html
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_Filters.html
    implementation:
      - internal/services/acm/typed_logic.go:232 (listCertificatesTyped)
    tests:
      present:
        - tests/integration/acm/acm_domain_validation_test.go::TestListCertificates_filtersByCertificateStatuses
        - tests/integration/acm/acm_domain_validation_test.go::TestListCertificates_unknownStatusRejected
    scenario_matrix:
      - scenario: CertificateStatuses selects on Status — PENDING_VALIDATION excludes an issued certificate, ISSUED includes it, several statuses match any of them, and an absent filter returns everything.
        status: fixed
        evidence: TestListCertificates_filtersByCertificateStatuses.
      - scenario: A status outside the CertificateStatus enum.
        status: fixed
        evidence: "TestListCertificates_unknownStatusRejected — 400 ValidationException naming 'certificateStatuses.1.member', rather than silently widening the filter back to everything."
      - scenario: Includes (keyTypes, keyUsage, extendedKeyUsage, exportOption, managedBy) and CertificateKeyPairOrigins.
        status: intentionally_partial
        evidence: Overcast generates no key material and models no export configuration, so there is nothing for these to select on. Recorded on the capability row and in docs/services/acm.md.
      - scenario: MaxItems/NextToken pagination and SortBy/SortOrder.
        status: implementation_mismatch
        evidence: The whole list is returned in store order with no NextToken. Not part of #1994; no issue filed.
    findings:
      - >-
        Fixed (#1994) — the request struct was empty, so every filter was
        dropped on the floor and a PENDING_VALIDATION poll saw its own ISSUED
        certificate as still pending. CertificateStatuses is honoured and
        validated; the filters that select on material Overcast never generates
        are recorded as intentionally partial rather than silently ignored.
  AddTagsToCertificate:
    status: fixed
    priority: p3
    aws_docs:
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_AddTagsToCertificate.html
    implementation:
      - internal/services/acm/typed_logic.go:403 (addTagsToCertificateTyped)
    tests:
      present:
        - tests/integration/acm/acm_tagging_test.go::TestACMAddTagsToCertificate_reservedPrefixRejected
    scenario_matrix:
      - scenario: The legacy spelling enforces the same reserved-prefix rule as TagResource.
        status: fixed
        evidence: TestACMAddTagsToCertificate_reservedPrefixRejected.
    findings:
      - Fixed alongside TagResource (#814, #1275).
  ACMTagging_unknownCertificate:
    status: fixed
    priority: p2
    aws_docs:
      - https://docs.aws.amazon.com/acm/latest/APIReference/API_AddTagsToCertificate.html#API_AddTagsToCertificate_Errors
    implementation:
      - internal/services/acm/typed_logic.go (shared tag validation across all six tag-accepting operations)
    tests:
      present:
        - tests/integration/acm/acm_tagging_test.go::TestACMTagging_unknownCertificate
    scenario_matrix:
      - scenario: TagResource, UntagResource, ListTagsForResource, AddTagsToCertificate, RemoveTagsFromCertificate and ListTagsForCertificate against a well-formed but non-existent ARN.
        status: fixed
        evidence: "AWS documents ResourceNotFoundException as HTTP 400 (not 404) for all six operations; TestACMTagging_unknownCertificate asserts 400 + ResourceNotFoundException for every one (#1729)."
    findings:
      - Fixed — all six tag-accepting operations answer a missing certificate with the documented 400 ResourceNotFoundException rather than a bare 404 (#1729).
findings:
  fixed:
    - >-
      #52 — tag round-trip, the shared tag set between the legacy and modern
      spellings, selective UntagResource removal, inline Tags on
      RequestCertificate, the unknown-certificate ResourceNotFoundException
      contract, the reserved aws: prefix rejection (create and both tag
      spellings), the 50-tag limit enforced against the merged set, and tags
      being dropped on DeleteCertificate are all covered by
      tests/integration/acm/acm_tagging_test.go (9 tests, from #814, #1275 and
      #1739). See the TagResource, UntagResource, ListTagsForResource,
      RequestCertificate, AddTagsToCertificate and
      ACMTagging_unknownCertificate operation entries above for the specific
      test names and assertions.
    - >-
      #53 — the tracker's "Document JSON 1.0 and CBOR support if intentional"
      gap is resolved by documentation, not code: SupportedProtocols() in
      internal/services/acm/typed_ops.go:55 accepts JSON 1.0, JSON 1.1, and
      RPC v2 CBOR, and codec.Supports (internal/protocol/codec/codec.go:83-100)
      treats JSON 1.0 and 1.1 as equivalent for every JSON-tier service by
      design, documented at docs/dev/smithy.md:25. Real ACM serves JSON 1.1
      only; accepting 1.0 too is the framework-wide rule, not an ACM-specific
      gap. docs/services/acm.md now states this under "What works". No code
      change was needed.
    - >-
      #2030 — the empty-DomainName exception, the CloudFormation handler's
      dropped ValidationMethod, and the MCP tool's RequestCertificate bypass
      (the three gaps this section used to record under remaining_gaps) are
      all fixed. See the RequestCertificate operation entry above for the
      exception fix; the CloudFormation and MCP fixes are cross-cutting and
      recorded here instead of on an operation row:
      internal/services/cloudformation/provisioner_json_coverage.go's
      acmCertificateHandler.Create already forwarded ValidationMethod (and
      Tags) to RequestCertificate as of #2080, landed before this review —
      tests/integration/cloudformation/provisioner_json_coverage_test.go::TestCreateStack_ACMCertificate_validationMethodAndTagsForwarded
      covers it. internal/mcp/providers/runtime_provider.go's
      toolACMRequestCertificate now dispatches through the router into ACM's
      own RequestCertificate/DescribeCertificate — the same round trip
      CloudFormation uses for other services — instead of building a
      Certificate by hand, so it gets the same domain/SAN validation,
      DomainValidationOptions and injected clock the wire API uses; covered by
      internal/mcp/providers/runtime_provider_test.go's
      TestRuntimeProvider_ACMMutationTools,
      TestRuntimeProvider_ACMRequestCertificateRejectsMalformedDomain and
      TestRuntimeProvider_ACMRequestCertificateRequiresRouter.
  remaining_gaps:
    - "ListCertificates ignores MaxItems/NextToken and SortBy/SortOrder — the whole list comes back in store order. No issue filed."
    - "CertificateDetail's material-derived members (Serial, Subject, Issuer, NotBefore, NotAfter, KeyAlgorithm, SignatureAlgorithm, RenewalSummary) are absent; no key or chain is generated."
  intentionally_partial:
    - ListCertificateDomainValidations synthesizes one SUCCESS entry per DomainName/SAN, echoing the requested ValidationMethod but carrying no ValidationChallenge, since Overcast issues certificates without ever validating them (docs/services/acm.md "Differences from AWS").
    - DescribeCertificate's DNS ResourceRecord is derived from the certificate ARN rather than being a real challenge — stable and publishable, but nothing checks it and the domain is already SUCCESS.
    - DomainValidation.ValidationEmails and HttpRedirect are never populated. No mail is sent, so there are no addresses to report; HttpRedirect exists only for HTTP validation of CloudFront-issued certificates.
    - ListCertificates' Includes and CertificateKeyPairOrigins filters are ignored — they select on key material and export configuration Overcast never generates.
handoff:
  start_with: ["ListCertificates pagination (MaxItems/NextToken/SortBy/SortOrder) — no issue filed"]
  do_not_redo:
    - "Tag round-trip, spelling parity, selective untag, inline-create tags, unknown-certificate errors, reserved-prefix rejection, and merged-set tag limit (#52, #814, #1275, #1739) from 2026-09-20."
    - "JSON 1.0/1.1/RPCv2 CBOR protocol acceptance is the framework-wide rule, not an ACM gap (#53) from 2026-09-20."
    - "DomainName/SAN/ValidationMethod validation, DescribeCertificate's DomainValidationOptions, and the ListCertificates status filter (#1994) from 2026-09-20."
    - "The empty-DomainName exception, the CloudFormation ValidationMethod forward, and the MCP tool's RequestCertificate bypass (#2030) from 2026-09-25."
  commands: [go test -count=1 ./internal/services/acm/... ./tests/integration/acm/... ./internal/mcp/providers/... ./tests/integration/cloudformation/...]
