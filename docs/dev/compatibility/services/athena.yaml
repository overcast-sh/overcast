findings:
  fixed:
    - "#66: reviewed. tests/integration/athena/athena_test.go now pins the not-found error code and
      message for GetQueryExecution, GetQueryResults, GetWorkGroup and DeleteWorkGroup, the empty
      ResultSet shape (ResultSetMetadata.ColumnInfo and Rows present, UpdateCount absent per the
      model), and StopQueryExecution (which answered 501 at the time). The two divergences the
      review found were tracked as #2009 and are fixed below."
    - "#2009: fixed. Every Athena not-found now answers HTTP 400, the awsJson1_1 default for
      InvalidRequestException (no @httpError in the pinned model), through the shared
      errQueryNotFound/errWorkGroupNotFound constructors in internal/services/athena/typed_logic.go.
      StopQueryExecution is registered on both the legacy and typed paths and declared Supported:
      an unknown id is InvalidRequestException/400, a known one an empty StopQueryExecutionOutput,
      and state is unchanged because every Overcast query is already SUCCEEDED (the model marks the
      operation @idempotent and declares no wrong-state error). Tests:
      TestGetQueryExecution_unknownId, TestGetQueryResults_unknownId, TestGetWorkGroup_unknownName,
      TestDeleteWorkGroup_unknownName, TestAthenaCreateWorkGroup_invalidTagRejected,
      TestStopQueryExecution_alreadyFinished, TestStopQueryExecution_unknownId."
  remaining_gaps: []
  intentionally_partial:
    - "#67: the inert query engine is already documented. docs/services/athena.md's subtitle
      ('no SQL is executed, so every query succeeds immediately with an empty result set'), its
      'Differences from AWS' table (Query execution: 'stored, never parsed or run'; Results:
      'Nothing is written'; Execution states: 'None of them is ever observed'; Statistics:
      'Absent'; Workgroup configuration: 'Echoed, not enforced'), and its Gotchas note ('Any
      assertion about the rows that come back needs real Athena') together describe the design
      boundary this issue asked to have recorded."
