service: cloudformation
status: implementation_mismatch
priority: p0
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-23
protocols: [query]
implementation: [internal/services/cloudformation]
integration_tests: [tests/integration/cloudformation]
capability_docs: docs/services/cloudformation.md
operation_count_estimate: 47 API/intrinsic/resource rows; 19 supported, 28 unsupported; separate resource type matrix
current_support_level: CDK stack lifecycle and provisioner support; many StackSet/type registry features unsupported.
operations:
  CreateStack:
    status: implementation_mismatch
    aws_docs:
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-sqs-queue.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-s3-bucket.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-lambda-function.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-lambda-permission.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-table.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-logs-loggroup.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-secretsmanager.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_RollbackStack.html
      - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-event-messages.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-eks-cluster.html#aws-resource-eks-cluster-return-values
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-eks-nodegroup.html#aws-resource-eks-nodegroup-return-values
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-eks-fargateprofile.html#aws-resource-eks-fargateprofile-return-values
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-eks-addon.html#aws-resource-eks-addon-return-values
    tests:
      - tests/integration/cloudformation/cloudformation_test.go
    scenarios:
      - name: sqs queue ref output resolves to queue url
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go
        notes: AWS::SQS::Queue Ref returns the queue URL, while Fn::GetAtt Arn returns the queue ARN. The SQS resource handler now preserves that Ref override on create and update.
      - name: eks cluster ref resolves to cluster name
        status: fixed
        tests:
          - tests/integration/cloudformation/eks_cluster_ref_test.go::TestCreateStack_eksNodegroupWiredByClusterRef_reachesCreateComplete
          - tests/integration/cloudformation/eks_cluster_ref_test.go::TestDeleteStack_eksCluster_deletesByName
          - internal/services/cloudformation/provisioner_eks_test.go::TestEKSClusterNameFromPhysicalID
          - internal/services/cloudformation/provisioner_eks_test.go::TestEKSClusterDelete_toleratesARNShapedPhysicalID
        notes: >-
          AWS::EKS::Cluster Ref now returns the cluster name (physical ID),
          matching https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-eks-cluster.html#aws-resource-eks-cluster-return-values-ref;
          Fn::GetAtt Arn still returns the ARN. Before this fix the physical ID was
          the ARN, so any AWS::EKS::Nodegroup/FargateProfile/Addon wired to its
          cluster by {"Ref": "Cluster"} (the pattern CDK's L2 constructs use)
          failed locally with "No cluster found for name: arn:...:cluster%2F<name>"
          (#1690) while it deploys on real AWS. Stabilize/Delete/Update now resolve
          the cluster name via eksClusterNameFromPhysicalID, which also tolerates a
          physical ID persisted as the ARN by a pre-fix Overcast build. Checked
          AWS::EKS::Nodegroup ("<cluster>/<nodegroup>") and AWS::EKS::FargateProfile
          ("<cluster>/<Fargate_profile_name>") against their own CloudFormation
          docs — both already match. AWS::EKS::Addon's documented Ref is
          "cluster-name|vpc-cni" (pipe-separated); Overcast's eksAddonHandler uses
          "/" instead — filed as a separate follow-up rather than fixed here,
          since eksAddonHandler was concurrently owned by another change (#1692).
      - name: sqs fifo generated queue name and attributes
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go
        notes: AWS::SQS::Queue with FifoQueue true and no QueueName now generates a .fifo queue name and forwards FIFO attributes to SQS.
      - name: resource ref overrides for non-name physical ids
        status: implementation_mismatch
        tests: []
        notes: Audit found likely gaps for IAM Policy, IAM InstanceProfile, IAM ServiceLinkedRole, Events EventBus, and Events Rule. Each needs AWS-doc-backed Ref tests before changing behavior.
      - name: scheduled fargate event rule targets
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go::TestCreateStack_ScheduledFargateRuleTargets
        notes: AWS::Events::Rule create now provisions Targets through PutTargets, preserving ECS/Fargate target parameters used by CDK scheduled task stacks. EventBridge can execute scheduled ECS/Fargate targets through ECS RunTask.
      - name: sns topic and subscription property forwarding
        status: fixed
        tests:
          - tests/integration/cloudformation/sns_test.go::TestCreateStack_SNSSubscriptionAttributesFilterAndRawDelivery
          - tests/integration/cloudformation/sns_test.go::TestCreateStack_SNSTopicInlineSubscription
          - tests/integration/cloudformation/sns_test.go::TestUpdateStack_SNSTopicAttributes
          - tests/integration/cloudformation/sns_test.go::TestUpdateStack_SNSTopicInlineSubscriptionsFailLoudly
        notes: AWS::SNS::Topic applies supported attributes during create and update; standalone subscriptions apply supported attributes after Subscribe; inline topic subscriptions dispatch through SNS. Unsupported topic Tags dispatch to SNS TagResource and fail rather than being discarded.
      - name: s3 bucket sub-resource property dispatch
        status: fixed
        tests:
          - tests/integration/cloudformation/s3_bucket_properties_test.go
        notes: AWS::S3::Bucket translates lifecycle, versioning, notification, encryption, tag, CORS, and website properties to S3 REST-XML handlers on create and update. Removal deletes or clears the S3 configuration, and versioning removal suspends because S3 cannot return a versioned bucket to unversioned state. Unknown and untranslatable fields fail before bucket creation.
      - name: lambda function advanced properties and permission lifecycle
        status: fixed
        tests:
          - tests/integration/cloudformation/lambda_properties_test.go
        notes: AWS::Lambda::Function forwards every reviewed Function property and applies configuration, code, then reserved concurrency transactionally; unsupported advanced fields fail at Lambda before mutation, and a failed sub-operation triggers immediate compensation. EventSourceMapping forwards every reviewed property so Lambda either stores supported fields or rejects unsupported semantics. AWS::Lambda::Permission calls race-safe Lambda policy APIs rather than succeeding as a no-op stub. Shared reverse-update rollback restores successful in-place changes when a later stack resource fails.
      - name: dynamodb table local secondary index create and update semantics
        status: fixed
        tests:
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestCreateStack_DynamoDBTableLocalSecondaryIndex
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestUpdateStack_DynamoDBTableLocalSecondaryIndexes
          - internal/services/cloudformation/dynamodb_table_update_test.go
        notes: AWS::DynamoDB::Table forwards LocalSecondaryIndexes to CreateTable, so an LSI declared in a new stack is immediately available to Query. Removing or changing an LSI fails the stack update without dispatching UpdateTable because AWS documents LSI updates as unsupported.
      - name: dynamodb table time-to-live create and updates
        status: fixed
        tests:
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestCreateStack_DynamoDBTableTimeToLive
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestUpdateStack_DynamoDBTableTimeToLive
          - internal/services/cloudformation/dynamodb_ttl_test.go
        notes: AWS::DynamoDB::Table validates the distinct CloudFormation TimeToLiveSpecification shape before mutation, applies enabled TTL through DynamoDB UpdateTimeToLive after creation, disables then re-enables TTL when its attribute changes, and disables TTL when the property is removed. Enabled is required; AttributeName is validated at 1..255 when present or required, while Enabled=false without AttributeName is a no-op for an already-disabled/new table. Failed create or update phases compensate the table or prior TTL configuration.
      - name: dynamodb table tags, global secondary index updates, and global table local-replica provisioning
        status: fixed
        tests:
          - tests/integration/cloudformation/dynamodb_table_tags_test.go
          - tests/integration/cloudformation/dynamodb_gsi_update_test.go
          - tests/integration/cloudformation/dynamodb_global_table_test.go
        notes: |
          Closes issue #523's remaining scope (LocalSecondaryIndexes forwarding and TimeToLiveSpecification were already fixed above).
          AWS::DynamoDB::Table applies effective resource-plus-stack Tags through TagResource after create, and reconciles additions/changes/removals through Tag/UntagResource on update, matching the Lambda/Logs/Secrets Manager tag-forwarding shape elsewhere in this adapter — DynamoDB grew TagResource/ListTagsOfResource/UntagResource in #685, after the original CreateTable allow-list was written, and nothing forwarded Tags afterwards.
          GlobalSecondaryIndexes changes on update now dispatch GlobalSecondaryIndexUpdates (previously forwarded on create only and silently ignored on update): one index operation per UpdateTable call, matching AWS's one-GSI-change-at-a-time rule. Adding or removing an index, or changing only its ProvisionedThroughput, is supported; changing an existing index's KeySchema or Projection in place fails the update loudly (AWS requires that as a separate remove-then-re-add) rather than attempting an implicit delete+recreate.
          AWS::DynamoDB::GlobalTable is no longer a no-op stub. Overcast emulates a single region, so it provisions the Replicas entry naming the stack's own deploy region as a real table (translating into AWS::DynamoDB::Table's Create/Update/Delete outright, so GSI/TTL/Tags fidelity is shared code, not a second copy) and forces streaming (NEW_AND_OLD_IMAGES), matching real global tables. BillingMode PAY_PER_REQUEST is supported and is the default when omitted (global tables provisioned through the modern replication model default to on-demand, unlike AWS::DynamoDB::Table's PROVISIONED default); BillingMode PROVISIONED is rejected loudly rather than guessing fixed capacity from the auto-scaling-only WriteProvisionedThroughputSettings/ReadProvisionedThroughputSettings shape, which nothing in Overcast's DynamoDB emulation runs. A stack whose Replicas never name its own deploy region fails loudly at create, and a region dropped from Replicas on update requires replacement, rather than a silent no-op either way.
      - name: log group retention and tags on create and update
        status: fixed
        tests:
          - tests/integration/cloudformation/log_group_properties_test.go::TestCreateStack_LogGroupRetentionInDays
          - tests/integration/cloudformation/log_group_properties_test.go::TestUpdateStack_LogGroupTags
          - tests/integration/cloudformation/log_group_properties_test.go::TestUpdateStack_LogGroupStackTags
          - internal/services/cloudformation/provisioner_logs_test.go::TestLogsLogGroupHandlerUpdate_omittedOrEmptyTagsRemovePreviousTags
        notes: AWS::Logs::LogGroup applies RetentionInDays with PutRetentionPolicy immediately after CreateLogGroup and effective resource-plus-stack tags through TagLogGroup, with resource tags taking precedence. Updates hash and reconcile effective tags so stack-only additions, changes, and removals dispatch; partial tag updates are compensated before reporting a service failure. A failed post-create cleanup preserves the physical ID for stack rollback. Removing RetentionInDays dispatches DeleteRetentionPolicy and reports service failures instead of silently completing the update.
      - name: secrets manager generated values and metadata properties
        status: fixed
        tests:
          - tests/integration/cloudformation/generate_secret_string_test.go
          - internal/services/cloudformation/provisioner_secretsmanager_test.go
        notes: AWS::SecretsManager::Secret validates GenerateSecretString composition before service dispatch, generates through GetRandomPassword, and creates through CreateSecret. KmsKeyId, resource tags, and propagated stack tags round-trip through Secrets Manager APIs; metadata-only updates preserve the generated value.
      - name: secrets manager dynamic reference freshness boundary
        status: fixed
        tests:
          - tests/integration/cloudformation/dynamic_reference_test.go::TestUpdateStack_rotatingASecretDoesNotReplaceTheResource
          - tests/integration/cloudformation/dynamic_reference_test.go::TestUpdateStack_unchangedResourceDoesNotRetrieveDynamicReference
          - tests/integration/cloudformation/dynamic_reference_test.go::TestUpdateStack_changedResourceRetrievesCurrentDynamicReference
        notes: CloudFormation hashes and stores the literal dynamic reference. An unchanged containing resource neither refreshes nor retrieves the secret, even when the current secret was deleted; a changed or newly created resource resolves AWSCURRENT through GetSecretValue at dispatch time.
      - name: ecs service stabilization reports actionable scheduler failure
        status: fixed
        tests:
          - internal/services/cloudformation/provisioner_ecs_test.go::TestECSServiceRolloutFailure_primaryDeploymentOnly
        notes: AWS::ECS::Service stabilization selects the newest actionable scheduler failure event instead of allowing a newer task-start progress event to replace the failure reason reported through CloudFormation.
      - name: create rollback honors deletion policy retain
        status: fixed
        tests:
          - internal/services/cloudformation/provisioner_stabilize_test.go::TestCreateStack_rollbackRetainsAResourceWithDeletionPolicyRetain
          - internal/services/cloudformation/provisioner_stabilize_test.go::TestStackResource_retentionPolicyDependsOnOperation
          - internal/services/cloudformation/rollback_stack_test.go::TestRollbackStack_retainExceptOnCreateControlsRetainedCreateResources
          - tests/integration/cloudformation/cloudformation_test.go::TestCreateStack_rollbackRetainsResourceWithDeletionPolicyRetain
        notes: A resource with DeletionPolicy Retain remains service-side when automatic stack creation rollback runs, including a resource that received a physical ID before stabilization failed. Its stack history records DELETE_SKIPPED. Template RetainExceptOnCreate deletes during initial create rollback but retains during ordinary deletion, while the RollbackStack operation flag can opt newly created Retain resources into deletion.
      - name: failed resource status reason shape
        status: fixed
        tests:
          - internal/services/cloudformation/status_reason_test.go
          - tests/integration/cloudformation/resource_status_reason_test.go
          - tests/integration/cloudformation/lambda_properties_test.go::TestUpdateStack_LambdaEmptyCodeDelegatesPackageSpecificValidation
        notes: >-
          A resource whose provisioning failed because an internal service call
          answered >= 400 now reports CloudFormation's own reason shape —
          `Resource handler returned message: "<message> (Service: …, Status
          Code: …, Error Code: …, Request ID: …)" (RequestToken: …,
          HandlerErrorCode: …)` — instead of the raw XML or JSON error body a
          `cdk deploy` used to print. The code and message are read out of all
          four error envelopes the emulator writes (S3's bare Error, the Query
          protocol's ErrorResponse, EC2's Response/Errors, and the JSON
          protocols' __type/message); a body that parses as neither still falls
          back to the previous "HTTP <status>: <body>" rendering, so nothing is
          lost. Three details stay unverified against real AWS and say so in
          internal/services/cloudformation/status_reason.go: the Extended
          Request ID field is omitted because Overcast mints no x-amz-id-2;
          RequestToken carries the stack operation's ClientRequestToken rather
          than real CloudFormation's per-resource provider invocation token;
          and the HandlerErrorCode mapping is derived from what the enum's
          members mean rather than from observed CloudFormation output.
  DescribeChangeSet:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_DescribeChangeSet.html
    scenarios:
      - name: arn-only change set lookup
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go::TestDescribeChangeSet_changeSetArn
        notes: ChangeSetName may be a full change set ARN; StackName is required only for short change set names.
  ExecuteChangeSet:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ExecuteChangeSet.html
    scenarios:
      - name: arn-only change set lookup
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go::TestExecuteChangeSet_changeSetArn
        notes: ChangeSetName may be a full change set ARN; StackName is required only for short change set names.
  ListChangeSets:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ListChangeSets.html
    scenarios:
      - name: created change sets appear in stack summary list
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go::TestListChangeSets_createdChangeSet
        notes: Created change sets are listed for their stack by name or stack ARN.
findings:
  fixed:
    - AWS::SQS::Queue Ref now resolves to the queue URL instead of the ARN, so CDK queue.queueUrl outputs are externally usable by SQS clients.
    - AWS::SQS::Queue FifoQueue now creates a FIFO-compatible generated physical name and FifoQueue=true queue attributes.
    - DescribeChangeSet and ExecuteChangeSet now accept full change set ARN lookup without StackName, and ListChangeSets returns created change sets for the stack.
    - AWS::Events::Rule create provisions targets, including ECS/Fargate target metadata used by CDK scheduled task stacks.
    - AWS::SNS::Topic and AWS::SNS::Subscription forward supported configuration through SNS during stack provisioning, including raw delivery and message-body filtering.
    - AWS::S3::Bucket create/update/removal dispatches seven sub-resource property families through S3 instead of silently dropping them.
    - AWS::Lambda::Function no longer drops priority configuration properties, and AWS::Lambda::Permission now mutates the function's Lambda-owned resource policy.
    - AWS::DynamoDB::Table forwards LocalSecondaryIndexes through CreateTable and reconciles TimeToLiveSpecification through DynamoDB's TTL API, including create/update compensation.
    - AWS::DynamoDB::Table applies Tags on create and reconciles them on update, and reconciles GlobalSecondaryIndexes add/remove/throughput-change through GlobalSecondaryIndexUpdates on update instead of only at create. AWS::DynamoDB::GlobalTable provisions the local-region Replica as a real table instead of a no-op stub, failing loudly when no Replica names the stack's own region (#523).
    - AWS::Logs::LogGroup applies RetentionInDays, resource Tags, and propagated stack tags when created, then reconciles effective tag additions, changes, and removals during stack updates.
    - AWS::SecretsManager::Secret no longer drops KmsKeyId or Tags, and malformed GenerateSecretString templates fail before password generation or secret creation.
    - No-op updates no longer retrieve Secrets Manager dynamic references before literal-property change detection, preserving AWS's intentionally stale resource value and avoiding unnecessary internal API calls.
    - AWS::ECS::Service stabilization preserves the actionable scheduler failure when a newer task-start progress event exists.
    - Automatic create rollback honors DeletionPolicy Retain and records DELETE_SKIPPED for the retained resource; RetainExceptOnCreate distinguishes initial create rollback from ordinary deletion.
    - AWS::EKS::Cluster Ref now resolves to the cluster name instead of the ARN, so a nodegroup, Fargate profile, or add-on wired to its cluster by Ref reaches CREATE_COMPLETE instead of failing with a "No cluster found for name" error; Fn::GetAtt Arn is unchanged (#1690).
    - >-
      A failed resource's ResourceStatusReason is CloudFormation's "Resource
      handler returned message: … (RequestToken: …, HandlerErrorCode: …)"
      sentence rather than the service's raw XML/JSON error body.
    - "#73: resourceHandlers (internal/services/cloudformation/provisioner.go) has 141
      entries — 132 real handlers, 8 stub registrations, and the AWS::SES::ConfigurationSet
      fail-handler — matching docs/cdk/resource-types.md exactly (regenerated 2026-09-23 by
      #2080). #540 and #2060, the property-drop sweeps the stale \"audit resource-type
      tracking\" gap was standing in for, both closed the same day. Resource-type tracking
      is current; there is nothing further to audit here."
  remaining_gaps:
    - Add CloudFormation Ref compatibility tests for resource handlers whose physical ID differs from documented Ref semantics.
    - AWS::EKS::Addon's physical ID uses "/" between cluster name and add-on name; AWS documents "|" ("cluster-name|vpc-cni"). Not fixed here — eksAddonHandler was concurrently owned by another change (#1692).
    - Implement cross-region AWS::SNS::Subscription Region semantics (tracked in #633).
    - Add support for S3 EventBridge notifications (#635), lifecycle transition minimum object size (#636), and website redirects/routing rules (#637); CloudFormation currently fails these shapes loudly.
    - AWS::Logs::LogGroup KmsKeyId, DataProtectionPolicy, LogGroupClass, and newer LogGroup properties need underlying CloudWatch Logs API/state support before CloudFormation can forward them.
    - AWS::DynamoDB::Table SSESpecification, PointInTimeRecoverySpecification, DeletionProtectionEnabled, TableClass, KinesisStreamSpecification, ContributorInsightsSpecification, ImportSourceSpecification, ResourcePolicy, and OnDemandThroughput are not forwarded; the underlying DynamoDB emulation has no support for any of them (see docs/services/dynamodb.md), so CloudFormation cannot honestly apply them either. AWS::DynamoDB::GlobalTable inherits the same gap for its shared top-level properties, plus SSE/PITR/ContributorInsights being per-Replica rather than top-level, and offers no cross-region replication (single-region emulator).
    - AWS::KMS::Key Tags and EnableKeyRotation are not applied; see docs/dev/compatibility/services/kms.yaml.
    - Complete Secrets Manager generated-value updates (#678), replica regions (#679), target attachments (#680), and rotation schedules (#681).
  intentionally_partial:
    - "#74: unsupported-resource stubbing is documented, not an open gap — every stub and the
      one deliberate always-fails handler (AWS::SES::ConfigurationSet) are listed in
      docs/cdk/resource-types.md's Stubs and Fails sections, with what a stub returns and
      why. What #74's \"review update/delete semantics\" half actually names is broader:
      restoring in-place resource-side state on update rollback across every
      resourceUpdater, not just AWS::Lambda::Function's resourceUpdateRollbacker hook
      (added by #520). That is #639 (open, effort/large) — full audit and implementation
      across every updater is out of scope for this reconciliation pass; recorded here
      rather than claimed done. The resource ref-override gap two rows above
      (\"resource ref overrides for non-name physical ids\", IAM Policy/InstanceProfile/
      ServiceLinkedRole, Events EventBus/Rule) is separate from both and remains open."
handoff:
  start_with: [CloudFormation Ref semantics for IAM and EventBridge resource handlers, CreateStack, DeleteStack, resource handlers]
  do_not_redo:
    - Change set ARN-only lookup for DescribeChangeSet and ExecuteChangeSet; covered by TestDescribeChangeSet_changeSetArn and TestExecuteChangeSet_changeSetArn.
    - ListChangeSets returning created stack change sets; covered by TestListChangeSets_createdChangeSet.
    - AWS::Events::Rule target creation for scheduled Fargate tasks; covered by TestCreateStack_ScheduledFargateRuleTargets.
    - AWS::S3::Bucket lifecycle, versioning, notification, encryption, tags, CORS, and website dispatch; covered by s3_bucket_properties_test.go.
  commands: [go test -count=1 ./internal/services/cloudformation/... ./tests/integration/cloudformation/...]
