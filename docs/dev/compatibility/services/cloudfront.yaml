findings:
  fixed:
    - scenario: CreateDistribution accepts cache behavior TargetOriginId references to OriginGroups.Items[].Id for origin failover.
      evidence:
        aws_docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html
        tests: tests/integration/cloudfront/cloudfront_test.go::TestCreateDistribution_originGroupTarget
      fixed_in: 0.0.1-alpha.7
    - scenario: AWS::CloudFront::Distribution preserves OriginGroups and CacheBehaviors when provisioning through CloudFormation.
      evidence:
        aws_docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html
        tests: tests/integration/cloudformation/cloudformation_test.go::TestCreateStack_CloudFrontDistributionOriginGroupTarget
      fixed_in: 0.0.1-alpha.8
    - scenario: >-
        ProxyRequest was counted as one of CloudFront's AWS operations, so the service claimed 89 of them
        where AWS models 88, and the generated operations table linked a fabricated AWS reference page,
        API_ProxyRequest.html. capabilities.Capability now carries an EmulatorOnly flag; the row sets it,
        the capgen exemption that used to tolerate the unmodeled name is deleted, and --check-model rejects
        the flag on any operation AWS does model so it can never hide a real one.
      evidence:
        tests: >-
          cmd/capgen/main_test.go::TestCheckEmulatorOnlyRowsAreNotModeled_rejectsAnOperationAWSModels,
          cmd/capgen/main_test.go::TestCoverage_excludesEmulatorOnlyRowsFromTheAWSCount,
          cmd/capgen/main_test.go::TestBuildDocSection_emulatorOnlyRowIsSeparatedAndUnlinked,
          internal/capabilities/registry_test.go::TestAllCapabilitiesEmulatorOnlySurvivesGeneration
      fixed_in: "#2007"
    - >-
      #76 (XML half): reviewed. tests/integration/cloudfront/cloudfront_test.go pins GetDistribution's
      root element, the documented top-level members and their order relative to DistributionConfig,
      and the not-found error's Code/Message/RequestId. The three divergences the review found are
      tracked as #2010.
      tests:
        - tests/integration/cloudfront/cloudfront_test.go::TestGetDistribution_xmlShape
        - tests/integration/cloudfront/cloudfront_test.go::TestGetDistribution_notFound_errorShape
    - scenario: >-
        #2010: every response root now declares xmlns="http://cloudfront.amazonaws.com/doc/2020-05-31/",
        the namespace the pinned model's service shape carries in smithy.api#xmlNamespace, and nested
        elements inherit it rather than repeating it. protocol.WriteXMLNS stamps it on the root at write
        time, so it cannot be missed on a response whose struct nobody remembered to annotate — and the
        same struct can be a root in one operation and a nested member in another, which a field on the
        type could not have told apart.
      evidence:
        aws_model: models/cloudfront/service/2020-05-31/cloudfront-2020-05-31.json (service shape Cloudfront2020_05_31)
        tests: >-
          tests/integration/cloudfront/cloudfront_test.go::TestResponseRoots_carryServiceNamespace,
          tests/integration/cloudfront/cloudfront_test.go::TestGetDistribution_xmlShape,
          internal/protocol/errors_test.go::TestWriteXMLNS_stampsTheRootOnly
      fixed_in: "#2010"
    - scenario: >-
        #2010: errors are wrapped in the restXml <ErrorResponse xmlns=…><Error><Type>Sender</Type>…
        </Error><RequestId>…</RequestId></ErrorResponse> envelope. The service shape's protocol trait is
        "aws.protocols#restXml": {} with no noErrorWrapping, so S3's bare <Error> — which every handler
        reached for because protocol.WriteXMLError was the only REST-XML error writer — was the wrong
        shape. Statuses are unchanged and still come from each error shape's smithy.api#httpError.
      evidence:
        aws_model: models/cloudfront/service/2020-05-31/cloudfront-2020-05-31.json (NoSuchDistribution httpError 404, InvalidIfMatchVersion httpError 400)
        tests: >-
          tests/integration/cloudfront/cloudfront_test.go::TestGetDistribution_notFound_errorShape,
          tests/integration/cloudfront/cloudfront_test.go::TestUpdateDistribution_missingIfMatch_errorShape,
          internal/protocol/errors_test.go::TestWriteRESTXMLError_wrapsWithServiceNamespace,
          internal/protocol/errors_test.go::TestWriteQueryXMLError_declaresNoNamespace
      fixed_in: "#2010"
    - scenario: >-
        #2010: Distribution, DistributionConfig and DistributionSummary emit their members in the order
        the model declares them. Distribution had DomainName before LastModifiedTime; DistributionConfig
        and DistributionSummary were checked at the same time and were further out (Comment and Enabled
        near the front rather than after CustomErrorResponses and PriceClass).
      evidence:
        aws_model: models/cloudfront/service/2020-05-31/cloudfront-2020-05-31.json (Distribution, DistributionConfig, DistributionSummary member order)
        tests: tests/integration/cloudfront/cloudfront_test.go::TestGetDistribution_xmlShape
      fixed_in: "#2010"
    - scenario: >-
        #2137: ProxyRequest keeps the request path percent-encoded as the viewer sent it. It read
        chi's wildcard, which is encoded only when Go set RawPath (an encoding that differs from Go's
        default, e.g. %2F) and decoded otherwise, so GET /100%25 became "/100%", the concatenated origin
        URL failed to parse and the viewer got a 502. viewerPath now re-escapes the wildcard when RawPath
        is unset, which reproduces the viewer's encoding exactly. The origin (custom, or an emulated one
        reached by re-entering the router) receives the raw URI path as AWS documents; the cache key uses
        the encoded path; a viewer-request function's event.request.uri is the encoded form (AWS hands
        UTF-8 values to functions "without changing them"); a uri a function returns is brought to encoded
        form by escapeURIPath (raw UTF-8, spaces, a stray "%", "?" and "#" are percent-encoded). Cache
        behaviours match on normalizePathForMatch, the RFC 3986 section 6.2.2.2 step AWS applies before
        matching: escaped unreserved characters are decoded ("%7E" matches "~"), every other escape stays
        ("%40" is not "@", "%2F" is not a separator). DefaultRootObject is compared to the encoded "/" and
        escaped before use (a no-op for every character the API allows).
      evidence:
        aws_docs: >-
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesCacheBehavior.html#path-normalization,
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-function-restrictions-all.html#function-restrictions-encoding,
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/functions-event-structure.html
        tests: >-
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_hostRoutedInvokeKeepsPercentEncoding,
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_encodedPathReachesAnEmulatedOrigin,
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_pathPatternMatchesTheNormalisedEncodedPath,
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_viewerRequestFunctionSeesTheEncodedURI,
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_viewerRequestFunctionURIReachesTheOrigin,
          internal/services/cloudfront/handler_proxy_test.go::TestViewerPath_isAlwaysTheEncodedForm,
          internal/services/cloudfront/handler_proxy_test.go::TestNormalizePathForMatch_decodesOnlyUnreserved,
          internal/services/cloudfront/handler_proxy_test.go::TestEscapeURIPath_encodesOnlyWhatAPathCannotHold,
          internal/services/cloudfront/handler_proxy_test.go::TestPathHelpers_doNotAllocateOnPlainPaths
      fixed_in: "#2137"
    - scenario: >-
        #2137 follow-up: a viewer-request function that changes the uri no longer changes the cache
        policy TTL. ProxyRequest matches cache behaviours once, on the viewer's path, and now carries that
        behaviour's CachePolicyId into cacheTTL; cacheTTL used to re-match behaviours on the rewritten uri,
        so a rewrite could cache a response for another behaviour's DefaultTTL. AWS: a changed uri
        "doesn't change the cache behavior for the request or the origin".
      evidence:
        aws_docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/functions-event-structure.html#functions-event-structure-request
        tests: tests/integration/cloudfront/cloudfront_test.go::TestProxy_functionRewrittenURIKeepsTheBehaviorsCacheTTL
      fixed_in: "#2137"
    - scenario: >-
        #2137 follow-up: a uri returned by a viewer-request function must begin with "/". A relative,
        empty or non-string uri is a function validation error (the FunctionValidationErrors metric:
        the function "runs successfully but returns invalid data") and the viewer gets a 502, which
        http-502-bad-gateway documents for a CloudFront function validation error. The origin is not
        called. A relative uri used to be joined onto the origin host and fail by chance; an empty or
        non-string one was ignored and the request forwarded unchanged.
      evidence:
        aws_docs: >-
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/functions-event-structure.html#functions-event-structure-request,
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewing-cloudfront-metrics.html#monitoring-console.cloudfront-functions,
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html#http-502-cloudfront-function-validation-error
        tests: tests/integration/cloudfront/cloudfront_test.go::TestProxy_viewerRequestFunctionURIMustBeginWithSlash
      fixed_in: "#2137"
    - scenario: >-
        #2137 follow-up: the standard access log's cs-uri-stem is the viewer's URI path, with no query
        string. It used to be r.URL.Path, the internal /_overcast/cloudfront/distributions/{id}/... route.
        A function's rewrite is not logged: the field is "the portion of the request URL", i.e. the viewer's
        request. Every free-text field (cs-uri-stem, cs(Referer), cs(User-Agent), cs-uri-query) now gets
        the log file encoding AWS documents: ASCII 0-32, 127 and above, and < > " # % { } | \ ^ ~ [ ] ` '
        become %XX. "%" is in that list, so an encoded "%20" in the URI is logged as "%2520".
      evidence:
        aws_docs: >-
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logs-reference.html#BasicDistributionFileFormat,
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logging-legacy-s3.html#LogFileFormat
        tests: >-
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_accessLogRecordsTheViewersURI,
          internal/services/cloudfront/handler_proxy_test.go::TestLogFieldEscape_encodesTheDocumentedCharacters,
          internal/services/cloudfront/handler_proxy_test.go::TestPathHelpers_doNotAllocateOnPlainPaths
      fixed_in: "#2137"
    - scenario: >-
        #2142: a failed CloudFront Function ends the request the way AWS answers it. An execution error
        (the function throws, does not compile, or defines no handler: "fails to complete successfully")
        is a 503; a validation error (it returns something other than a request or response object) is a
        502. Both apply to viewer-request functions, where the origin is then not called, and to
        viewer-response functions, where the origin's response is not delivered. A function that threw
        used to answer 500, and one that failed to compile or returned a non-object was logged and skipped,
        so the request reached the origin as if no function were associated. Viewer-response functions also
        no longer run on an origin status of 400 or above, as AWS documents.
      evidence:
        aws_docs: >-
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewing-cloudfront-metrics.html#monitoring-console.cloudfront-functions,
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-503-service-unavailable.html#http-503-lambda-execution-error,
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html#http-502-cloudfront-function-validation-error,
          https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/functions-event-structure.html#functions-event-structure-status-body
        tests: >-
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_viewerRequestFunctionExecutionErrorIs503,
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_viewerRequestFunctionInvalidReturnIs502,
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_viewerResponseFunctionErrors,
          tests/integration/cloudfront/cloudfront_test.go::TestProxy_viewerResponseFunctionSkippedOnOriginError
      fixed_in: "#2142"
  remaining_gaps:
    - >-
      Member order below the top level still follows the order the structs happened to be written in
      rather than the model's. Distribution, DistributionConfig and DistributionSummary were reordered
      in #2010; Origin, DefaultCacheBehavior and CacheBehavior were checked against the pinned model at
      the same time and diverge — the model puts TrustedSigners/TrustedKeyGroups before
      ViewerProtocolPolicy and ForwardedValues/MinTTL/DefaultTTL/MaxTTL last on both behavior shapes,
      and CustomHeaders before S3OriginConfig on Origin. SDKs address members by name, so this is a
      wire-shape divergence rather than a functional one, and nothing pins it yet.
    - >-
      #2137: path normalisation before cache-behaviour matching implements only the percent-encoding
      step. AWS also resolves dot segments ("/a/b/.." matches "/a*", not "/a/b*") and collapses repeated
      slashes before matching; Overcast matches the path as sent. Recorded on
      docs/services/cloudfront/limitations.md ("Request paths").
    - >-
      #2142 (found in passing, not fixed): viewer-response functions do not run on a cache hit. The
      cached response is written before they would run, while AWS runs them on every response it
      returns to the viewer. Recorded on docs/services/cloudfront/limitations.md ("CloudFront Functions").
  intentionally_partial:
    - >-
      ETags are a quoted version counter ("1", "2", …) rather than a content hash or an opaque token
      (#76). They increment on every update and are required by If-Match on update and delete, so the
      concurrency contract an SDK depends on holds; what does not hold is any assumption that the same
      configuration yields the same ETag, or that an ETag captured from real AWS is meaningful here.
      Recorded on docs/services/cloudfront.md ("Differences from AWS") and
      docs/services/cloudfront/limitations.md ("Distributions").
handoff:
  start_with: [CreateDistribution, UpdateDistribution, invalidations]
  do_not_redo: [ProxyRequest counting (#75), ETag semantics (recorded as intentionally_partial), ProxyRequest path encoding (#2137)]
  commands: [go test -count=1 ./internal/services/cloudfront/... ./tests/integration/cloudfront/...]
