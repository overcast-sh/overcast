findings:
  fixed:
    - "#77: docs/services/cloudtrail.md already carries a Protocols row (line 41: \"AWS JSON
      1.0 and Smithy RPC v2 CBOR\"), matching the service's declared protocols. No doc change
      needed; the tracker was stale."
  remaining_gaps:
    - "#478/#479/#484 track promoting CloudTrail from Tier 1 (fully inert) to Tier 2 (real
      event-call logging and LookupEvents). That is a materially larger feature — recording
      every API call at the router/middleware layer, S3 delivery, a web UI event-history view —
      tracked separately in docs/plans/full-emulation-priority.md and remains open. It is
      outside this compatibility-tracker reconciliation's scope."
  intentionally_partial:
    - "#78: every one of the 12 operations is StatusInert by design, not StatusPartial or
      StatusSupported with caveats. docs/services/cloudtrail.md's Gotchas section states this
      explicitly (\"Every CloudTrail operation is Inert: the call is accepted and answered
      correctly, and nothing happens as a result\"), and internal/services/cloudtrail/capabilities_dev.go
      marks all 12 rows capabilities.StatusInert. Inert is the correct tier here: trail
      CRUD/logging-state/tag calls really do accept and store their input and answer the
      documented shape, but nothing downstream (event recording, S3 delivery, LookupEvents)
      ever runs — which is what distinguishes Inert (accepted, no side effects) from Partial
      (served with a caveat on an existing side effect)."
