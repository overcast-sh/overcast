service: cloudwatch-logs
status: not_started
priority: p0
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-08-08
protocols: [aws_json_1_1, aws_json_1_0, rpcv2_cbor]
implementation: [internal/services/cloudwatch/logs]
integration_tests: [tests/integration/cloudwatch/logs]
capability_docs: docs/services/cloudwatch-logs.md
operation_count_estimate: 23 supported, 3 unsupported
current_support_level: Log groups, streams, events, retention, tagging, filtering, and metric filters (published to CloudWatch through the service-metrics recorder) supported; Insights/subscriptions stubbed.
operations: {}
findings:
  fixed:
    - PutRetentionPolicy rejects retentionInDays outside AWS's documented value set with
      InvalidParameterException before mutating state, over AWS JSON and RPC v2 CBOR, and
      AWS::Logs::LogGroup inherits the check instead of duplicating it (#666).
    - CreateLogGroup accepts the modeled tags field and persists it atomically with the group;
      CreateLogGroup and TagLogGroup share serviceutil.ValidateTags for AWS's 50-tag limit,
      key/value lengths, empty keys and the reserved aws: prefix, checked before any mutation
      (#676).
    - PutMetricFilter, DescribeMetricFilters, DeleteMetricFilter and TestMetricFilter are
      implemented over AWS JSON and RPC v2 CBOR; every accepted log event runs through its
      group's filters and publishes CloudWatch datapoints the alarm evaluator reads (#1949).
  remaining_gaps:
    - Review PutLogEvents sequence token behavior.
    - Review FilterLogEvents syntax and pagination fidelity.
    - CreateLogGroup accepts kmsKeyId, logGroupClass and deletionProtectionEnabled but ignores
      them; DescribeLogGroups does not report logGroupClass or storedBytes.
    - Tag key/value character patterns from the model (TagKey/TagValue @pattern) are not
      enforced; only length, emptiness, count and the reserved aws: prefix are.
    - Tag key/value lengths are measured in bytes by the shared validator, not Unicode code
      points as the model's @length traits specify.
  intentionally_partial: []
handoff:
  start_with: [PutLogEvents, FilterLogEvents]
  do_not_redo: []
  commands: [go test -count=1 ./internal/services/cloudwatch/... ./tests/integration/cloudwatch/logs/...]
