        notes: EMAIL_OTP is offered when AllowedFirstAuthFactors permits it and the user has an email attribute; SELECT_CHALLENGE starts an EMAIL_OTP challenge and the code response returns tokens.
      - name: USER_AUTH PASSWORD_SRP choice flow
        status: fixed
        tests:
          - tests/integration/cognito/cognito_user_auth_test.go
        notes: PASSWORD_SRP is offered with password auth, SELECT_CHALLENGE with ANSWER=PASSWORD_SRP and SRP_A returns PASSWORD_VERIFIER challenge parameters, and PASSWORD_VERIFIER returns tokens. Cryptographic SRP proof validation is intentionally partial.
      - name: USER_AUTH WEB_AUTHN preferred challenge
        status: fixed
        tests:
          - tests/integration/cognito/cognito_user_auth_test.go
        notes: Registered passkey users can request PREFERRED_CHALLENGE=WEB_AUTHN and receive CREDENTIAL_REQUEST_OPTIONS before completing WEB_AUTHN with a credential. WebAuthn assertion signature validation is intentionally partial.
      - name: USER_AUTH app-client ExplicitAuthFlows enforcement
        status: fixed
        tests:
          - tests/integration/cognito/cognito_user_auth_test.go
        notes: Clients without ALLOW_USER_AUTH return UnsupportedOperationException for USER_AUTH.
      - name: user-pool first-factor policy excludes PASSWORD
        status: fixed
        tests:
          - tests/integration/cognito/cognito_user_auth_test.go
        notes: Password-only USER_AUTH returns InvalidUserPoolConfigurationException when SignInPolicy.AllowedFirstAuthFactors excludes PASSWORD.
      - name: USER_PASSWORD_AUTH and refresh token flows
        status: fixed
        tests:
          - tests/integration/cognito/cognito_jwt_mfa_groups_test.go
          - tests/integration/cognito/cognito_secrethash_test.go
        notes: Existing coverage exercises password auth, refresh token auth, SECRET_HASH, and MFA challenge routing.
      - name: USER_SRP_AUTH flow
        status: fixed
        tests:
          - tests/integration/cognito/cognito_user_auth_test.go
        notes: USER_SRP_AUTH requires USERNAME and SRP_A, returns PASSWORD_VERIFIER with SALT/SRP_B/SECRET_BLOCK/USER_ID_FOR_SRP, and RespondToAuthChallenge accepts PASSWORD_CLAIM_SIGNATURE/PASSWORD_CLAIM_SECRET_BLOCK/TIMESTAMP to return tokens. Cryptographic SRP proof validation is intentionally partial.
      - name: CUSTOM_AUTH direct custom challenge
        status: fixed
        tests:
          - tests/integration/cognito/cognito_user_auth_test.go
        notes: CUSTOM_AUTH requires ALLOW_CUSTOM_AUTH or legacy CUSTOM_AUTH_FLOW_ONLY, returns CUSTOM_CHALLENGE with a Session for direct custom challenge starts, and RespondToAuthChallenge completes CUSTOM_CHALLENGE with ANSWER to issue tokens. Lambda trigger execution and answer verification are intentionally partial.
      - name: CUSTOM_AUTH SRP prelude
        status: fixed
        tests:
          - tests/integration/cognito/cognito_user_auth_test.go
        notes: CUSTOM_AUTH with CHALLENGE_NAME=SRP_A and SRP_A returns PASSWORD_VERIFIER challenge parameters before the custom challenge. Cryptographic SRP proof validation and Lambda-defined challenge sequencing are intentionally partial.
      - name: remembered-device sign-in
        status: fixed
        tests:
          - tests/integration/cognito/cognito_user_auth_test.go
        notes: With DeviceConfiguration enabled, password sign-in without DEVICE_KEY returns NewDeviceMetadata; after ConfirmDevice stores a remembered device, password sign-in with DEVICE_KEY returns DEVICE_SRP_AUTH. Device SRP cryptographic proof validation is intentionally partial.
      - name: opt-in device sign-in before the user opts in
        status: fixed
        tests:
          - tests/integration/cognito/cognito_device_review_test.go
        notes: On a DeviceOnlyRememberedOnUserPrompt pool, a confirmed but not-yet-remembered DEVICE_KEY returns tokens directly; once UpdateDeviceStatus marks it remembered the same sign-in returns DEVICE_SRP_AUTH (TestConfirmDevice_optInPoolRequiresUserConfirmation).
    evidence:
      - AWS InitiateAuth docs state Session from ConfirmSignUp can be used with USER_AUTH for direct sign-in.
      - AWS InitiateAuth docs state USER_AUTH with USERNAME returns choice-based authentication challenges.
      - AWS InitiateAuth docs state PREFERRED_CHALLENGE can request a preferred USER_AUTH challenge.
      - AWS InitiateAuth docs state Cognito returns SELECT_CHALLENGE with available options when a preferred challenge isn't available.
      - AWS InitiateAuth docs state USER_SRP_AUTH requires USERNAME and SRP_A and returns PASSWORD_VERIFIER SRP challenge parameters.
      - AWS InitiateAuth docs state USER_AUTH can return WEB_AUTHN with CREDENTIAL_REQUEST_OPTIONS for passkey sign-in.
      - AWS InitiateAuth docs state CUSTOM_AUTH requires USERNAME and can start custom challenge flows, including CHALLENGE_NAME=SRP_A with SRP_A for SRP-before-custom authentication.
      - AWS device-tracking docs state sign-in without DEVICE_KEY returns NewDeviceMetadata and remembered DEVICE_KEY sign-in returns DEVICE_SRP_AUTH before token issuance.
      - AWS app-client docs state USER_AUTH requires ALLOW_USER_AUTH in ExplicitAuthFlows and defaults don't include it.
      - AWS SignInPolicy docs state AllowedFirstAuthFactors controls permitted first factors for a user pool.
      - AWS MFA docs state a required-MFA pool challenges SMS_MFA with CODE_DELIVERY_DELIVERY_MEDIUM, CODE_DELIVERY_DESTINATION and USER_ID_FOR_SRP, SELECT_MFA_TYPE with MFAS_CAN_CHOOSE when several factors are active, and MFA_SETUP with MFAS_CAN_SETUP when the user has none.
    gaps:
      - CUSTOM_AUTH Lambda Define/Create/Verify trigger execution, multiple custom-challenge loops, and answer verification are intentionally partial.
      - Email MFA is never issued as a second factor. A required-MFA pool whose only enabled factor is EmailMfaConfiguration signs the user straight in rather than challenging them, because MFAS_CAN_SETUP would otherwise be empty.
    next_action: "Device validation errors and opt-in confirmation are covered by tests (issues #103, #106); app-tier restrictions for ALLOW_USER_AUTH are recorded (issue #129). Device SRP (#102), plain SRP (#104), and WebAuthn (#105) cryptographic proof validation are duplicates of the consolidated findings.intentionally_partial entries for issues #124, #125, and #127; closed as such."
