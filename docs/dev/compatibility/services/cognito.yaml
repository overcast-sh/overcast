    - Exact ListUsers invalid-filter validation parity (issue #131).
    - SECRET_HASH expectations when username aliases are used (issue #132).
    - Every admin user operation that accepts Username, for validation, errors, and response shape (issue #134).
    - A dedicated LITE-tier SignInPolicy rejection test for UpdateUserPool (issue #116).
  do_not_redo:
