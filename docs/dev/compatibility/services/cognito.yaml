findings:
  fixed:
    - "SetUserPoolMfaConfig/GetUserPoolMfaConfig carry the full AWS shape — SmsMfaConfiguration, SoftwareTokenMfaConfiguration, EmailMfaConfiguration alongside WebAuthnConfiguration — with replace semantics and the documented combination rules (issues #119, #121; tests/integration/cognito/cognito_mfa_config_test.go)."
    - Username-attribute pools now resolve email/phone sign-in identifiers through the shared user lookup path for admin, auth, challenge, MFA, group, and self-service operations that call the shared helpers.
    - Shared user lookup now resolves local user sub values for Username parameters in plain username pools.
    - AdminDeleteUser now deletes the resolved internal UUID username instead of attempting to delete by email/phone identifier.
    - SignUp now stores a generated UUID username for username-attribute pools and auto-populates the corresponding email or phone attribute.
    - Secret clients now require SECRET_HASH in AdminInitiateAuth password auth and RespondToAuthChallenge/AdminRespondToAuthChallenge ChallengeResponses.
    - AdminCreateUser now persists AliasAttributes, resolves verified email/phone aliases for sign-in, rejects duplicate verified aliases, and migrates aliases when ForceAliasCreation is true.
    - ConfirmSignUp now rejects duplicate verified aliases unless ForceAliasCreation is true, migrates email/phone alias ownership when forced, and returns a Session field on success.
    - InitiateAuth and AdminInitiateAuth now accept USER_AUTH with a ConfirmSignUp Session and return tokens for immediate post-confirmation sign-in.
    - InitiateAuth/AdminInitiateAuth USER_AUTH now return SELECT_CHALLENGE with PASSWORD/EMAIL_OTP/SMS_OTP available when permitted, and RespondToAuthChallenge/AdminRespondToAuthChallenge complete PASSWORD and OTP choice authentication.
    - InitiateAuth/AdminInitiateAuth now support USER_SRP_AUTH and USER_AUTH PASSWORD_SRP with AWS-shaped PASSWORD_VERIFIER challenges and verifier responses that return tokens.
    - SetUserPoolMfaConfig/GetUserPoolMfaConfig now store and return WebAuthnConfiguration, StartWebAuthnRegistration/CompleteWebAuthnRegistration register passkey metadata, and USER_AUTH can complete WEB_AUTHN sign-in with AWS-shaped credential request options.
    - DeviceConfiguration now triggers NewDeviceMetadata on sign-in, ConfirmDevice stores remembered devices, GetDevice/ListDevices/UpdateDeviceStatus/ForgetDevice and admin device management operations work on confirmed devices, and remembered DEVICE_KEY sign-in completes DEVICE_SRP_AUTH/DEVICE_PASSWORD_VERIFIER challenge shapes.
    - InitiateAuth USER_AUTH with PREFERRED_CHALLENGE=PASSWORD now returns a direct PASSWORD challenge, and RespondToAuthChallenge completes it with PASSWORD.
    - AdminInitiateAuth USER_AUTH with PREFERRED_CHALLENGE=PASSWORD now returns a direct PASSWORD challenge, and AdminRespondToAuthChallenge completes it with PASSWORD.
    - InitiateAuth/AdminInitiateAuth USER_AUTH unavailable preferred challenges now fall back to SELECT_CHALLENGE with PASSWORD available.
    - CreateUserPool/UpdateUserPool now store, validate, and return SignInPolicy.AllowedFirstAuthFactors; password-based USER_AUTH respects PASSWORD first-factor availability.
    - CreateUserPoolClient/UpdateUserPoolClient now store and validate ExplicitAuthFlows, and InitiateAuth/AdminInitiateAuth enforce ALLOW_USER_AUTH for USER_AUTH.
    - AdminUpdateUserAttributes now rejects duplicate verified email/phone aliases when an update would immediately verify the alias.
    - UserAttributeUpdateSettings is stored and returned on user pools; UpdateUserAttributes and AdminUpdateUserAttributes now create pending email/phone changes when verification before update is required, VerifyUserAttribute applies pending values with *_verified=true, and GetUserAttributeVerificationCode resends pending attribute verification codes.
    - ListUsers now supports documented standard-attribute filters, AttributesToGet shaping/validation, and Limit/PaginationToken pagination.
    - ListGroups, AdminListGroupsForUser, and ListUsersInGroup now support Limit/NextToken pagination.
    - Malformed persisted pool, client, or user records are isolated so they do not turn Cognito list/admin APIs into service-wide InternalError responses.
    - CreateUserPool/UpdateUserPool now store, validate, and return AliasAttributes, DeviceConfiguration, AccountRecoverySetting, SmsConfiguration, SmsAuthenticationMessage, SmsVerificationMessage, EmailVerificationMessage, EmailVerificationSubject, and LambdaConfig; the AWS::Cognito::UserPool CloudFormation handler threads all of them on Create and reconciles the mutable ones on Update, replacing the pool only for AliasAttributes/UsernameAttributes changes (issue #536).
    - CreateUserPoolClient/UpdateUserPoolClient now store and return PreventUserExistenceErrors, ReadAttributes, and WriteAttributes; the AWS::Cognito::UserPoolClient CloudFormation handler threads and reconciles them, and now has an Update handler at all (previously every template change replaced the client) (issue #536).
    - "CreateUserPool/CreateUserPoolClient/UpdateUserPoolClient now reject a LITE-tier pool's SignInPolicy/ALLOW_USER_AUTH with FeatureUnavailableInTierException (typed_logic.go:2674-2721: validateExplicitAuthFlowsForTier, validateUserPoolTier, validateTierForSignInPolicy, validateTierForWebAuthn; wired in handler_pools.go:146-157 and handler_clients.go:54,291), matching AWS's requirement that choice-based sign-in and passkeys need the Essentials plan or higher, confirmed by TestCreateUserPool_liteTierSignInPolicy/TestCreateUserPoolClient_liteTierUserAuth/TestUpdateUserPoolClient_liteTierUserAuth. UpdateUserPool enforces the identical SignInPolicy gate but lacks a dedicated test (issue #116, tracked separately). Closes issues #115, #117, #118, #128 (review app-tier restrictions for ALLOW_USER_AUTH), and #129 (review app-tier restrictions for SignInPolicy and ALLOW_USER_AUTH)."
    - "Issue #133 (review all challenge flows, including MFA and NEW_PASSWORD_REQUIRED, against AWS docs) is subsumed by the more specific SRP/WebAuthn verification-boundary findings below (#124, #125, #127) and by the existing NEW_PASSWORD_REQUIRED/SOFTWARE_TOKEN_MFA/challenge-flow test coverage in cognito_user_auth_test.go; closed as-is with no separate action needed."
    - "ForgetDevice and AdminForgetDevice answer ResourceNotFoundException for a device key the user never registered (device_auth.go), instead of the silent HTTP 200 the loop fell through to, matching the operations' modeled error sets and GetDevice/UpdateDeviceStatus in the same file (TestForgetDevice_unknownDeviceKey, TestAdminForgetDevice_unknownDeviceKey). The device, SignUp and challenge review items are asserted rather than assumed: ConfirmDevice duplicate-key and opt-in confirmation (the first coverage of DeviceOnlyRememberedOnUserPrompt=true), UpdateDeviceStatus/AdminUpdateDeviceStatus enum and not-found validation, RespondToAuthChallenge SECRET_HASH over the literal ChallengeResponses.USERNAME, and SignUp's own UserSub and duplicate handling (issues #110, #114, #106, #109, #113, #107, #108, #86, #93, #97, #98, #90, #103; tests/integration/cognito/cognito_device_review_test.go)."
  remaining_gaps:
    - "RespondToAuthChallenge's MFA challenge behavior (issue #87) and AdminRespondToAuthChallenge's MFA challenge behavior (issue #96) are not fully reviewed: SMS_MFA and MFA_SETUP challenges are not implemented."
    - AutoVerifiedAttributes and Schema are threaded onto the CreateUserPool wire call by the CloudFormation UserPool handler (they always were) but the Cognito service itself does not yet store either, so both still round-trip as dropped (issue #84).
  intentionally_partial:
    - SRP proof validation is not cryptographically verified; verifier responses are shape-checked and complete authentication for SDK-compatible local testing (typed_logic.go:1249-1250 completeSRPVerifierChallengeTyped checks only that PASSWORD_CLAIM_SIGNATURE/PASSWORD_CLAIM_SECRET_BLOCK/TIMESTAMP are present; issue #124).
    - Device SRP proof validation is not cryptographically verified; DEVICE_PASSWORD_VERIFIER responses are shape-checked and complete authentication for SDK-compatible local testing (device_auth.go:99-100 completeDevicePasswordVerifierTyped checks only that the same claim fields are present; issue #125).
    - "CUSTOM_AUTH Lambda Define/Create/Verify triggers, challenge answer verification, and repeated custom-challenge loops are not executed; Overcast emits AWS-shaped challenge/session responses and accepts ANSWER for SDK-compatible local testing (triggers.go:18-19 names this scope explicitly, and docs/services/cognito/limitations.md's Lambda triggers table links it). Closes issues #88, #94, and #101 (the AdminInitiateAuth/InitiateAuth/AdminRespondToAuthChallenge CUSTOM_AUTH trigger-execution gap bullets describe this same, already-documented limitation rather than a separate review item)."
    - "WebAuthn attestation/assertion signatures, origin validation, and relying-party mismatch validation are not cryptographically verified; credential metadata and challenge shapes are emulated for SDK-compatible local testing (issue #127). SetUserPoolMfaConfig's validateWebAuthnConfiguration (typed_logic.go:2776-2787) checks only the UserVerification/FactorConfiguration enum values and performs no relying-party-ID/domain validation against public suffix or custom-domain constraints (issue #120). StartWebAuthnRegistration's registration challenge is time-boxed (webAuthnChallengeTTL, user_auth_factors.go:13, 5 minutes) and checked by CompleteWebAuthnRegistration, but AWS's exact error taxonomy for expired, mismatched, or replayed challenges is not reproduced (issue #122); RespondToAuthChallenge/AdminRespondToAuthChallenge's WEB_AUTHN completion checks only that the credential ID is a known registered credential (completeWebAuthnChallengeTyped, typed_logic.go:1319-1337), not the challenge nonce, origin, or assertion signature."
    - "Verification-code TTL, throttling, and delivery-failure behavior (GetUserAttributeVerificationCode, ForgotPassword, ResendConfirmationCode, and other code-issuing operations) are intentionally not emulated; a code stays valid until consumed or replaced (issue #130)."
    - LambdaConfig is stored by CreateUserPool/UpdateUserPool and returned by DescribeUserPool so a CDK pool's triggers round-trip visibly. As of issue #1171, PreSignUp, PostConfirmation, PreTokenGeneration, PostAuthentication, and CustomMessage are invoked by SignUp/AdminCreateUser/ConfirmSignUp/AdminConfirmSignUp/ConfirmForgotPassword/ResendConfirmationCode/ForgotPassword/InitiateAuth/AdminInitiateAuth/RespondToAuthChallenge/AdminRespondToAuthChallenge on the classic X-Amz-Target API. Still not invoked: PreAuthentication and UserMigration (not yet wired), the CUSTOM_AUTH challenge triggers DefineAuthChallenge/CreateAuthChallenge/VerifyAuthChallengeResponse (tracked separately by #88/#94/#101), PreTokenGeneration's V2_0/V3_0 access-token-customization event versions, CustomMessage for UpdateUserAttribute/VerifyUserAttribute/Authentication (MFA), and every trigger on the Smithy RPC v2 duplicate dispatch path (typed_logic.go) other than PreTokenGeneration, which that path gets for free because token issuance funnels through one shared function.
