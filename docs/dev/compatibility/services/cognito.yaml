    - Username-attribute email lookup fix for AdminSetUserPassword.
    - Username-attribute email lookup fix for RespondToAuthChallenge.
    - Username-attribute email lookup fix for AdminDeleteUser.
    - ConfirmSignUp Session immediate sign-in for InitiateAuth/AdminInitiateAuth USER_AUTH.
    - USER_AUTH SELECT_CHALLENGE/PASSWORD challenge flow.
    - USER_AUTH PASSWORD_SRP and USER_SRP_AUTH SRP-shaped challenge flows.
    - USER_AUTH WEB_AUTHN and WebAuthn registration shape flows.
    - CUSTOM_AUTH direct custom challenge and SRP-prelude shape flows.
    - NewDeviceMetadata, ConfirmDevice, GetDevice/ListDevices/UpdateDeviceStatus/ForgetDevice, admin device management operations, and remembered-device DEVICE_SRP_AUTH/DEVICE_PASSWORD_VERIFIER shape flows.
    - USER_AUTH PREFERRED_CHALLENGE=PASSWORD flow for InitiateAuth/AdminInitiateAuth and challenge responses.
    - USER_AUTH unavailable preferred challenge fallback to SELECT_CHALLENGE.
    - SignInPolicy.AllowedFirstAuthFactors storage and PASSWORD gating for USER_AUTH.
    - ALLOW_USER_AUTH app-client enforcement for USER_AUTH.
