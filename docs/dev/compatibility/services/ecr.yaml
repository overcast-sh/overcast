service: ecr
status: in_progress
priority: p1
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-20
protocols: [aws_json_1_1, aws_json_1_0, rpcv2_cbor]
implementation: [internal/services/ecr]
integration_tests: [tests/integration/ecr]
capability_docs: docs/services/ecr.md
operation_count_estimate: 25 declared (19 supported, 2 inert, 4 partial, 3 unsupported/not implemented — see internal/capabilities/all.gen.go)
current_support_level: Repository and image metadata control plane supported; Docker registry integration optional, and every operation whose fidelity depends on it (CreateRepository/DescribeRepositories/DeleteRepository's repositoryUri, GetAuthorizationToken, ListImages, BatchDeleteImage) is declared Partial with the exact without-Docker or unreachable-registry behavior; scanning is Inert (DescribeImageScanFindings, PutImageScanningConfiguration) or Unsupported/501 (StartImageScan, Get/PutRegistryScanningConfiguration) — no scan engine is emulated.
operations:
  GetAuthorizationToken:
    status: fixed
    docs:
      - https://docs.aws.amazon.com/AmazonECR/latest/userguide/Registries.html
    scenarios:
      registry_container_recovery:
        status: fixed
        evidence:
          - internal/services/ecr/registry_reconcile_test.go
          - internal/router/docker_reconcile_test.go
        notes: A used local registry whose container exits is replaced immediately. If the Docker event was missed, the first daemon connection or reconnect supplies the same central snapshot and invalidates the cached dead address before starting a replacement; the registry password is retained so issued authorization tokens remain valid.
  DescribeRepositories:
    status: fixed
    docs:
      - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_DescribeRepositories.html
    scenarios:
      repository_uri_after_a_registry_move:
        status: fixed
        evidence:
          - internal/services/ecr/repository_uri_test.go
        notes: >-
          repositoryUri is re-minted from the running registry on every read rather than
          served from the record. On AWS the address is immutable; here it is the registry
          container's published port, and repositories outlive the registry — a repository
          created before the registry was up otherwise advertised Overcast's API port
          forever, where docker push answers 405.
  DescribeImages:
    status: fixed
    docs:
      - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_DescribeImages.html
    scenarios:
      requested_image_absent:
        status: fixed
        evidence:
          - tests/integration/ecr/image_existence_test.go#TestDescribeImages_absentTagIsImageNotFound
          - tests/integration/ecr/image_existence_test.go#TestDescribeImages_absentDigestIsImageNotFound
          - tests/integration/ecr/image_existence_test.go#TestDescribeImages_oneAbsentIDFailsTheWholeRequest
          - tests/integration/ecr/image_existence_test.go#TestDescribeImages_absentTagIsImageNotFoundOverCBOR
        notes: >-
          An imageIds entry that resolves to nothing raises ImageNotFoundException, in
          both wire protocols, and one absent id fails the whole request — DescribeImages
          has no per-image failure list. Previously 200 with a short list, which
          cdk-assets reads as "already published"; every CDK container asset was
          therefore skipped and the ECS task that ran it failed with a 404 at pull time.
      no_image_ids_requested:
        status: fixed
        evidence:
          - tests/integration/ecr/image_existence_test.go#TestDescribeImages_emptyRepositoryWithoutImageIDsIsEmpty
        notes: An unfiltered describe of an empty repository is an empty list, not an error.
      registry_reconciliation:
        status: fixed
        evidence:
          - internal/services/ecr/registry_sync_test.go
        notes: >-
          Records built from the local registry's manifests are dropped when the registry
          answers 404 for them — the state after a restart, since the registry container
          keeps no volume. Records written by PutImage are not the registry's to revoke.
  ListImages:
    status: fixed
    docs:
      - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_ListImages.html
    scenarios:
      registry_unreachable_is_silent:
        status: fixed
        evidence:
          - internal/services/ecr/registry_reconciliation_scope_test.go#TestListImages_silentlyServesTheStoreWhenTheRegistryIsUnreachable
        notes: >-
          Deliberate, and now pinned rather than merely documented in a code comment:
          unlike DescribeImages/BatchGetImage, a transiently unreachable registry does not
          turn into ServerException here — the caller gets whatever the store currently
          holds. Declared Partial because the sweep's outcome is not surfaced to the caller.
  BatchGetImage:
    status: fixed
    docs:
      - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_BatchGetImage.html
    scenarios:
      registry_unreachable_is_serverexception:
        status: fixed
        evidence:
          - internal/services/ecr/registry_reconciliation_scope_test.go#TestBatchGetImage_answersServerExceptionWhenTheRegistryIsUnreachable
          - internal/services/ecr/registry_reconciliation_scope_test.go#TestBatchGetImage_stillAnswersPerImageFailuresWhenTheRegistryIsReachable
        notes: >-
          Already mirrored DescribeImages' sweep-state check; only the test coverage was
          missing. Now pinned: an unreachable registry answers ServerException rather than
          reporting an image falsely missing, and a reachable registry that genuinely lacks
          the image still reports it as a per-image failure.
  BatchDeleteImage:
    status: implementation_mismatch
    docs:
      - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_BatchDeleteImage.html
    scenarios:
      deletion_not_forwarded_to_the_registry:
        status: implementation_mismatch
        evidence:
          - internal/services/ecr/registry_reconciliation_scope_test.go#TestBatchDeleteImage_deletedImageReappearsWhenTheRegistryStillServesIt
        notes: >-
          BatchDeleteImage only ever deletes the store's record; it never asks the registry
          to delete the manifest. When Docker backs the repository, an image the registry
          still serves reappears on the very next reconciling read (ListImages/
          DescribeImages/BatchGetImage), unlike real ECR where the deletion is durable.
          Declared Partial rather than fixed here — reaching the registry from
          BatchDeleteImage is registry-lifecycle work, out of scope for #141.
findings:
  fixed:
    - DescribeImages answered an absent imageId with 200 and an empty list rather than ImageNotFoundException.
    - Image records survived the registry that held the images, so absent images were reported present.
    - A registry container exit no longer leaves repository URIs and authorization responses pointing at its dead published port; live events and daemon reconnect reconciliation start a replacement.
    - >-
      Docker-dependent and scanner-unavailable behavior is now honestly declared rather than
      claimed Supported (#141): CreateRepository/DescribeRepositories/DeleteRepository/
      GetAuthorizationToken/ListImages/BatchDeleteImage downgraded to Partial with the exact
      without-Docker or unreachable-registry gap in their Notes; DescribeImageScanFindings and
      PutImageScanningConfiguration downgraded to Inert (accepted, stored/echoed, but no scan
      engine ever runs); StartImageScan, GetRegistryScanningConfiguration and
      PutRegistryScanningConfiguration — previously undeclared, silently falling through to a
      generic 501 — are now declared Unsupported so the scanning surface is fully accounted
      for. See internal/services/ecr/capabilities_dev.go.
    - >-
      ListImages and BatchGetImage now have scenario coverage for their registry-reconciliation
      behavior (internal/services/ecr/registry_reconciliation_scope_test.go), closing the second
      remaining_gaps entry alongside the first.
  remaining_gaps: []
  intentionally_partial:
    - >-
      BatchDeleteImage does not reach the registry, so a Docker-backed deletion is not durable
      (see the BatchDeleteImage operation entry above). Fixing this is registry-lifecycle work
      and belongs with the reconciliation code in service.go, not with this issue's
      capability-annotation scope.
handoff:
  start_with: [CreateRepository, PutImage, GetAuthorizationToken]
  do_not_redo: [DescribeImages]
  commands: [go test -count=1 ./internal/services/ecr/... ./tests/integration/ecr/...]
