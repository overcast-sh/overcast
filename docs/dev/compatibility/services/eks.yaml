        evidence: The synthetic supported-version catalog is returned unconditionally, including in live mode after the cluster-scope 501 rules take effect (TestEKSLiveModeDescribeClusterVersionsStillWorks) — it is not cluster-scoped, so the mock-cluster refusal rules do not apply to it.

