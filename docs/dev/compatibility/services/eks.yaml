      - tests/integration/eks/eks_test.go#TestEKSLiveModeUpdateKubeconfigReturnsNotImplemented
      - internal/services/eks/service_runtime_kubeconfig_test.go
    status: reviewed
    scenarios:
      not_an_aws_api_operation:
        status: reviewed
        evidence: "aws eks update-kubeconfig is a CLI-side command backed by DescribeCluster plus a local file write; no SDK ever calls this endpoint. Overcast exposes it as POST /_overcast/eks/clusters/{name}/kubeconfig, an emulator extension, matching the capabilities_dev.go note and the CLI reference cited above rather than an APIReference page."
      "503_boundary":
        status: reviewed
        evidence: internal/services/eks/service_runtime_kubeconfig_test.go covers both documented 503 causes (not-yet-ACTIVE/no-endpoint, and CA still missing after reconcile) per docs/services/eks/limitations.md § UpdateKubeconfig and 503.

