findings:
  fixed:
    - Live-mode EKS clusters no longer retain ACTIVE metadata after their control-plane container exits or disappears while Overcast is not observing Docker events.
    - "#143: completed a full operation-by-operation compatibility inventory for all 50 registered EKS operations, mapping each to its AWS API Reference page (or the CLI reference for the emulator-only UpdateKubeconfig), its handler file, and the integration tests that exercise it. 46 of 50 operations have test evidence for every distinct claim in their capabilities_dev.go note; the remaining 4 are recorded as tests_missing below with the specific untested claim named."
    - "#1979: added test evidence for the 4 tests_missing claims (CreateCluster's accessConfig/logging round-trip and duplicate-name rejection; UpdateClusterConfig's resourcesVpcConfig update and no-changes error; CreateFargateProfile's podExecutionRoleArn/selectors round-trip; UpdateAddon's resolveConflicts echo). One claim was false: createFargateProfile (handler_fargate.go) accepted a request with no podExecutionRoleArn despite the pinned model marking it smithy.api#required — fixed with a serviceutil.RequireString check (400 MissingParameter), mirroring CreateAccessEntry's principalArn check."
  remaining_gaps: []
  intentionally_partial:
    - "CreateCluster's (and the equivalent UpdateClusterConfig/UpdateClusterVersion) logging, accessConfig and encryptionConfig are recorded and echoed only; nothing enforces them against a live k3s control plane. This is a stated design boundary (docs/services/eks/limitations.md § Non-goals), not a fixable gap."
    - "Nodegroup and Fargate profile capacity is metadata only in both modes — Overcast never provisions worker compute, so scalingConfig/desiredSize and similar fields describe intent that nothing acts on (docs/services/eks/limitations.md § Non-goals)."
    - "IAM enforcement, access policies and pod identity are stored, never enforced (docs/services/eks.md § Differences from AWS)."
handoff:
  start_with: []
  do_not_redo:
    [
      CreateCluster, DescribeCluster, DescribeClusterVersions, ListClusters, ListUpdates, ListInsights, DescribeInsight,
      UpdateClusterConfig, UpdateClusterVersion, DescribeUpdate, DeleteCluster, UpdateKubeconfig, CreateNodegroup,
      UpdateNodegroupVersion, UpdateNodegroupConfig, DescribeNodegroup, ListNodegroups, DeleteNodegroup,
      ListFargateProfiles, DescribeFargateProfile, CreateFargateProfile, DeleteFargateProfile, ListTagsForResource, TagResource,
      UntagResource, CreateAccessEntry, DescribeAccessEntry, UpdateAccessEntry, DeleteAccessEntry,
      ListAccessEntries, AssociateAccessPolicy, ListAccessPolicies, ListAssociatedAccessPolicies,
      DisassociateAccessPolicy, ListIdentityProviderConfigs, DescribeIdentityProviderConfig,
      AssociateIdentityProviderConfig, DisassociateIdentityProviderConfig, CreatePodIdentityAssociation,
      ListPodIdentityAssociations, DescribePodIdentityAssociation, UpdatePodIdentityAssociation,
      DeletePodIdentityAssociation, CreateAddon, DescribeAddon, ListAddons, UpdateAddon, DeleteAddon,
      DescribeAddonConfiguration, DescribeAddonVersions,
    ]
  commands: [go test -count=1 ./internal/services/eks/... ./tests/integration/eks/...]
