        status: reviewed
        evidence: "#1979 — a request with none of logging/resourcesVpcConfig/kubernetesNetworkConfig set returns 400 InvalidParameterException (TestEKSUpdateClusterConfigRejectsNoChanges). AWS's API reference lists InvalidParameterException as a possible UpdateClusterConfig error but does not publish an exact runtime message for the no-changes case, so only the error code, HTTP status, and a non-empty message are asserted — not the literal \"No configuration changes requested\" string."
