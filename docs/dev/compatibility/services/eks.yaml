service: eks
status: reviewed
priority: p2
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-20
protocols: [rest_json]
implementation: [internal/services/eks]
integration_tests: [tests/integration/eks]
capability_docs: docs/services/eks.md
operation_count_estimate: >-
  49 AWS operations declared in internal/services/eks/capabilities_dev.go, all StatusSupported: 29
  Clusters (cluster CRUD/updates/insights plus access entries, access policy associations,
  identity provider configs and pod identity associations, which capabilities_dev.go groups
  under the "Clusters" category), 6 Nodegroups, 4 Fargate, 3 Tags,
  7 Addons; 1 emulator extension (UpdateKubeconfig, Helpers category) counted separately. This inventory (#143): 50 reviewed, 0 tests_missing, 0 intentionally_partial at the
  operation level (the echoed-but-not-enforced design applies broadly and is recorded once in
  findings.intentionally_partial and docs/services/eks/limitations.md rather than per operation).
  #1979 closed the last 4 tests_missing entries (CreateCluster, UpdateClusterConfig,
  CreateFargateProfile, UpdateAddon).
current_support_level: >-
  All 50 registered operations are implemented and have at least one integration test exercising
  their primary request/response shape, live-mode 501 boundary (where applicable), and
  cluster-delete cascade cleanup (where applicable). All 50 now have test evidence for every
  distinct behavior their capabilities_dev.go note claims.
operations:
  # ─── Clusters ────────────────────────────────────────────────────────────
  CreateCluster:
    aws_docs:
      - https://docs.aws.amazon.com/eks/latest/APIReference/API_CreateCluster.html
    implementation: internal/services/eks/handler_cluster.go (createCluster), internal/services/eks/typed_logic.go (createClusterTyped)
    tests:
      - tests/integration/eks/eks_test.go#TestEKSClusterLifecycle
      - tests/integration/eks/eks_test.go#TestEKSCreateClusterPreservesNetworkAndEncryptionConfig
      - tests/integration/eks/eks_test.go#TestEKSInlineTagsOnCreate
      - tests/integration/eks/eks_test.go#TestEKSLiveModeCreateClusterRequiresDocker
      - tests/integration/eks/eks_test.go#TestEKSCreateClusterPreservesAccessConfigAndLogging
      - tests/integration/eks/eks_test.go#TestEKSCreateClusterRejectsDuplicateName
      - internal/services/eks/container_reconcile_test.go
    status: reviewed
    scenarios:
      metadata_round_trip:
        status: reviewed
        evidence: roleArn is required and accepted by every test helper; version, resourcesVpcConfig, kubernetesNetworkConfig, and encryptionConfig round-trip through DescribeCluster in TestEKSCreateClusterPreservesNetworkAndEncryptionConfig; inline create-time tags are visible via both the create response and DescribeCluster in TestEKSInlineTagsOnCreate and TestEKSDescribeResourcesReturnInlineTags.
      access_config_and_logging_on_create:
        status: reviewed
        evidence: "#1979 — accessConfig.authenticationMode and logging.clusterLogging, sent on CreateCluster itself, round-trip through both the create response and DescribeCluster (TestEKSCreateClusterPreservesAccessConfigAndLogging)."
      duplicate_cluster_name:
        status: reviewed
        evidence: "#1979 — a second CreateCluster call for an already-existing name returns 409 ResourceInUseException (TestEKSCreateClusterRejectsDuplicateName), matching the equivalent CreateAccessEntry/CreatePodIdentityAssociation duplicate-name paths."
      echoed_not_enforced:
        status: intentionally_partial
        gap: "logging, accessConfig and encryptionConfig are recorded and echoed only; the k3s control plane (live mode) enforces none of them. This is a documented design boundary, not a coverage gap — see docs/services/eks/limitations.md § Non-goals."
      live_control_plane_recovery:
        status: fixed
        evidence:
          - internal/services/eks/container_reconcile_test.go
          - internal/router/docker_reconcile_test.go
        notes: In live mode, persisted CREATING or ACTIVE clusters re-adopt a running k3s control plane or coalesce a replacement after a live exit, initial Docker connection, or event-stream reconnect.

  DescribeCluster:
