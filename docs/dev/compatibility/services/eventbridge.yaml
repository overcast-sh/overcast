service: eventbridge
status: fixed
priority: p1
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-20
protocols: [aws_json_1_1, rpcv2_cbor]
implementation: [internal/services/eventbridge]
integration_tests: [tests/integration/eventbridge]
capability_docs: docs/services/eventbridge.md
operation_count_estimate: 29 tracked; 18 supported, 11 unsupported
current_support_level: Management-plane/CDK-compatible with real routing — PutEvents evaluates every rule on a bus and delivers matches to Lambda, SQS, SNS, Step Functions, Kinesis, Firehose, ECS RunTask and another event bus, applying InputPath/InputTransformer precedence and RetryPolicy/DeadLetterConfig (#467, PR #494). Archives, replay, and API destinations remain unimplemented.
operations:
  PutRule:
    status: fixed
    scenarios:
      rule_requires_event_pattern_or_schedule_expression:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutRule.html
          - internal/services/eventbridge/rule_validation_test.go::TestPutRuleTyped_requiresEventPatternOrScheduleExpression
          - tests/integration/eventbridge/rule_validation_test.go::TestPutRule_requiresEventPatternOrScheduleExpression
        notes: >-
          AWS documents "A rule must contain at least an EventPattern or ScheduleExpression";
          PutRule now answers ValidationException/400 instead of storing a rule that can never
          fire. The API reference publishes no message text, so the error code and 400 status are
          the contractual part and the wording follows what real EventBridge returns.
      unknown_event_bus_is_resource_not_found:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutRule.html
          - internal/services/eventbridge/rule_validation_test.go::TestPutRuleTyped_unknownEventBusIsResourceNotFound
          - internal/services/eventbridge/rule_validation_test.go::TestPutRuleTyped_knownAndDefaultBusesAreAccepted
          - internal/services/eventbridge/rule_validation_test.go::TestPutRuleTyped_busARNStoresTheRuleUnderTheBusName
          - tests/integration/eventbridge/rule_validation_test.go::TestPutRule_unknownEventBusIsResourceNotFound
        notes: >-
          A rule naming a bus that was never created is ResourceNotFoundException/400 rather than a
          rule stranded on a bus no PutEvents call can address. The default bus stays reachable
          because it is never written to the store. EventBusName may also be the bus ARN the
          parameter pattern admits as an optional prefix, and PutRule stores the rule under the
          bus name either way, because DescribeRule, ListRules, PutTargets and delivery all key
          off the name.
      malformed_event_pattern_is_refused:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutRule.html
          - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
          - internal/services/eventbridge/rule_validation_test.go::TestPutRuleTyped_invalidEventPatternIsRefused
          - internal/services/eventbridge/rule_validation_test.go::TestPutRuleTyped_refusedRuleIsNotStored
          - internal/services/eventbridge/pattern_operators_test.go::TestValidateEventPattern
          - tests/integration/eventbridge/rule_validation_test.go::TestPutRule_invalidEventPatternIsRefused
        notes: >-
          A non-JSON pattern, a field whose value is a bare scalar rather than an object or an
          array, an unrecognized match type, and a match type given the wrong argument shape are
          all InvalidEventPatternException/400. Validation runs before the store, so a refused
          PutRule leaves no rule behind. The documented 4096-character EventPattern limit is
          enforced here as well as in TestEventPattern.
      content_filter_operators:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns-content-based-filtering.html
          - internal/services/eventbridge/pattern_operators_test.go::TestEventPatternOperators
          - internal/services/eventbridge/rule_validation_test.go::TestPutRuleTyped_acceptsSupportedOperators
          - tests/integration/eventbridge/rule_validation_test.go::TestPutEvents_contentFilterDeliversToSQSTarget
        notes: >-
          prefix, suffix, exists, equals-ignore-case, numeric (single comparison and range) and
          anything-but (single value, list, and nested prefix/suffix/equals-ignore-case) are
          evaluated by the one matcher PutEvents, TestEventPattern and the scheduled-rule engine
          share, so a content-filtered rule delivers rather than matching nothing. exists is held
          to the documented leaf-node restriction, and a numeric bound outside AWSs documented
          -5.0e9..+5.0e9 range is refused. A clause the matcher cannot read - an empty candidate
          array, an empty or wrongly shaped anything-but argument, a match expression with more
          than one match type - is refused at PutRule and never matches at delivery time, so
          anything-but can never negate an unreadable clause into a rule that matches every
          event (TestEventPatternOperators_unreadableClauseNeverMatches).
      unsupported_operators_fail_loudly:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns-content-based-filtering.html
          - internal/services/eventbridge/rule_validation_test.go::TestPutRuleTyped_unsupportedOperatorIsRefusedNotSilentlyStored
        notes: >-
          cidr, wildcard and $or are refused at PutRule and TestEventPattern time with
          InvalidEventPatternException naming the match type, rather than stored as a rule that
          never matches (the fail-loudly rule from #484).
  DeleteRule:
    status: fixed
    scenarios:
      rule_with_targets_attached:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_DeleteRule.html
          - tests/integration/eventbridge/rule_validation_test.go::TestDeleteRule_withTargetsAttachedIsRefused
          - tests/integration/eventbridge/rule_validation_test.go::TestDeleteRule_forceDoesNotBypassTheTargetsCheck
          - tests/integration/eventbridge/rule_validation_test.go::TestDeleteRule_withoutTargetsStaysIdempotent
          - tests/integration/cloudformation/events_rule_teardown_test.go::TestDeleteStack_eventsRuleWithTargetsIsRemovedTargetsFirst
        notes: >-
          AWS documents "Before you can delete the rule, you must remove all targets, using
          RemoveTargets", and answers ValidationException for a rule that still has them; deleting
          it anyway used to strand the targets in the store. Force stays what the reference says it
          is - the managed-rule escape, "ignored for rules that are not managed rules" - so it does
          not bypass the check, and Overcast has no managed rules for it to apply to. Deleting a
          rule that does not exist still succeeds, keeping AWSs "If you call delete rule multiple
          times for the same rule, all calls will succeed." The CloudFormation AWS::Events::Rule
          handler detaches the rules targets before DeleteRule, which is what real CloudFormations
          resource provider does and what keeps stack teardown working under the new rule. The API
          reference publishes no message text, so the wording follows real EventBridge and the
          error code and 400 status are the contractual part.
  PutTargets:
    status: fixed
    priority: p1
    aws_docs:
      - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutTargets.html
      - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_Target.html
    scenarios:
      target_validation_rejections:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutTargets.html
          - tests/integration/eventbridge/target_fanout_test.go::TestPutTargets_rejectsUnsupportedTargetType
          - tests/integration/eventbridge/target_fanout_test.go::TestPutTargets_rejectsMalformedTargetARN
          - tests/integration/eventbridge/target_fanout_test.go::TestPutTargets_rejectsMultipleInputSpecifications
        notes: >-
          A target type Overcast cannot deliver to comes back in FailedEntries with
          UnsupportedTargetType and is not stored; a malformed target ARN, and a target setting
          more than one of Input/InputPath/InputTransformer, are ValidationException for the whole
          call. Reviewed under #148 - the fixtures now create their rule with an event pattern,
          because a trigger-less rule is no longer accepted.
      ecs_fargate_target_round_trip:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_Target.html
          - tests/integration/eventbridge/eventbridge_test.go::TestPutTargets_ecsFargateTargetRoundTrip
        notes: PutTargets/ListTargetsByRule preserve RoleArn, Input, and EcsParameters used by CDK scheduled Fargate task targets.
      rejects_unsupported_target_type:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutTargets_rejectsUnsupportedTargetType
        notes: A well-formed ARN naming a service with no delivery sink (CloudWatch Logs, cross-bus events, API destinations) comes back in FailedEntries with ErrorCode UnsupportedTargetType and is not stored, instead of provisioning a rule that silently never fires.
      rejects_malformed_target_arn:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutTargets_rejectsMalformedTargetARN
        notes: A malformed ARN fails the whole PutTargets call with ValidationException (400), matching AWS's synchronous ARN-shape check.
      rejects_multiple_input_specifications:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutTargets_rejectsMultipleInputSpecifications
        notes: More than one of Input/InputPath/InputTransformer on a target is a ValidationException, as on AWS.
  PutEvents:
    status: fixed
    priority: p1
    aws_docs:
      - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutEvents.html
      - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
      - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html
    scenarios:
      matching_rule_sqs_target_delivery:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutEvents.html
          - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
          - tests/integration/eventbridge/eventbridge_test.go::TestPutEvents_matchingRuleDeliversToSQSTarget
        notes: Exact-match event patterns are evaluated and matching events are delivered to SQS targets with an EventBridge event envelope.
      lambda_target_delivery:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_deliversToLambdaTarget
          - tests/integration/eventbridge/lambda_permission_test.go::TestPutEvents_lambdaTargetWithPermissionDelivers
          - tests/integration/eventbridge/lambda_permission_test.go::TestPutEvents_lambdaTargetWithoutPermissionIsDropped
          - tests/integration/eventbridge/lambda_permission_test.go::TestPutEvents_lambdaTargetPermissionForAnotherRuleIsDropped
          - tests/integration/eventbridge/lambda_permission_test.go::TestPutEvents_lambdaTargetWithRoleARNSkipsThePolicyCheck
          - tests/integration/eventbridge/lambda_permission_test.go::TestPutEvents_lambdaTargetEnforcementOffNeedsNoPermission
        notes: A matching rule invokes a Lambda target asynchronously; delivery additionally respects Lambda resource-policy enforcement (a rule-scoped statement, RoleArn bypass, and the enforcement-off configuration).
      sns_target_delivery:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_deliversToSNSTarget
      step_functions_target_delivery:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_deliversToStepFunctionsTarget
      kinesis_target_delivery:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_deliversToKinesisTarget
      firehose_target_delivery:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_deliversToFirehoseTarget
      input_shaping_precedence:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_inputPathAppliesBeforeDelivery
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_inputTransformerAppliesBeforeDelivery
        notes: Input > InputPath > InputTransformer precedence, over the JSONPath subset AWS accepts.
      retry_and_dead_letter_queue:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_failedDeliveryGoesToDeadLetterQueue
          - tests/integration/eventbridge/target_fanout_test.go::TestPutEvents_failedDeliveryWithoutDLQIsDropped
        notes: A failed delivery retries 1+RetryPolicy.MaximumRetryAttempts times (capped at 6 total), then dead-letters to DeadLetterConfig.Arn if set, otherwise drops with a logged warning; retries are immediate rather than AWS's exponential backoff over 24 hours (recorded as a difference in docs/services/eventbridge.md).
      delivery_outcome_reporting:
        status: fixed
        evidence:
          - tests/integration/eventbridge/target_fanout_test.go::TestDeliveriesEndpoint_reportsResolvedTargetTypes
        notes: GET /_overcast/eventbridge/deliveries (emulator-only) reports each target's resolved type and last outcome from an in-memory ring.
      event_bus_forwarding:
        status: fixed
        evidence:
          - tests/integration/eventbridge/bus_target_test.go::TestPutEvents_busTargetRepublishesSourceAndDetailType
          - tests/integration/eventbridge/bus_target_test.go::TestPutEvents_busCycleTerminatesAtTheHopBudget
          - tests/integration/eventbridge/bus_target_test.go::TestPutEvents_busTargetAppliesInputTransformerToTheDetail
        notes: An event-bus target republishes Source/DetailType onto the target bus and applies its own InputTransformer; forwarding is a capped in-process nested call (4 hops) rather than AWS's independent, unbounded delivery — recorded as a difference in docs/services/eventbridge.md.
  scheduled_rules:
    status: fixed
    priority: p2
    aws_docs:
      - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_EcsParameters.html
    scenarios:
      ecs_fargate_run_task:
        status: fixed
        evidence:
          - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_EcsParameters.html
          - tests/integration/eventbridge/eventbridge_test.go::TestScheduledRule_ecsFargateTargetRunsTask
        notes: Rate and basic cron expressions are evaluated by an in-process scheduler; ECS/Fargate targets invoke ECS RunTask through the emulator router.
findings:
  fixed:
    - PutTargets/ListTargetsByRule preserve ECS/Fargate target metadata needed by CDK scheduled task management.
    - PutEvents exact-match rule delivery to SQS targets is covered.
    - Scheduled ECS/Fargate RunTask target invocation is covered.
    - >-
      #147/#467 (PR #494) — "Decide whether inert routing is acceptable" is answered
      by the code, not a decision to leave it inert: PutEvents fan-out was rewritten
      from SQS-and-scheduled-ECS-only to deliver matching events to Lambda, SQS, SNS,
      Step Functions, Kinesis, Firehose, ECS RunTask and another event bus, applying
      Input/InputPath/InputTransformer precedence and RetryPolicy/DeadLetterConfig —
      internal/services/eventbridge/capabilities_dev.go:27, internal/eventtarget
      (dispatch package). PutTargets independently validates every target at add
      time (malformed ARN, unsupported target type, multiple input specifications)
      rather than accepting and silently dropping at delivery. See the PutEvents and
      PutTargets operation entries above for the full test list. docs/services/eventbridge.md
      already documents the eight target types and no longer calls routing "partial".
  remaining_gaps:
    - An event pattern is not matched against an array-valued event field; AWS matches when any member of the array matches.
    - Only PutRule accepts the event-bus ARN spelling of EventBusName; DescribeRule, ListRules, PutTargets, RemoveTargets and DeleteRule still require the bare name.
    - EventPatterns 4096-character limit is measured in bytes rather than characters, so a multi-byte pattern under the limit is refused (pre-existing in TestEventPattern, now shared with PutRule).
  intentionally_partial:
    - Target delivery covers eight target types (Lambda, SQS, SNS, Step Functions, Kinesis, Firehose, ECS RunTask, event bus); the remaining ~12 AWS target types (CloudWatch Logs, API destinations, Redshift, SageMaker Pipeline, and others) are refused at PutTargets with UnsupportedTargetType rather than accepted and dropped.
    - Archives, replay, and API destinations (Connections) are not implemented — 501, per docs/services/eventbridge.md.
    - Retry timing is immediate and capped at 5-6 total attempts rather than AWS's exponential backoff over up to 24 hours.
    - Bus-to-bus forwarding is a nested in-process call capped at 4 hops rather than AWS's independent, unbounded delivery.
    - The numeric match type accepts "!=", which EventBridges matcher supports but the user guides operator table does not list. Accepting it was chosen over refusing a pattern real EventBridge takes; confirming it needs a real-AWS check the reference policy reserves for the user.
    - The cidr, wildcard and $or match types are not evaluated. A pattern using one is refused at PutRule and TestEventPattern time with InvalidEventPatternException naming the match type, rather than accepted and silently never matched.
handoff:
  start_with: ["array-valued event field matching, the event-bus ARN spelling of EventBusName on DescribeRule/ListRules/PutTargets/RemoveTargets/DeleteRule, cidr and wildcard match types"]
  do_not_redo:
    - ECS/Fargate target metadata round-trip for PutTargets/ListTargetsByRule; covered by TestPutTargets_ecsFargateTargetRoundTrip.
    - SQS target delivery for matching PutEvents; covered by TestPutEvents_matchingRuleDeliversToSQSTarget.
    - Scheduled ECS/Fargate RunTask invocation; covered by TestScheduledRule_ecsFargateTargetRunsTask.
    - "PutEvents fan-out to Lambda/SNS/Step Functions/Kinesis/Firehose/event-bus, PutTargets validation (unsupported type, malformed ARN, multiple input specs), input shaping precedence, retry/DLQ, and Lambda permission enforcement (#147, #467, PR #494) from 2026-09-20."
    - PutRule validation of the trigger, the event bus and the event pattern; covered by internal/services/eventbridge/rule_validation_test.go and tests/integration/eventbridge/rule_validation_test.go.
    - The prefix, suffix, exists, equals-ignore-case, numeric and anything-but match types; covered by internal/services/eventbridge/pattern_operators_test.go and TestPutEvents_contentFilterDeliversToSQSTarget.
    - PutTargets target-type, ARN-shape and input-specification validation; covered by the three TestPutTargets_rejects* tests.
    - DeleteRules targets-attached refusal, Force not bypassing it, and the CloudFormation AWS::Events::Rule teardown that removes targets first; covered by the three TestDeleteRule_* tests and TestDeleteStack_eventsRuleWithTargetsIsRemovedTargetsFirst.
  commands: [go test -count=1 ./internal/services/eventbridge/... ./tests/integration/eventbridge/...]
