service: lambda
status: fixed
priority: p0
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-23
protocols: [rest_json, event_stream]
implementation: [internal/services/lambda]
integration_tests: [tests/integration/lambda, tests/integration/lambdadocker]
capability_docs: docs/services/lambda.md
operation_count_estimate: >-
  62 tracked (internal/services/lambda/capabilities_dev.go): 59 StatusSupported,
  2 StatusPartial, 1 StatusUnsupported — matching docs/services/lambda.md's "61 of 62 listed
  operations are implemented". The tracker previously said "51 tracked; 49 supported,
  2 unsupported", undercounting by 11.
current_support_level: Broad control plane plus Docker-backed invoke; InvokeAsync unsupported.
operations:
  CreateFunction:
    # reviewed: every scenario below is tested for the behaviour Overcast
    # claims, and every documented partiality names its gap and its issue.
    status: reviewed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_CreateFunction.html
      - https://docs.aws.amazon.com/lambda/latest/api/API_PublishVersion.html
      - https://docs.aws.amazon.com/lambda/latest/api/API_FunctionConfiguration.html
      - https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances-version-publishing.html
    protocol: REST JSON; POST /2015-03-31/functions; application/json request and response
    tests:
      - go test -count=1 -run 'TestCreateFunction_' ./tests/integration/lambda/...
      - go test -count=1 ./internal/services/lambda/...
    scenarios:
      default_zip_function:
        status: reviewed
        evidence: Existing success/default tests verify 201 response, AWS defaults Timeout=3, MemorySize=128, PackageType=Zip, and Architectures=[x86_64].
      required_fields:
        status: fixed
        evidence: Added tests for missing Code, Runtime, and Handler on Zip package functions; handler now returns InvalidParameterValueException HTTP 400.
      image_package:
        status: fixed
        evidence: Added test for PackageType=Image with Runtime; handler now rejects Runtime on image functions and requires Code.ImageUri.
      enum_and_bounds_validation:
        status: fixed
        evidence: Added tests for invalid PackageType, Timeout > 900, MemorySize < 128, and invalid Architectures; handler now returns InvalidParameterValueException HTTP 400.
      duplicate_function:
        status: reviewed
        evidence: Existing test verifies duplicate FunctionName returns ResourceConflictException HTTP 409.
      deprecated_runtime:
        status: reviewed
        evidence: Existing test verifies deprecated runtime rejection.
      publish_on_create:
        status: fixed
        evidence: Publish=true creates the function and publishes version 1 from its initial configuration in one store critical section (createFunctionPublishing), and answers 201 with the version's FunctionConfiguration — Version "1", FunctionArn suffixed ":1", the snapshot's own RevisionId and CodeSha256 — while $LATEST stays readable unqualified and ListVersionsByFunction lists $LATEST then 1; the next PublishVersion is 2. Publish false or absent is unchanged and reports Version "$LATEST", which every FunctionConfiguration now carries as AWS does. A refused create (duplicate name, or a version write that fails) persists no function and no version. The snapshot is the same newFunctionVersion PublishVersion stores. Previously returned 501.
        tests:
          - tests/integration/lambda/create_function_publish_test.go::TestCreateFunction_publishTrue_returnsPublishedVersionOne
          - tests/integration/lambda/create_function_publish_test.go::TestCreateFunction_publishTrue_latestStaysReadable
          - tests/integration/lambda/create_function_publish_test.go::TestCreateFunction_publishTrue_listVersionsShowsLatestAndOne
          - tests/integration/lambda/create_function_publish_test.go::TestCreateFunction_publishTrue_nextPublishedVersionIsTwo
          - tests/integration/lambda/create_function_publish_test.go::TestCreateFunction_publishFalseOrAbsent_publishesNothing
          - tests/integration/lambda/create_function_publish_test.go::TestCreateFunction_publishTrue_duplicateNamePublishesNothing
          - internal/services/lambda/store_publish_on_create_test.go::TestCreateFunctionPublishing_commitsVersionOneWithTheFunction
          - internal/services/lambda/store_publish_on_create_test.go::TestCreateFunction_publishTrueRollsBackWhenTheVersionCannotBeStored
      publish_to_latest_published:
        status: unsupported
        gap: PublishTo's one value, LATEST_PUBLISHED, asks for the $LATEST.PUBLISHED version of a Lambda Managed Instances function — the qualifier unqualified invokes of such a function resolve to instead of $LATEST (https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances-version-publishing.html). Managed instances are not emulated and nothing resolves that qualifier, so the member returns 501 before mutation, alone or alongside Publish=true, rather than handing back a function whose unqualified ARN would behave differently from what was asked for.
        tests:
          - tests/integration/lambda/create_function_publish_test.go::TestCreateFunction_publishToLatestPublished_stillUnsupported
          - tests/integration/lambda/validation_review_test.go::TestUnsupportedFields_RealRequestsStill501
      advanced_configuration:
        status: reviewed
        evidence: Each optional configuration member of API_CreateFunction is one of three things, and every one has a test that pins which. Stored and echoed, honoured by the runtime — DeadLetterConfig, FileSystemConfigs (EFS, in live mode). Stored and echoed, honoured by nothing — TracingConfig, EphemeralStorage, KMSKeyArn, CodeSigningConfigArn (an association only). Refused with 501 before anything is persisted — SnapStart, DurableConfig, TenancyConfig, CapacityProviderConfig, PublishTo, Code.S3ObjectStorageMode, Code.SourceKMSKeyArn. A published version snapshot (PublishVersion or Publish=true) carries the stored members, so they read back identically on $LATEST and on the version. Exact empty-object/cross-field captures remain tracked in #660.
        members:
          DeadLetterConfig:
            status: fixed
            evidence: TargetArn validated against AWS's SQS/SNS ARN pattern, stored, reported only when set (as on AWS), and honoured — a failed asynchronous invocation reaches the queue or topic with the RequestID/ErrorCode/ErrorMessage attributes after AWS's three attempts (initial plus two retries, 1s then 2s); an empty TargetArn on update clears it.
            tests: [tests/integration/lambda/dead_letter_config_test.go, internal/services/lambda/dead_letter_test.go, tests/integration/cloudformation/lambda_dead_letter_test.go]
          FileSystemConfigs:
            status: intentionally_partial
            evidence: At most one config; EFS or S3 Files access-point ARN and a /mnt/<name> LocalMountPath are validated against the modeled patterns; stored and echoed on every read path; an EFS access point is bound as a Docker volume in live mode (container_runtime.go efsMounts). S3 Files execution-environment mounts are #647.
            tests: [tests/integration/lambda/efs_mounts_test.go::TestCreateFunction_fileSystemConfigsRoundTrip, tests/integration/lambda/efs_mounts_test.go::TestCreateFunction_s3FilesConfigRoundTrip, tests/integration/lambda/efs_mounts_test.go::TestCreateFunction_fileSystemConfigsValidation]
          TracingConfig:
            status: intentionally_partial
            evidence: Mode validated against the Active|PassThrough enum, stored, and always reported (PassThrough when unset, as on AWS); no X-Ray segment is ever recorded.
            tests: [tests/integration/lambda/tracing_storage_kms_test.go::TestFunctionAdvancedConfiguration_roundTripsThroughEveryReadPath, tests/integration/lambda/tracing_storage_kms_test.go::TestFunctionAdvancedConfiguration_defaultsMatchAWS, tests/integration/lambda/tracing_storage_kms_test.go::TestFunctionAdvancedConfiguration_invalidValuesRejectedBeforeMutation]
          EphemeralStorage:
            status: intentionally_partial
            evidence: Size validated against the modeled 512..10240 range and required-member rule, stored, and always reported (512 when unset, as on AWS); the container's /tmp is whatever the Docker host gives it.
            tests: [tests/integration/lambda/tracing_storage_kms_test.go::TestFunctionAdvancedConfiguration_roundTripsThroughEveryReadPath, tests/integration/lambda/tracing_storage_kms_test.go::TestFunctionAdvancedConfiguration_defaultsMatchAWS, tests/integration/lambda/tracing_storage_kms_test.go::TestFunctionAdvancedConfiguration_survivesRestart]
          KMSKeyArn:
            status: intentionally_partial
            evidence: Validated against the modeled ARN-or-empty pattern, stored and echoed; an explicit empty string clears it. Environment variables are stored in plaintext — no KMS call is made.
            tests: [tests/integration/lambda/tracing_storage_kms_test.go::TestFunctionAdvancedConfiguration_roundTripsThroughEveryReadPath, tests/integration/lambda/tracing_storage_kms_test.go::TestFunctionAdvancedConfiguration_invalidValuesRejectedBeforeMutation]
          CodeSigningConfigArn:
            status: intentionally_partial
            evidence: Validated against the modeled code-signing-config ARN pattern and must name an existing configuration (CodeSigningConfigNotFoundException 404 otherwise); stored, reported by GetFunctionCodeSigningConfig and ListFunctionsByCodeSigningConfig, kept off FunctionConfiguration as on AWS, and blocks DeleteCodeSigningConfig while referenced. No signature is verified — SigningJobArn/SigningProfileVersionArn are never reported and UntrustedArtifactOnDeployment=Enforce rejects nothing.
            tests: [tests/integration/lambda/lambda_test.go::TestCreateFunction_storesCodeSigningConfigArn, tests/integration/lambda/lambda_test.go::TestGetFunction_doesNotExposeCodeSigningConfigArn, tests/integration/lambda/code_signing_config_test.go::TestCreateFunction_unknownCodeSigningConfigIsRejected, tests/integration/lambda/code_signing_config_test.go::TestListFunctionsByCodeSigningConfig_andDeleteConflict]
          SnapStart:
            status: unsupported
            gap: 501 before mutation; ApplyOn=None (AWS's default) is accepted as a no-op. Accepting PublishedVersions would promise a restored snapshot and init-phase semantics that execution environments here never have — they always cold start.
            tests: [tests/integration/lambda/lambda_test.go::TestUnsupportedFunctionAndEventSourceConfigurationFailsBeforeMutation, tests/integration/lambda/validation_review_test.go::TestUnsupportedFields_ExplicitNoOpValuesAreNotRequests]
          DurableConfig:
            status: unsupported
            gap: 501 before mutation ({} accepted as a no-op); durable execution is not emulated.
            tests: [tests/integration/lambda/lambda_test.go::TestUnsupportedFunctionAndEventSourceConfigurationFailsBeforeMutation, tests/integration/lambda/validation_review_test.go::TestUnsupportedFields_ExplicitNoOpValuesAreNotRequests]
          TenancyConfig:
            status: unsupported
            gap: 501 before mutation; per-tenant isolation selects an execution substrate Overcast has no equivalent of.
            tests: [tests/integration/lambda/lambda_test.go::TestUnsupportedFunctionAndEventSourceConfigurationFailsBeforeMutation]
          CapacityProviderConfig:
            status: unsupported
            gap: 501 before mutation; Lambda Managed Instances are not emulated.
            tests: [tests/integration/lambda/lambda_test.go::TestUnsupportedFunctionAndEventSourceConfigurationFailsBeforeMutation]
          PublishTo:
            status: unsupported
            gap: See publish_to_latest_published.
          Code.S3ObjectStorageMode:
            status: unsupported
            gap: 501 before mutation; the storage mode of the deployment package is not emulated.
            tests: [tests/integration/lambda/lambda_test.go::TestUnsupportedFunctionAndEventSourceConfigurationFailsBeforeMutation]
          Code.SourceKMSKeyArn:
            status: unsupported
            gap: 501 before mutation; deployment-package encryption is not emulated.
            tests: [tests/integration/lambda/lambda_test.go::TestUnsupportedFunctionAndEventSourceConfigurationFailsBeforeMutation]
      lifecycle_state:
        status: intentionally_partial
        gap: Overcast can return Pending during Docker image prewarm and Active immediately otherwise; real Lambda provisioning state timing is not fully emulated.
      s3_object_version:
        status: fixed
        evidence: Code.S3ObjectVersion resolves against S3 object version history and fetches that version's bytes; an absent version or a delete marker fails the create with the same GetObject translation as an unreadable bucket or key, and persists nothing. Tests in tests/integration/lambda/create_function_code_version_test.go and tests/integration/cloudformation/lambda_s3_object_version_test.go.
      explicit_no_op_values:
        status: fixed
        evidence: A modeled-but-unimplemented member is refused only when the caller asked for it. An explicit null, false, "", [] or {} — AWS's own default for each gated member, and what SDKs and CloudFormation clear-values send — is a no-op and is accepted; any other value still returns 501.
    findings:
      fixed:
        - Zip CreateFunction requests without Code, Runtime, or Handler were accepted; now rejected as AWS InvalidParameterValueException.
        - Invalid PackageType, invalid Architectures, Timeout > 900, and MemorySize outside 128..32768 were accepted; now rejected.
        - Image CreateFunction requests with Runtime were accepted; now rejected.
        - Publish=true returned 501; it now publishes version 1 with the create and answers with that version's configuration, and every FunctionConfiguration carries Version.
      remaining_gaps:
        - PublishTo=LATEST_PUBLISHED ($LATEST.PUBLISHED, Lambda Managed Instances) stays 501 with the rest of managed instances.
        - S3 Files FileSystemConfigs validate and round-trip, but execution-environment mounts require #647.
        - Real-AWS captures for exact collection validation values and empty ImageConfigResponse omission semantics are tracked in #648.
  AddPermission:
    status: intentionally_partial
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_AddPermission.html
      - https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html
    protocol: REST JSON; POST /2015-03-31/functions/{FunctionName}/policy; 201 with serialized Statement
    tests:
      - tests/integration/lambda/policy_test.go::TestFunctionPolicy_AddGetRemoveLifecycle
      - tests/integration/cloudformation/lambda_properties_test.go::TestCreateAndDeleteStack_LambdaPermissionMutatesFunctionPolicy
    scenarios:
      resource_policy_statement:
        status: fixed
        evidence: AddPermission atomically stores validated AWS-shaped Allow statements, enforces policy size and RevisionId preconditions, and validates qualified targets. Policy authorization during invocation remains tracked in #629, so the capability is reported unsupported.
      required_statement_id:
        status: fixed
        evidence: An omitted StatementId returns an InvalidParameterValueException HTTP 400 required-member message; an explicitly empty StatementId returns the distinct minimum-length validation message. Constraint semantics come from the AWS model; exact service-rendered text is not published and remains unverified.
        tests:
          - tests/integration/lambda/validation_review_test.go::TestAddPermission_missingStatementID
          - tests/integration/lambda/validation_review_test.go::TestAddPermission_emptyStatementID
      exact_required_statement_id_text:
        status: blocked
        gap: The AWS model marks StatementId required with length 1..100, but exact service-rendered omission and empty-string messages need a permitted real-AWS capture before they can be claimed exact.
  GetPolicy:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_GetPolicy.html
    protocol: REST JSON; GET /2015-03-31/functions/{FunctionName}/policy; Policy is a JSON document serialized as a string
    tests:
      - tests/integration/lambda/policy_test.go::TestFunctionPolicy_AddGetRemoveLifecycle
      - tests/integration/cloudformation/lambda_properties_test.go::TestCreateAndDeleteStack_LambdaPermissionMutatesFunctionPolicy
  RemovePermission:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_RemovePermission.html
    protocol: REST JSON; DELETE /2015-03-31/functions/{FunctionName}/policy/{StatementId}; 204
    tests:
      - tests/integration/lambda/policy_test.go::TestFunctionPolicy_AddGetRemoveLifecycle
      - tests/integration/cloudformation/lambda_properties_test.go::TestCreateAndDeleteStack_LambdaPermissionMutatesFunctionPolicy
  CreateEventSourceMapping:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_CreateEventSourceMapping.html
      - https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-parameters.html
      - https://docs.aws.amazon.com/lambda/latest/dg/services-ddb-params.html
    protocol: REST JSON; POST /2015-03-31/event-source-mappings; 202
    tests:
      - tests/integration/lambda/esm_validation_test.go::TestCreateEventSourceMapping_batchSizeDefaultsBySource
      - tests/integration/lambda/esm_validation_test.go::TestCreateEventSourceMapping_batchSizeModelBounds
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_sqsBatchSizeRequiresBatchWindow
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_dynamoDBBatchSizeRequiresBatchWindow
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_sqsFIFOBatchSizeMaximum
      - tests/integration/lambda/tags_test.go::TestCreateEventSourceMapping_StoresTags
      - tests/integration/lambda/tags_test.go::TestCreateEventSourceMapping_TagsSurviveRestart
      - tests/integration/cloudformation/lambda_esm_tags_test.go::TestCreateStack_LambdaEventSourceMappingCarriesStackTags
    scenarios:
      create_time_tags:
        status: fixed
        evidence: The Tags map is stored in the mapping's own tag namespace and read back through ListTags; EventSourceMappingConfiguration keeps AWS's shape and does not echo them. This is the ordinary CloudFormation path — a stack deployed with `--tags` merges them into every mapping — and refusing it previously failed every such deploy with a 501.
      source_specific_batch_defaults:
        status: fixed
        evidence: Omitted BatchSize defaults to 10 for SQS and 100 for DynamoDB Streams; explicit zero and negative values are rejected rather than treated as omission.
      batch_size_bounds:
        status: fixed
        evidence: The modeled 1..10000 bounds, SQS FIFO maximum 10, and the stream/SQS explicit-batch window coupling are enforced before persistence.
      batching_window_bounds:
        status: fixed
        evidence: MaximumBatchingWindowInSeconds enforces the modeled 0..300 range on create and update, including non-mutation after rejected updates.
      explicit_batch_window_invariant:
        status: fixed
        evidence: Persisted internal metadata distinguishes an explicitly configured batch above 10 from DynamoDB's omitted default of 100, so later window-only updates preserve the AWS constraint without rejecting the valid default combination.
      exact_batch_window_error_text:
        status: blocked
        gap: Constraint behavior is documented and the current wording matches a publicly reported CloudFormation-surfaced Lambda response, but exact direct-API text needs a permitted real-AWS capture before it can be claimed exact.
      exact_fifo_error_text:
        status: blocked
        gap: AWS documents the FIFO maximum of 10 but does not publish the service-side validation message; the current AWS-shaped InvalidParameterValueException text needs a permitted real-AWS capture before it can be claimed exact.
      fifo_batching_window:
        status: fixed
        evidence: Nonzero MaximumBatchingWindowInSeconds is rejected for SQS FIFO mappings on create and update, as documented by AWS; rejected updates do not mutate persisted state.
      exact_fifo_batching_window_error_text:
        status: blocked
        gap: AWS documents that FIFO batching windows are unsupported but does not publish the service-side validation message; exact text needs a permitted real-AWS capture.
  UpdateEventSourceMapping:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_UpdateEventSourceMapping.html
    protocol: REST JSON; PUT /2015-03-31/event-source-mappings/{UUID}; 202
    tests:
      - tests/integration/lambda/esm_validation_test.go::TestUpdateEventSourceMapping_batchSizeModelBounds
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_sqsBatchSizeRequiresBatchWindow
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_dynamoDBBatchSizeRequiresBatchWindow
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_sqsFIFOBatchSizeMaximum
    scenarios:
      batch_size_validation:
        status: fixed
        evidence: Update rejects explicit zero, negative, above-model-maximum, FIFO-over-10, stream/SQS batch-over-10-without-window, invalid window bounds, and FIFO nonzero windows with HTTP 400 before mutation.
  Invoke:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/dg/chapter-layers.html
      - https://docs.aws.amazon.com/lambda/latest/dg/adding-layers.html
      - https://docs.aws.amazon.com/lambda/latest/dg/with-secrets-manager.html
    protocol: REST JSON; POST /2015-03-31/functions/{FunctionName}/invocations
    tests:
      - go test -count=1 -run TestInvokeLayerCheck_foreignAccountCachedLayer ./internal/services/lambda
    scenarios:
      foreign_account_cached_layer:
        status: fixed
        evidence: Invoke-time layer validation now accepts foreign-account AWS-managed/third-party layer ARNs when the documented layer cache contains the layer zip, allowing the container layer injector to resolve the same cached content.
      missing_layer:
        status: reviewed
        evidence: Missing same-account layer metadata and uncached foreign-account layer ARNs still return a Lambda init-style layer version not found error before container startup.
      parameters_and_secrets_extension_cache:
        status: reviewed
        evidence: internal/services/lambda/container_runtime_test.go verifies that Lambda containers receive AWS_ENDPOINT_URL_SECRETS_MANAGER and local session credentials. The AWS extension binary owns its process-local cache and SECRETS_MANAGER_TTL; Overcast adds no cache in front of GetSecretValue, and a new Lambda container starts a new extension process.
      docker_unavailable_fallback:
        status: fixed
        evidence: "#162: when Docker is unavailable, nodeRuntimeInstance.Invoke (node_runtime.go ~99-112) answers 200 with X-Amz-Function-Error: Unhandled and a body of {\"errorMessage\":\"...\",\"errorType\":\"Runtime.DockerUnavailable\"}, matching AWS's shape for a runtime error rather than a bare 5xx. Pinned by internal/services/lambda/docker_verdict_test.go and documented at docs/services/lambda.md's \"Real execution requires Docker\" callout."
findings:
  fixed:
    - Lambda resource-policy AddPermission, GetPolicy, and RemovePermission support race-safe AWS::Lambda::Permission create/delete orchestration; AddPermission remains reported unsupported until invocation authorization is enforced (#629).
    - CreateFunction and UpdateFunctionCode/Configuration preserve Architectures, VpcConfig including Ipv6AllowedForDualStack, ImageConfig, and FileSystemConfigs.
    - PutFunctionConcurrency rejects negative ReservedConcurrentExecutions with InvalidParameterValueException instead of storing an invalid throttle limit.
    - GetFunctionConcurrency answers 200 with an empty body for a function that has no reservation, as AWS does, rather than 404 ResourceNotFoundException; a reservation of 0 is still reported, so "switched off" stays distinguishable from "unset". Tests in tests/integration/lambda/reserved_concurrency_test.go.
    - DeadLetterConfig is accepted by CreateFunction and UpdateFunctionConfiguration and acted on: a failed asynchronous invocation is delivered to the target SQS queue or SNS topic with the original event as the body and AWS's RequestID/ErrorCode/ErrorMessage message attributes.
    - "#162: when Docker is unavailable, Invoke answers 200 with X-Amz-Function-Error: Unhandled and a Runtime.DockerUnavailable error body instead of an unmodeled failure, pinned by docker_verdict_test.go and documented on the service page. The operation_count_estimate was also corrected from \"51 tracked; 49 supported, 2 unsupported\" to the actual 62 tracked (59 supported, 2 partial, 1 unsupported)."
    - "#1960: GetFunction and GetFunctionConfiguration honour the Qualifier query parameter (and an embedded name:qualifier), resolving a version number, an alias, or $LATEST, with ResourceNotFoundException for an unknown one; previously only DeleteFunction read it, so a qualified GetFunction/GetFunctionConfiguration silently answered $LATEST."
    - "#1959: PublishVersion refuses PublishTo with 501 before mutation, matching CreateFunction's gate, and no longer allocates a new version when the function's code and configuration are unchanged since the highest existing version — it returns that version instead, as AWS documents. RevisionId and CodeSha256 are now checked as preconditions first (PreconditionFailedException and InvalidParameterValueException respectively)."
  remaining_gaps:
    - UpdateFunctionCode's Publish/PublishTo still return 501; the version snapshot CreateFunction and PublishVersion share (newFunctionVersion, publishVersion) makes Publish there a small follow-up.
    - "#161: review runtime invocation fidelity, error shapes, layers, and event source mappings (medium-sized audit, not currently in flight)."
    - PutFunctionEventInvokeConfig is not implemented, so MaximumRetryAttempts and MaximumEventAgeInSeconds cannot be changed from AWS's defaults and an async event is never aged out; its on-failure/on-success destinations are still not applied outside event source mappings.
    - Implement S3 Files execution-environment mounts (#647) and close the remaining exact-wire capture questions (#648).
  intentionally_partial:
    - Resource policies are stored and observable but are not an authorization boundary for invocation.
handoff:
  start_with: [UpdateFunctionCode Publish=true, Invoke, event source mappings]
  do_not_redo: [CreateFunction required fields, CreateFunction PackageType/Image Runtime validation, CreateFunction Timeout/MemorySize/Architectures/VpcConfig/ImageConfig/FileSystemConfigs validation and storage, CreateFunction Publish=true, CreateFunction advanced optional configuration member review, AddPermission/GetPolicy/RemovePermission basic policy lifecycle]
  commands:
    - go test -count=1 -run 'TestCreateFunction_' ./tests/integration/lambda/...
    - go test -count=1 ./internal/services/lambda/...
    - go vet ./internal/services/lambda/... ./tests/integration/lambda/... ./tests/integration/lambdadocker/...
