findings:
  fixed:
    - scenario: AWS::Route53::RecordSet preserves AliasTarget when provisioning through CloudFormation.
      evidence:
        aws_docs: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-route53-recordset.html
        tests: tests/integration/cloudformation/cloudformation_test.go::TestCreateStack_Route53RecordSetAliasTarget
      fixed_in: 0.0.1-alpha.8
    - "#170 (protocol): every Route 53 operation in internal/awsapi/manifest.gen.go is ProtocolRESTXML; the tracker's protocols: [rest_xml, query] was wrong to include query. Route 53 has no Query-API wire binding — removed. The WriteQueryXMLError helper name (internal/services/route53/handler_zones.go) names the error envelope shape, not a second protocol; the operations themselves are all REST XML."
    - "#2004 (record value validation): ChangeResourceRecordSets accepted any value for any record type — an A record whose value was not a dotted quad, an AAAA holding an IPv4 address, a CNAME with two values. validateRecordValues (core.go) now checks each value against its type and answers InvalidChangeBatch in AWS's \"Invalid Resource Record: FATAL problem: <code> (<reason>) encountered with '<value>'\" form. The ARRDATAIllegalIPv4Address and AAAARRDATAIllegalIPv6Address codes are AWS's own; the rest follow its shape, which is the approximation docs/services/route53/limitations.md already records."
    - "#171 (pagination): ListHostedZones and ListHealthChecks implement Marker/NextMarker/IsTruncated (handler_zones.go ~192-213, handler_health.go ~91-114); ListResourceRecordSets implements NextRecordName/NextRecordType/NextRecordIdentifier (handler_rrsets.go ~144-181). All three are covered by tests/integration/route53/zones_lifecycle_test.go, healthchecks_test.go and rrsets_validation_test.go. The tracker's \"Review pagination and marker semantics\" gap is resolved; markers already work."
  remaining_gaps: []
  intentionally_partial:
    - "GetChange on an unknown change ID answers INSYNC rather than NoSuchChange — intentional, documented in docs/services/route53/limitations.md, so CDK and CLI waiters converge even across a store reset."
    - GetHealthCheckStatus, GetHealthCheckLastFailureReason, CreateTrafficPolicy, AssociateVPCWithHostedZone, DisassociateVPCFromHostedZone and ListHostedZonesByVPC are not implemented; health checks are metadata-only (nothing is ever probed) and traffic policies/VPC associations are out of scope.
handoff:
  start_with: [Value grammars for the unmodeled types (NAPTR, DS, TLSA, SSHFP, SVCB, HTTPS), if a caller ever needs them]
  do_not_redo:
    [CreateHostedZone, ListHostedZones, ListHostedZonesByName, GetHostedZone, GetHostedZoneCount,
     UpdateHostedZoneComment, DeleteHostedZone, ChangeResourceRecordSets, ListResourceRecordSets,
     GetChange, ChangeTagsForResource, ListTagsForResource, ListTagsForResources, CreateHealthCheck,
     GetHealthCheck, ListHealthChecks, GetHealthCheckCount, UpdateHealthCheck, DeleteHealthCheck]
  commands: [go test -count=1 ./internal/services/route53/... ./tests/integration/route53/...]
