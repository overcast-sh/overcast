service: route53
status: in_progress
priority: p2
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-20
protocols: [rest_xml]
implementation: [internal/services/route53]
integration_tests: [tests/integration/route53]
capability_docs: docs/services/route53.md
operation_count_estimate: >-
  25 tracked (internal/services/route53/capabilities_dev.go): 19 supported, 6 unsupported
  (GetHealthCheckStatus, GetHealthCheckLastFailureReason, CreateTrafficPolicy,
  AssociateVPCWithHostedZone, DisassociateVPCFromHostedZone, ListHostedZonesByVPC). The tracker
  previously said "10 tracked; 7 supported, 3 unsupported", which undercounted both halves; the
  actual figure matches docs/services/route53.md's "19 of 25 listed operations are implemented".
current_support_level: >-
  Hosted zones, resource record sets, change status, tags and health checks are supported;
  traffic policies and VPC associations are not. Pagination (Marker/NextMarker/IsTruncated for
  ListHostedZones/ListHealthChecks, NextRecordName/NextRecordType/NextRecordIdentifier for
  ListResourceRecordSets) is implemented and tested.
