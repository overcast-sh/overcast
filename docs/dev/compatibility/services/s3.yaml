operation_count_estimate: 61 registered; 53 supported, 8 unsupported
current_support_level: Broad core S3 support; ACL, select, restore, and optional bucket-configuration fields remain incomplete.
operations:
  ListObjectsV2:
    status: reviewed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjects.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_test.go::TestListObjectsV2_empty
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withObjects
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withPrefix
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withDelimiter_collapsesPrefixes
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withDelimiterAndPrefix_drillsIntoFolder
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withDelimiterAndPrefix_listsLeafObjects
      - tests/integration/s3/s3_test.go::TestListObjectsV2_bucketNotFound
      - tests/integration/s3/s3_test.go::TestListObjectsV2_maxKeys_truncatesResult
      - tests/integration/s3/s3_test.go::TestListObjectsV2_continuationToken_resumesFromCorrectKey
      - tests/integration/s3/s3_test.go::TestListObjectsV2_continuationToken_lastPage_isNotTruncated
      - tests/integration/s3/s3_test.go::TestListObjectsV2_startAfter
      - tests/integration/s3/s3_test.go::TestListObjectsV2_invalidContinuationToken_returnsInvalidArgument
      - tests/integration/s3/s3_test.go::TestListObjectsV2_delimiterHeavyBucket_paginationWalkMatchesFullListing
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_maxKeysZero_returnsEmptyUntruncatedPage
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_maxKeysNegative_returnsInvalidArgument
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_maxKeysNonNumeric_returnsInvalidArgument
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_maxKeysAboveInt32Range_returnsInvalidArgument
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_maxKeysAbovePageLimit_clampsToOneThousand
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_maxKeysOmitted_defaultsToOneThousand
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_encodingTypeURL_percentEncodesKeysAndPrefixes
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_encodingTypeURL_percentEncodesPrefixDelimiterAndStartAfter
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_encodingTypeOmitted_returnsRawKeysAndNoEncodingType
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_encodingTypeInvalid_returnsInvalidArgument
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_fetchOwnerTrue_includesOwnerPerKey
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_fetchOwnerOmitted_omitsOwner
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_fetchOwnerFalse_omitsOwner
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_requestPayerHeader_isAcceptedAndNotCharged
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_optionalObjectAttributes_isAcceptedAndOmitsRestoreStatus
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjectsV2_continuationTokenWithStartAfter_tokenSetsPosition
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjects_maxKeysZero_returnsEmptyUntruncatedPage
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjects_maxKeysInvalid_returnsInvalidArgument
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjects_encodingTypeURL_percentEncodesKeysAndPrefixes
      - tests/integration/s3/s3_list_objects_params_test.go::TestListObjects_encodingTypeInvalid_returnsInvalidArgument
      - tests/integration/s3/s3_expected_bucket_owner_test.go
    evidence: >-
      The API reference Errors section lists only NoSuchBucket, so parameter
      validation was cross-checked against the two suites whose expectations are
      verified against real S3: Ceph s3-tests (test_bucket_listv2_maxkeys_zero,
      test_bucket_list_maxkeys_invalid, test_bucket_listv2_encoding_basic,
      test_bucket_listv2_fetchowner_*, and
      test_bucket_listv2_both_continuationtoken_startafter) and Versity's
      conformance suite (ListObjectsV2_exceeding_max_keys, which sends
      max-keys=233453333 and asserts MaxKeys == 1000). Ceph RGW and OpenStack
      Swift's s3api corroborate the InvalidArgument messages, which the AWS
      reference does not print.
    scenarios:
      - name: default empty bucket
        status: tested and matching AWS docs
      - name: lexicographic object listing
        status: tested and matching AWS docs
      - name: prefix filtering
        status: tested and matching AWS docs
      - name: delimiter common-prefix grouping and KeyCount
        status: tested and matching AWS docs
        notes: >-
          A rolled-up CommonPrefix counts as one entry against MaxKeys and
          KeyCount, per "All of the keys that roll up into a common prefix count
          as a single return".
      - name: missing bucket
        status: tested and matching AWS docs
      - name: max-keys truncation and continuation-token pagination
        status: tested and matching AWS docs for claimed opaque-token support
      - name: max-keys omitted defaults to 1000
        status: tested and matching AWS docs
      - name: max-keys=0 returns an empty untruncated page
        status: fixed
        notes: >-
          Previously a 500 - the handler sliced the page to empty and then
          indexed entries[len-1] to build NextContinuationToken.
      - name: max-keys negative
        status: fixed
        notes: >-
          Previously a 500 from a negative slice bound; now InvalidArgument/400
          ("Argument max-keys must be an integer between 0 and 2147483647").
      - name: max-keys non-numeric or beyond int32
        status: fixed
        notes: >-
          Previously replaced silently by the 1000 default; now
          InvalidArgument/400 ("Provided max-keys not an integer or within
          integer range").
      - name: max-keys above 1000 clamps and echoes the clamped MaxKeys
        status: fixed
      - name: max-keys supplied but empty
        status: intentionally_partial
        gap: >-
          Treated as omitted. Swift rejects it and Ceph defaults it, the AWS
          reference does not say, and no SDK emits it, so Overcast keeps the
          permissive reading its other query helpers use.
      - name: start-after filtering and response echo
        status: tested and matching AWS docs
      - name: continuation-token precedence over start-after
        status: tested and matching AWS docs
        notes: The token decides the page position and StartAfter is still echoed.
      - name: malformed continuation-token
        status: tested and matching AWS docs
        notes: InvalidArgument/400 rather than a silent restart from page 1.
      - name: continuation-token or start-after supplied but empty
        status: intentionally_partial
        gap: >-
          An explicitly empty value is treated as absent, so the element is
          omitted from the response where real S3 echoes an empty one.
          ContinuationToken and StartAfter are omitempty strings, not pointers.
      - name: encoding-type=url percent-encoding
        status: fixed
        notes: >-
          Key, Prefix, Delimiter, StartAfter and CommonPrefixes are
          percent-encoded over UTF-8 with "/" left literal, and EncodingType is
          echoed. Matches s3-tests exactly - "+" to %2B, space to %20, Delimiter
          "/" unchanged. ContinuationToken and NextContinuationToken are not
          encoded, matching what the SDKs decode.
      - name: encoding-type with an unsupported value
        status: fixed
        notes: InvalidArgument/400, "Invalid Encoding Method specified in Request".
      - name: encoding-type letter case
        status: intentionally_partial
        gap: >-
          Only the lowercase "url" the model documents is accepted. Ceph RGW
          compares case-insensitively; real S3 is unverified, so Overcast is the
          stricter of the two.
      - name: fetch-owner owner elements
        status: fixed
        notes: >-
          fetch-owner=true adds Owner (the single Overcast account) to each
          entry; absent by default and for fetch-owner=false. Any value other
          than "true" reads as false, since AWS documents no error for a
          non-boolean.
      - name: ListObjects v1 per-object Owner
        status: intentionally_partial
        gap: >-
          Real ListObjects returns Owner on every entry with no opt-in. Overcast
          omits it there; only ListObjectsV2's fetch-owner is implemented.
      - name: request-payer and request-charged
        status: intentionally_partial
        gap: >-
          x-amz-request-payer is accepted and ignored and x-amz-request-charged
          is never returned, which is correct for a bucket that is not Requester
          Pays. Requester Pays itself is unsupported - Get/PutBucketRequestPayment
          return 501 - so no bucket here can be one.
      - name: optional-object-attributes RestoreStatus
        status: intentionally_partial
        gap: >-
          x-amz-optional-object-attributes is accepted and no RestoreStatus
          element is produced, which matches AWS for an object that was never
          restored. RestoreObject is unimplemented, so no object here can have
          one.
      - name: ChecksumAlgorithm and ChecksumType on Contents
        status: intentionally_partial
        gap: >-
          The Object shape carries both; Overcast returns Key, LastModified,
          ETag, Size, StorageClass and, with fetch-owner, Owner only.
      - name: x-amz-expected-bucket-owner
        status: tested and matching AWS docs
        notes: >-
          Enforced by the shared guard in expected_owner.go, covered by
          s3_expected_bucket_owner_test.go.
      - name: InvalidArgument ArgumentName and ArgumentValue elements
        status: intentionally_partial
        gap: >-
          Real S3 returns ArgumentName and ArgumentValue alongside Code and
          Message. protocol.AWSError carries no fields for them, so every S3
          InvalidArgument in Overcast omits both; widening the shared error type
          is out of this review's scope.
      - name: directory buckets, access points, and S3 on Outposts
        status: unsupported
        gap: >-
          Overcast serves general purpose bucket paths only. It has no S3 Express
          zonal endpoint, so the directory-bucket differences the reference calls
          out - non-lexicographic ordering, in-progress-multipart prefixes in
          CommonPrefixes, "/" as the only delimiter, prefixes required to end in
          a delimiter, no start-after, and the bucket owner returned as every
          object's owner - are recorded rather than emulated.
    findings:
      fixed:
        - start-after was ignored and StartAfter was omitted from successful responses.
        - max-keys=0 and any negative max-keys returned 500 InternalError from a slice panic (#172).
        - A non-numeric or out-of-int32 max-keys was silently replaced by the 1000 default, and a value above 1000 was honoured verbatim (#172).
        - encoding-type=url and fetch-owner were accepted and ignored (#173).
      remaining_gaps:
        - Per-object ChecksumAlgorithm and ChecksumType are not returned.
        - ListObjects v1 does not return the per-object Owner AWS always includes.
        - An explicitly empty continuation-token, start-after or max-keys is treated as absent rather than echoed or validated.
        - InvalidArgument responses omit the ArgumentName and ArgumentValue elements real S3 returns.
  PutBucketTagging:
    status: reviewed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketTagging.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketTagging.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketTagging.html
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/CostAllocTagging.html
    implementation:
      - internal/services/s3/handler_tagging.go
    tests:
      - tests/integration/s3/s3_test.go::TestPutBucketTagging_success
      - tests/integration/s3/s3_test.go::TestGetBucketTagging_success
      - tests/integration/s3/s3_test.go::TestGetBucketTagging_noTags
      - tests/integration/s3/s3_test.go::TestDeleteBucketTagging_success
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestPutBucketTagging_emptyTagSet_clearsTagSet
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestPutBucketTagging_duplicateKeys_returnsInvalidTag
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestPutBucketTagging_tagKeyOutOfRange_returnsInvalidTag
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestPutBucketTagging_tagValueLength
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestPutBucketTagging_tagCountLimit
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestPutObjectTagging_limits
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestBucketSubresources_noSuchBucket
    evidence: >-
      Limits come from the S3 User Guide's cost-allocation tag page - "A tag set
      can contain as many as 50 tags, or it can be empty. Keys must be unique
      within a tag set", a key of "1 to 128 Unicode characters", a value of "0
      to 256 Unicode characters". The API reference names InvalidTag as one of
      PutBucketTagging's special errors without printing messages; the message
      text and the BadRequest code for the count limit come from Versity's AWS
      conformance suite.
    scenarios:
      - name: tag set round trip
        status: tested and matching AWS docs
      - name: empty tag set clears the tag set
        status: tested and matching AWS docs
        notes: GetBucketTagging then answers NoSuchTagSet, the untagged state.
      - name: duplicate tag keys
        status: fixed
        notes: >-
          Previously collapsed into a map, keeping the last value; now
          InvalidTag/400 ("Cannot provide multiple Tags with the same key").
      - name: tag key outside 1-128 characters
        status: fixed
        notes: InvalidTag/400. Counted in runes, as AWS counts Unicode characters.
      - name: tag value over 256 characters
        status: fixed
        notes: InvalidTag/400. An empty value stays legal.
      - name: more than 50 bucket tags or 10 object tags
        status: fixed
        notes: BadRequest/400, not InvalidTag - no individual tag is at fault.
      - name: missing bucket
        status: tested and matching AWS docs
      - name: tag character set
        status: intentionally_partial
        gap: >-
          The only place AWS writes the allowed character set down is the S3
          Control Tag shape's pattern, so the character set is not validated
          rather than approximated from a different service's model.
      - name: ABAC-enabled buckets
        status: unsupported
        gap: >-
          AWS refuses PutBucketTagging and DeleteBucketTagging once ABAC is
          enabled on a bucket and requires TagResource/UntagResource instead.
          Overcast implements neither ABAC nor S3 Control tagging.
      - name: Content-MD5 and x-amz-sdk-checksum-algorithm
        status: intentionally_partial
        gap: The integrity headers are accepted and not verified for this operation.
    findings:
      fixed:
        - A tag set repeating a key silently kept the last value; the 50/10 tag counts and the key and value length limits were unchecked (#175).
      remaining_gaps:
        - Tag character set is not validated.
        - ABAC and the S3 Control TagResource/UntagResource path are unimplemented.
  PutBucketPolicy:
    status: reviewed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketPolicy.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketPolicy.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketPolicy.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_test.go::TestPutBucketPolicy_success
      - tests/integration/s3/s3_test.go::TestPutBucketPolicy_noSuchBucket
      - tests/integration/s3/s3_test.go::TestPutBucketPolicy_emptyBody
      - tests/integration/s3/s3_test.go::TestGetBucketPolicy_success
      - tests/integration/s3/s3_test.go::TestGetBucketPolicy_noPolicySet
      - tests/integration/s3/s3_test.go::TestGetBucketPolicy_noSuchBucket
      - tests/integration/s3/s3_test.go::TestDeleteBucketPolicy_success
      - tests/integration/s3/s3_test.go::TestDeleteBucketPolicy_noPolicySet
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestPutBucketPolicy_notJSON_returnsMalformedPolicy
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestPutBucketPolicy_replacesPreviousPolicy
      - tests/integration/s3/s3_cdk_bootstrap_test.go::TestCDKBootstrapBucket_flow
    scenarios:
      - name: policy round trip, returned as application/json
        status: tested and matching AWS docs
      - name: policy replaced rather than merged
        status: tested and matching AWS docs
      - name: empty, non-JSON or over-20KB body
        status: tested and matching AWS docs
        notes: MalformedPolicy/400.
      - name: missing bucket, and GET with no policy set
        status: tested and matching AWS docs
        notes: NoSuchBucket/404 and NoSuchBucketPolicy/404.
      - name: policy document semantics
        status: intentionally_partial
        gap: >-
          Any syntactically valid JSON is stored. Real S3 rejects a document that
          is not a valid policy - a missing Statement, an unknown Effect, a
          Resource ARN that does not name this bucket - and Overcast neither
          validates nor evaluates the policy, so no request is ever authorised or
          denied by one.
      - name: x-amz-confirm-remove-self-bucket-access
        status: unsupported
        gap: >-
          The header is ignored; with no policy evaluation there is no
          self-lockout to confirm.
      - name: GetBucketPolicyStatus IsPublic
        status: intentionally_partial
        gap: Derived without policy evaluation; tracked separately from this review.
    findings:
      remaining_gaps:
        - Bucket policies are stored and returned but never evaluated, so they authorise nothing.
        - Policy documents are checked for valid JSON only, not for valid policy structure.
  PublicAccessBlock:
    status: unsupported
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutPublicAccessBlock.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetPublicAccessBlock.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeletePublicAccessBlock.html
    implementation:
      - internal/services/s3/handler_stubs.go
    tests:
      - tests/integration/s3/s3_test.go::TestS3_UnimplementedOperations_return501
    scenarios:
      - name: CDK bootstrap staging bucket public-access block
        status: unsupported
        gap: >-
          Put/Get/DeletePublicAccessBlock return 501. The CDK bootstrap template
          sets all four settings to true on its staging bucket; CloudFormation
          accepts that shape and stores nothing, so a bootstrap succeeds, but a
          client calling the S3 API directly gets an honest 501 rather than a
          configuration Overcast would not enforce. Enforcing it needs ACL and
          policy evaluation, neither of which exists.
  PutBucketVersioning:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketVersioning.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_test.go::TestPutBucketVersioning_enable
      - tests/integration/s3/s3_test.go::TestPutBucketVersioning_suspend
      - tests/integration/s3/s3_bucket_configuration_test.go::TestPutBucketVersioning_invalidStatusReturnsMalformedXML
      - tests/integration/s3/s3_versioning_test.go::TestVersioningSuspended_writesTheNullVersion
      - tests/integration/s3/s3_versioning_test.go::TestVersioningEnabled_afterObjectsExistTreatsThemAsNullVersions
      - tests/integration/cloudformation/s3_bucket_properties_test.go
    scenarios:
      - name: enabled and suspended state
        status: fixed
        notes: >-
          Enabled mints a version id per write; Suspended keeps existing versions,
          writes the single null version, and still creates a null-id delete marker
          on delete. Objects stored before the bucket was versioned become their
          key's null version (#645).
      - name: invalid status enum
        status: fixed
        notes: Values outside Enabled and Suspended return the S3 REST-XML MalformedXML schema-validation error and are not persisted.
  ListObjectVersions:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectVersions.html
    implementation:
      - internal/services/s3/handler_versions.go
      - internal/services/s3/version.go
    tests:
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_orderIsKeyThenRecency
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_paginatesByKeyAndVersion
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_interleavesDeleteMarkers
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_delimiterCollapsesToCommonPrefixes
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_versionIdMarkerWithoutKeyMarker
      - tests/integration/s3/s3_test.go::TestListObjectVersions_nonVersionedBucket
    scenarios:
      - name: ordering
        status: fixed
        notes: Keys ascending, then versions most recently stored first, with Version and DeleteMarker elements interleaved.
      - name: key-marker and version-id-marker pagination
        status: fixed
        notes: >-
          Markers resume the scan without duplicating or dropping entries. A
          version-id-marker without a key-marker, or one naming no version of the
          marker key, returns InvalidArgument.
      - name: encoding-type=url
        status: unsupported
        gap: Response values are never URL-encoded, matching ListObjectsV2's existing gap.
  GetObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html
    implementation:
      - internal/services/s3/handler_object.go
    tests:
      - tests/integration/s3/s3_test.go::TestGetObject_missingBucketReturnsNoSuchBucket
      - tests/integration/s3/s3_test.go::TestGetObject_notFound
    scenarios:
      - name: read against a bucket that does not exist
        status: fixed
        notes: >-
          readTarget's unversioned branch called store.getObjectMeta directly — a
          single composite-key lookup that cannot distinguish "no such bucket" from
          "no such key in an existing bucket" — so both answered NoSuchKey. Real
          AWS (confirmed against real AWS in #1635's own repro, and matched by
          floci, kumo and ministack) answers NoSuchBucket. Fixed via a new
          readObjectMeta helper that checks the bucket first, mirroring what
          resolveVersion already did for the ?versionId= path. Shared by
          HeadObject (readTarget), GetObjectTagging and CopyObject's source
          lookup — see those operations below.
      - name: read of a missing key in an existing bucket
        status: fixed
        notes: Unaffected by the fix — still NoSuchKey (regression-tested).
      - name: Range header — which values are a 416 and which are ignored
        status: reviewed
        tests:
          - tests/integration/s3/s3_object_read_headers_test.go::TestGetObject_rangeOutcomes
        notes: >-
          Measured against real S3 on 2026-09-06 with user approval, using the
          anonymously readable 136-byte object
          s3://1000genomes/README_phase3_alignments_sequence_20150526. Only a
          well-formed range overlapping none of the object is a 416: bytes=abc
          (unparseable), bytes=1-0 and bytes=15-1 (end before start) and
          items=1-2 (unknown unit) all return 200 with the whole object;
          bytes=500-600 past the end and bytes=-0 return 416; a suffix longer
          than the object (bytes=-999999) returns 206 for the whole object.
          Overcast matches every case. floci and ministack both answer 416 for
          the four ignored forms, so the sibling emulators are not evidence
          here — see looks-like-a-bug.md.
      - name: the 416 response shape
        status: fixed
        tests:
          - tests/integration/s3/s3_object_read_headers_test.go::TestGetObject_unsatisfiableRangeIsAWellFramedInvalidRange
        notes: >-
          Same 2026-09-06 transcript. Real S3 sends NO Content-Range header on a
          416 — contradicting RFC 9110 §15.5.17's SHOULD, and contradicting
          #1705's acceptance criteria, which required one — and its InvalidRange
          document carries RangeRequested and ActualObjectSize (plus HostId).
          #1864 removed the header and added both members via a new optional
          AWSError.XMLDetails on the shared REST-XML envelope; every other XML
          error stays byte-identical, pinned by
          internal/protocol/errors_test.go::TestWriteXMLError_detailsAreOptionalAndOrdered.
  HeadObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_HeadObject.html
    implementation:
      - internal/services/s3/handler_object.go
    tests:
      - tests/integration/s3/s3_test.go::TestHeadObject_bucketNotFound
      - tests/integration/s3/s3_test.go::TestHeadObject_existingBucketMissingKeyReturnsNotFound
    scenarios:
      - name: read against a bucket that does not exist
        status: fixed
        notes: >-
          Shares readTarget's unversioned branch with GetObject, so the same
          internal fix applies (#1635). Wire-invisible for HEAD specifically:
          AWS's own HeadObject reference says a HEAD error is always a generic,
          bodyless status code and "it's not possible to retrieve the exact
          exception" — Overcast sets no x-amz-error-code or similar header
          either — so both the missing-bucket and missing-key-in-an-existing-
          bucket cases were and remain HTTP 404 with no body on the wire. Tests
          pin that pair down at the status-code level; the operation's own
          error-code correctness is verified through GetObject instead, since
          that is where it is observable.
  GetObjectTagging:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObjectTagging.html
    implementation:
      - internal/services/s3/handler_tagging.go
    tests:
      - tests/integration/s3/s3_test.go::TestGetObjectTagging_missingBucketReturnsNoSuchBucket
      - tests/integration/s3/s3_test.go::TestGetObjectTagging_missingKeyInExistingBucketReturnsNoSuchKey
    scenarios:
      - name: tagging read against a bucket that does not exist
        status: fixed
        notes: currentObjectForTagging called store.getObjectMeta directly with the same NoSuchKey-for-everything defect as GetObject; now routed through readObjectMeta (#1635). PutObjectTagging and DeleteObjectTagging share currentObjectForTagging and are corrected as a side effect.
  CopyObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_CopyObject.html
    implementation:
      - internal/services/s3/handler_object.go
    tests:
      - tests/integration/s3/s3_test.go::TestCopyObject_missingSourceBucket
      - tests/integration/s3/s3_test.go::TestCopyObject_missingSourceKey
    scenarios:
      - name: source bucket does not exist
        status: fixed
        notes: >-
          The source lookup called store.getObjectMeta(srcBucket, srcKey)
          directly, never checking srcBucket — which is independent of destBucket
          and was already resolved separately — so a missing source bucket
          answered NoSuchKey. AWS's CopyObject reference does not enumerate
          NoSuchBucket/NoSuchKey in its own Errors section (it lists only
          ObjectNotInActiveTierError), consistent with GetObject's reference page
          also omitting an Errors section — S3's generic-error set is evidently
          not restated per operation. Fixed on tier 2/3 evidence: the identical
          mechanism already confirmed for GetObject, applied via the same
          readObjectMeta helper.
      - name: destination bucket does not exist
        status: fixed
        notes: Already correct — CopyObject resolves destBucket via getBucket before doing anything else, so it already answered NoSuchBucket. Unaffected by this change.
      - name: source key missing in an existing source bucket
        status: fixed
        notes: Unaffected by the fix — still NoSuchKey (regression-tested, pre-existing test).
      - name: copy onto itself with MetadataDirective REPLACE
        status: fixed
        notes: >-
          The documented way to change an existing object's metadata. The copy
          opened the destination body path for writing — the source's own
          file — before reading the source, so the object came back empty. The
          source is now read in full into a staged file before the destination
          changes (#2192; tests/integration/s3/s3_write_atomicity_test.go).
      - name: copy whose result cannot be recorded
        status: fixed
        notes: The destination keeps the object it had (#2192).
  DeleteObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObject.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObjects.html
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/WhatsNew.html
    implementation:
      - internal/services/s3/handler_object.go
      - internal/services/s3/version.go
      - internal/services/s3/conditional_write.go
    tests:
      - tests/integration/s3/s3_versioning_test.go::TestDeleteObject_versionedBucketCreatesADeleteMarker
      - tests/integration/s3/s3_versioning_test.go::TestDeleteObject_removingADeleteMarkerRestoresTheObject
      - tests/integration/s3/s3_versioning_test.go::TestDeleteObject_versionTargetedDeletePromotesTheNewestSurvivor
      - tests/integration/s3/s3_conditional_delete_test.go
    scenarios:
      - name: delete marker creation
        status: fixed
        notes: A delete with no versionId against a versioned bucket removes nothing and reports x-amz-delete-marker with the marker's version id.
      - name: version-targeted delete
        status: fixed
        notes: Removes exactly that version and promotes the newest survivor when it was current.
      - name: unknown versionId
        status: intentionally_partial
        gap: Treated as idempotent (204) rather than pinned to a modelled error, matching DeleteObject's documented idempotency.
      - name: If-Match on DeleteObject
        status: fixed
        notes: >-
          A mismatched ETag is 412 PreconditionFailed and the object is left in
          place; a literal '*' matches any current ETag, per AWS's documented
          If-Match behaviour for DeleteObject specifically (#2037). Reuses
          conditional_write.go's evaluate(), so a key with no current version
          answers 404 NoSuchKey, and a current version that is itself a delete
          marker counts as "no current version" the same way it does for
          PutObject's If-Match.
      - name: If-Match with a versionId
        status: fixed
        notes: >-
          The condition is checked against the named version's own ETag, not
          against whichever version is current, since that is the version the
          caller asked to remove.
      - name: If-Match against the current version, no versionId given
        status: fixed
        notes: >-
          On a versioning-enabled bucket a plain conditional delete checks the
          current version before creating a delete marker; a mismatch leaves
          the current version live and creates no marker.
      - name: DeleteObjects per-key ETag
        status: fixed
        notes: >-
          Each <Object> entry's <ETag> is DeleteObjects' per-key counterpart to
          If-Match. A mismatch reports that key with a per-key <Error> of code
          PreconditionFailed while the rest of the batch still proceeds; a
          match deletes normally.
      - name: IfMatchLastModifiedTime, IfMatchSize, and DeleteObjects' LastModifiedTime/Size
        status: unsupported
        gap: >-
          AWS documents all four as supported for directory buckets only,
          unlike If-Match/ETag, which the API reference states works for both
          general purpose and directory buckets. Overcast has no S3 Express
          zonal endpoint and serves general purpose bucket paths only, so
          these are not modelled.
  PutObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_CompleteMultipartUpload.html
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/conditional-writes.html
    implementation:
      - internal/services/s3/conditional_write.go
      - internal/services/s3/handler_object.go
      - internal/services/s3/handler_multipart.go
    tests:
      - tests/integration/s3/s3_conditional_write_test.go
      - tests/integration/s3/s3_write_atomicity_test.go
      - internal/services/s3/write_atomicity_test.go
    scenarios:
      - name: upload interrupted over an existing key
        status: fixed
        notes: >-
          AWS: "Amazon S3 never adds partial objects". A body that fails part
          way (client disconnect, in-process producer error) or whose record
          cannot be stored leaves the current object, its record and its version
          history byte-identical, in unversioned, versioning-enabled and
          suspended buckets alike, on both state backends. The body is staged
          and renamed into place; a failed record write restores the previous
          body from a hard link (#2192).
      - name: If-None-Match "*" against an absent key
        status: fixed
        notes: Succeeds with 200, on both PutObject and CompleteMultipartUpload.
      - name: If-None-Match "*" against an existing current object
        status: fixed
        notes: 412 PreconditionFailed, and the stored object is untouched (#1636).
      - name: If-None-Match carrying an entity tag
        status: fixed
        notes: >-
          501 NotImplemented. AWS documents the header as expecting '*' and has no
          entity-tag form of it on the write path; ignoring it is what let a
          conditional write silently overwrite.
      - name: If-Match against the current ETag
        status: fixed
        notes: Succeeds with 200; a stale ETag is 412 PreconditionFailed.
      - name: If-Match against a key with no current version
        status: fixed
        notes: 404 NoSuchKey, per the user guide's "Conditional write behavior" section.
      - name: versioned bucket with a delete marker as current version
        status: fixed
        notes: >-
          Counts as "no current object" — If-None-Match "*" succeeds and If-Match
          answers 404.
      - name: both headers on one request
        status: fixed
        notes: >-
          Both must hold, evaluated If-Match first per RFC 7232 section 6. AWS
          documents no combined form.
      - name: concurrent conditional writers
        status: fixed
        notes: >-
          Exactly one of N racing If-None-Match "*" writes wins; the rest get 412.
          Evaluation and commit are serialised under one per-bucket+key lock.
      - name: 409 ConditionalRequestConflict
        status: intentionally_partial
        gap: >-
          Never returned. AWS uses it for a concurrent delete racing an in-flight
          conditional write inside a distributed store; Overcast evaluates and
          commits under one lock, so that window does not exist.
      - name: CopyObject conditional writes
        status: unsupported
        gap: >-
          AWS accepts If-None-Match and If-Match on CopyObject too; only PutObject
          and CompleteMultipartUpload are covered here (#1678).
  CompleteMultipartUpload:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_CompleteMultipartUpload.html
    implementation:
      - internal/services/s3/handler_multipart.go
    tests:
      - tests/integration/s3/multipart_validation_test.go
      - tests/integration/s3/s3_test.go::TestMultipartUpload_fullCycle
    scenarios:
      - name: part ETag does not match the uploaded part
        status: fixed
        notes: 400 InvalidPart, no object is created and the upload's parts stay staged (#1706).
      - name: part number that was never uploaded
        status: fixed
        notes: 400 InvalidPart.
      - name: parts listed out of ascending order, or a part number repeated
        status: fixed
        notes: 400 InvalidPartOrder, checked over the whole list before any ETag is matched.
      - name: non-final part under 5 MiB
        status: fixed
        notes: >-
          400 EntityTooSmall, enforced at completion rather than UploadPart, which
          is where S3 enforces it. The last part may be any size, so a single
          small part still completes (#1706).
      - name: ETag supplied without its surrounding quotes
        status: fixed
        notes: Matches; ETags are compared with quotes stripped from both sides.
      - name: empty Parts list
        status: fixed
        notes: >-
          400 MalformedXML. The API reference only says "the service sends back an
          HTTP 400 response"; the code is what LocalStack and moto both answer.
      - name: completing an already-completed upload id
        status: fixed
        notes: 404 NoSuchUpload, which the reference documents for an upload that "might have been aborted or completed".
      - name: parts uploaded but omitted from the list
        status: fixed
        notes: Discarded with the rest of the upload's storage once the completion succeeds.
      - name: completion that cannot be recorded
        status: fixed
        notes: The key keeps its current object and the upload stays intact for a retry (#2192).
      - name: error document detail elements
        status: intentionally_partial
        gap: >-
          Real S3 adds ETag, PartNumber and UploadId to InvalidPart, and
          MinSizeAllowed and ProposedSize to EntityTooSmall; protocol.AWSError
          has no fields for them, so the detail lives in Message instead.
  UploadPart:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_UploadPart.html
    implementation:
      - internal/services/s3/handler_multipart.go
    tests:
      - tests/integration/s3/multipart_validation_test.go::TestUploadPart_partNumberOutOfRange
      - tests/integration/s3/multipart_validation_test.go::TestUploadPart_partNumberBoundsAreInclusive
    scenarios:
      - name: partNumber outside 1-10000, or not an integer
        status: fixed
        notes: >-
          400 InvalidArgument. The reference states the range but names no error;
          the code is what LocalStack answers, and the ArgumentName/ArgumentValue
          elements it adds are absent here (see remaining_gaps).
      - name: part under 5 MiB
        status: fixed
        notes: Accepted, as S3 does; the minimum is enforced at CompleteMultipartUpload.
      - name: re-upload of a part number interrupted mid-body
        status: fixed
        notes: The part uploaded before stays in place (#2192).
  PutBucketLifecycleConfiguration:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketLifecycleConfiguration.html
    implementation:
      - internal/services/s3/handler_lifecycle.go
      - internal/services/s3/lifecycle.go
    tests:
      - tests/integration/s3/s3_lifecycle_test.go::TestPutBucketLifecycleConfiguration_transitionDefaultMinimumObjectSizeRoundTrip
      - tests/integration/s3/s3_lifecycle_test.go::TestPutBucketLifecycleConfiguration_transitionDefaultMinimumObjectSizeDefaults
      - tests/integration/s3/s3_lifecycle_test.go::TestPutBucketLifecycleConfiguration_transitionDefaultMinimumObjectSizeIsReplaced
      - tests/integration/s3/s3_lifecycle_test.go::TestPutBucketLifecycleConfiguration_rejectsUnknownTransitionDefaultMinimumObjectSize
      - internal/services/s3/lifecycle_test.go::TestSweepLifecycle_defaultMinimumSizeBlocksSmallTransitions
      - internal/services/s3/lifecycle_test.go::TestSweepLifecycle_variesByStorageClassTransitionsSmallObjectsToGlacier
      - internal/services/s3/lifecycle_test.go::TestSweepLifecycle_variesByStorageClassStillBlocksOtherClasses
      - internal/services/s3/lifecycle_test.go::TestSweepLifecycle_explicitSizeFilterOverridesTheDefaultMinimum
      - tests/integration/cloudformation/s3_bucket_properties_test.go::TestS3BucketProperties_transitionDefaultMinimumObjectSizeDispatchesThroughS3
    scenarios:
      - name: x-amz-transition-default-minimum-object-size round trip
        status: fixed
        notes: >-
          Accepted on Put and echoed on both Put and Get; an omitted header reads
          back as AWS's all_storage_classes_128K default, and a value outside the
          enum returns InvalidArgument without storing anything.
      - name: default minimum applied by the sweeper
        status: fixed
        notes: >-
          Sub-128 KB objects do not transition under all_storage_classes_128K;
          under varies_by_storage_class they transition to GLACIER and
          DEEP_ARCHIVE only. A rule carrying its own ObjectSizeGreaterThan or
          ObjectSizeLessThan filter takes precedence over the default.
  DeleteBucketCors:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketCors.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_bucket_configuration_test.go::TestDeleteBucketCors_removesConfiguration
      - tests/integration/cloudformation/s3_bucket_properties_test.go
    scenarios:
      - name: configured bucket
        status: fixed
        notes: Returns 204 and subsequent GetBucketCors returns NoSuchCORSConfiguration.
  PutBucketNotificationConfiguration:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketNotificationConfiguration.html
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
    implementation:
      - internal/services/s3/handler_notifications.go
      - internal/services/s3/notifications.go
    tests:
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestPutBucketNotificationConfiguration_eventBridgeRoundTrip
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestGetBucketNotificationConfiguration_omitsEventBridgeWhenNotEnabled
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestPutBucketNotificationConfiguration_eventBridgeIsClearedByReplacement
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestPutObject_deliversObjectCreatedToEventBridge
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestDeleteObject_deliversObjectDeletedToEventBridge
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestPutObject_noEventBridgeDeliveryWhenNotConfigured
      - tests/integration/cloudformation/s3_bucket_properties_test.go::TestS3BucketProperties_eventBridgeNotificationDispatchesThroughS3
    scenarios:
      - name: EventBridgeConfiguration round trip
        status: fixed
        notes: >-
          Preserved alongside queue, topic and Lambda destinations; omitted from
          Get when unset, and cleared by a Put that omits it.
      - name: object events reach the default event bus
        status: fixed
        notes: >-
          Object Created and Object Deleted are published through EventBridge's
          own delivery path, so rule matching, input transformers, retries and
          DLQs behave as they do for PutEvents. Delivery is unfiltered, as on AWS.
      - name: event detail completeness
        status: intentionally_partial
        gap: >-
          request-id, requester, source-ip-address, sequencer and version-id are
          omitted rather than fabricated. Restore, storage-class, tagging and ACL
          detail-types have no corresponding Overcast operation and are not emitted.
  PutBucketWebsite:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketWebsite.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketWebsite.html
    implementation:
      - internal/services/s3/handler_website.go
    tests:
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_redirectAllRequestsToRoundTrip
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_routingRulesRoundTrip
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_replacesTheWholeConfiguration
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_validation
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_rejectedConfigurationIsNotStored
      - tests/integration/cloudformation/s3_bucket_properties_test.go::TestS3BucketProperties_websiteRedirectAndRoutingRulesDispatchThroughS3
      - tests/integration/cloudformation/s3_bucket_properties_test.go::TestS3BucketProperties_websiteRedirectAllDispatchesThroughS3
    scenarios:
      - name: RedirectAllRequestsTo round trip
        status: fixed
        notes: HostName and the optional Protocol are preserved; an omitted Protocol is not serialised as an empty enum.
      - name: RoutingRules round trip
        status: fixed
        notes: >-
          Condition (HttpErrorCodeReturnedEquals, KeyPrefixEquals) and Redirect
          (HostName, HttpRedirectCode, Protocol, ReplaceKeyPrefixWith,
          ReplaceKeyWith) survive in AWS's unflattened RoutingRules/RoutingRule shape.
      - name: documented mutual exclusion and field constraints
        status: fixed
        notes: >-
          RedirectAllRequestsTo cannot be combined with IndexDocument, ErrorDocument
          or RoutingRules; one of RedirectAllRequestsTo and IndexDocument is required;
          Protocol is restricted to the http/https enum; the IndexDocument Suffix must
          be non-empty and slash-free; a Redirect must name a destination and cannot
          carry both ReplaceKeyWith and ReplaceKeyPrefixWith; a Condition needs a
          predicate. Refusals return InvalidArgument and store nothing.
      - name: Redirect HttpRedirectCode value validation
        status: intentionally_partial
        gap: >-
          Real S3 rejects a code that is not a valid HTTP redirect status. The model
          does not pin the error, so the value is stored rather than refused.
      - name: website endpoint serving
        status: unsupported
        gap: Overcast stores and returns the configuration but serves no S3 website endpoint.
  DeleteBucketWebsite:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketWebsite.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_bucket_configuration_test.go::TestDeleteBucketWebsite_removesConfiguration
      - tests/integration/cloudformation/s3_bucket_properties_test.go
    scenarios:
      - name: configured bucket
        status: fixed
        notes: Returns 204 and subsequent GetBucketWebsite returns NoSuchWebsiteConfiguration.
findings:
  fixed:
    - ListObjectsV2/ListObjects max-keys is validated: 0 and negative values returned 500 InternalError from a slice panic, a malformed value was silently replaced by the 1000 default, and a value above 1000 was honoured verbatim (#172).
    - ListObjectsV2/ListObjects support encoding-type=url and ListObjectsV2 supports fetch-owner; both were previously accepted and ignored (#173, #174).
    - PutBucketTagging/PutObjectTagging enforce AWS's tag-set limits instead of collapsing duplicate keys into a map and accepting any count or length (#175).
    - PutBucketNotificationConfiguration preserves EventBridgeConfiguration and publishes object events to the default event bus (#635).
    - PutBucketWebsite/GetBucketWebsite preserve RedirectAllRequestsTo and RoutingRules and enforce AWS's mutual exclusion (#637).
    - PutBucketLifecycleConfiguration honours x-amz-transition-default-minimum-object-size, reports it on Put and Get, and gates sub-128 KB transitions on it (#636).
    - PutBucketVersioning now rejects invalid status enum values with MalformedXML instead of persisting arbitrary strings.
    - Object version history, delete markers, version-targeted reads/deletes, ListObjectVersions ordering/pagination, and sweeper execution of NoncurrentVersionExpiration, NoncurrentVersionTransition and ExpiredObjectDeleteMarker (#645).
    - DeleteBucketCors and DeleteBucketWebsite now clear stored configurations and return 204.
    - PutObject and CompleteMultipartUpload honour If-None-Match and If-Match, so a conditional write no longer silently overwrites (#1636).
    - CompleteMultipartUpload validates the parts list — InvalidPart for a wrong or unknown ETag, InvalidPartOrder for an out-of-order list, EntityTooSmall for a non-final part under 5 MiB, MalformedXML for an empty list — and leaves a refused upload intact (#1706).
    - CloudFormation AWS::S3::Bucket uses the S3 handlers for lifecycle, versioning, notifications, encryption, tags, CORS, and website configuration.
    - GetObject, GetObjectTagging and CopyObject's source lookup now answer NoSuchBucket for a bucket that does not exist, instead of NoSuchKey (#1635); HeadObject is wire-identical either way per AWS's own documented HEAD limitation.
    - A PutObject, CopyObject, UploadPart or CompleteMultipartUpload that fails part way no longer destroys the object already at the key, and a CopyObject onto itself no longer empties it (#2192).
    - Concurrent CreateBucket calls for one name create one bucket and publish one S3BucketCreated event; the others get BucketAlreadyOwnedByYou, or 200 in us-east-1 (#2126).
    - DeleteObject and DeleteObjects honour If-Match, so a conditional delete no longer silently succeeds; a mismatch is 412 PreconditionFailed (per-key for DeleteObjects) and a missing key is 404 NoSuchKey rather than DeleteObject's usual idempotent 204 (#2037).
  remaining_gaps:
    - S3 error documents omit HostId, which real AWS sends on every error. Not specific to InvalidRange; belongs in a change against the whole REST-XML envelope rather than one operation (noted while fixing #1864).
    - Bucket policies are stored and returned but never evaluated, so a policy authorises and denies nothing.
    - PublicAccessBlock, RequesterPays and OwnershipControls return 501, so the CDK bootstrap template's public-access block is accepted by CloudFormation and unavailable over the S3 API.
    - ListObjects (v1) omits the per-object Owner element AWS always returns, and per-object ChecksumAlgorithm/ChecksumType are absent from both listings.
    - S3 InvalidArgument responses omit the ArgumentName and ArgumentValue elements real S3 returns, because protocol.AWSError has no fields for them.
    - CORS rule Id and encryption BlockedEncryptionTypes are not represented by the current stored/wire models.
    - CopyObject does not yet honour If-None-Match or If-Match, which AWS accepts on it alongside PutObject and CompleteMultipartUpload (#1678).
  intentionally_partial:
    - Requester Pays and archive restore are unimplemented, so ListObjectsV2 accepts x-amz-request-payer and x-amz-optional-object-attributes and returns neither x-amz-request-charged nor RestoreStatus - which is what AWS returns for a bucket that is not Requester Pays and an object that was never restored.
    - Directory buckets, access points and S3 on Outposts are out of scope; the ListObjectsV2 differences AWS documents for them are recorded in that operation's scenarios rather than emulated.
    - Tag character sets are not validated: the only place AWS writes the pattern down is the S3 Control Tag shape, and guessing a Unicode class wrong would reject tags real S3 accepts.
    - EventBridge object-event detail omits request-id, requester and source-ip-address, which Overcast has no truthful value for; version-id and sequencer are now populated from the object version history (#645), and only Object Created and Object Deleted are emitted.
    - Website configuration is stored and returned in full, but Overcast serves no S3 website endpoint, so no request is redirected; Redirect HttpRedirectCode values are stored without validation because the model does not pin AWS's error.
    - GetObjectAttributes, RestoreObject and SelectObjectContent remain unimplemented, so no version-aware behaviour is claimed for them.
handoff:
  start_with: [ListObjects v1 per-object Owner, per-object ChecksumAlgorithm/ChecksumType on both listings, bucket policy document validation and evaluation, PublicAccessBlock, ListObjectVersions and ListMultipartUploads encoding-type, ListParts/ListMultipartUploads max-parts and max-uploads validation, issue 635, issue 636, issue 637]
  do_not_redo: [CompleteMultipartUpload parts-list validation, ListObjectsV2 optional-parameter review, ListObjectsV2 max-keys validation, ListObjectsV2/ListObjects encoding-type, ListObjectsV2 fetch-owner, ListObjectsV2 start-after, ListObjectsV2 continuation-token, bucket and object tag-set limits, CDK bootstrap bucket flow, DeleteBucketCors, DeleteBucketWebsite, PutBucketVersioning status validation, CloudFormation S3 bucket seven-property dispatch, object version history and noncurrent lifecycle execution]
  commands: [go test -count=1 ./internal/services/s3/... ./tests/integration/s3/...]
