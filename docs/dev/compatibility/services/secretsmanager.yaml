service: secretsmanager
status: in_progress
priority: p1
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-20
protocols: [aws_json_1_1, aws_json_1_0, rpcv2_cbor]
implementation: [internal/services/secretsmanager]
integration_tests: [tests/integration/secretsmanager]
capability_docs: docs/services/secretsmanager.md
operation_count_estimate: 22 tracked; 20 supported, 2 unsupported
current_support_level: Core CRUD, versioning, KMS key metadata, tags, random password, rotation, deletion recovery windows with RestoreSecret, and resource-policy storage supported; replication stubbed.
operations:
  CreateSecret:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_CreateSecret.html
    protocol: AWS JSON 1.1; POST / with X-Amz-Target secretsmanager.CreateSecret
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestSecretKMSKeyIdRoundTripsThroughCreateUpdateDescribeAndList
      - tests/integration/cloudformation/generate_secret_string_test.go::TestCreateStack_generateSecretStringPopulatesAwsCurrent
    scenarios:
      kms_key_metadata:
        status: fixed
        evidence: KmsKeyId is persisted during CreateSecret and returned by DescribeSecret and ListSecrets; CloudFormation forwards the property through CreateSecret.
      cloudformation_tags:
        status: fixed
        evidence: AWS::SecretsManager::Secret resource tags and propagated stack tags are merged with resource-level precedence and forwarded through CreateSecret; updates reconcile through TagResource and UntagResource.
      generated_secret_value:
        status: fixed
        evidence: CloudFormation validates JSON-object templates and GenerateStringKey collisions before mutation, calls GetRandomPassword, and stores the generated value through CreateSecret for GetSecretValue readback.
  UpdateSecret:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_UpdateSecret.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestSecretKMSKeyIdRoundTripsThroughCreateUpdateDescribeAndList
    scenarios:
      kms_key_metadata:
        status: fixed
        evidence: An explicitly supplied KmsKeyId updates stored metadata without creating a new secret version and is returned by DescribeSecret and ListSecrets.
  GetSecretValue:
    status: reviewed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestPutSecretValue_createsNewVersion
      - internal/services/secretsmanager/consumer_freshness_test.go::TestServiceSecretValue_readsCurrentVersionWithoutCaching
    scenarios:
      current_version_freshness:
        status: reviewed
        evidence: Omitting VersionId and VersionStage resolves AWSCURRENT on every request. The cross-service resolver reads the store for each call and observes a newly promoted version without a server-side value cache.
  DescribeSecret:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_DescribeSecret.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestSecretKMSKeyIdRoundTripsThroughCreateUpdateDescribeAndList
  ListSecrets:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_ListSecrets.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestSecretKMSKeyIdRoundTripsThroughCreateUpdateDescribeAndList
  GetRandomPassword:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetRandomPassword.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestGetRandomPassword_rejectsOutOfRangeLength
      - tests/integration/secretsmanager/secretsmanager_test.go::TestGetRandomPassword_default
    scenarios:
      omission_and_bounds:
        status: fixed
        evidence: Omitted PasswordLength defaults to 32 while explicit values outside the modeled 1..4096 range return InvalidParameterException; ExcludeCharacters enforces its modeled 4096-character maximum before generation.
  DeleteSecret:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_DeleteSecret.html
    implementation: internal/services/secretsmanager/typed_logic.go (deleteSecretTyped)
    tests:
      - tests/integration/secretsmanager/delete_recovery_test.go::TestDeleteSecret_forceAndRecoveryWindowTogether
      - tests/integration/secretsmanager/delete_recovery_test.go::TestDeleteSecret_recoveryWindowOutOfRange
      - tests/integration/secretsmanager/delete_recovery_test.go::TestDeleteSecret_defaultWindowSchedulesRatherThanDeletes
      - internal/services/secretsmanager/delete_recovery_test.go::TestDeleteSecret_secretIsGoneOnceTheWindowElapses
    scenarios:
      parameter_validation:
        status: fixed
        evidence: Specifying ForceDeleteWithoutRecovery together with RecoveryWindowInDays is InvalidParameterException, and a window outside AWS's 7..30 range is rejected before anything is written. Both parameters are decoded as pointers so presence, not value, decides.
      recovery_window:
        status: fixed
        evidence: DeleteSecret schedules the deletion and answers DeletionDate = request time + the window (default 30 days); the secret keeps its record with DeletedDate, is hidden from ListSecrets unless IncludePlannedDeletion is set, refuses GetSecretValue/PutSecretValue/UpdateSecret with InvalidRequestException, blocks CreateSecret of the same name, and disappears once the window elapses. The window is enforced lazily on read (smStore.getSecret/listSecrets) rather than by a sweeper. ForceDeleteWithoutRecovery still removes the record immediately, which is what CloudFormation's teardown sends.
  RestoreSecret:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_RestoreSecret.html
    implementation: internal/services/secretsmanager/typed_logic.go (restoreSecretTyped)
    tests:
      - tests/integration/secretsmanager/delete_recovery_test.go::TestRestoreSecret_cancelsTheScheduledDeletion
      - tests/integration/secretsmanager/delete_recovery_test.go::TestRestoreSecret_notFound
    scenarios:
      cancels_scheduled_deletion:
        status: fixed
        evidence: RestoreSecret clears DeletedDate and answers {ARN, Name} as the model shapes it; the value is readable again and the secret is listed without IncludePlannedDeletion. A secret whose window has already elapsed is ResourceNotFoundException.
findings:
  fixed:
    - CreateSecret and UpdateSecret dropped KmsKeyId, and DescribeSecret/ListSecrets could not return it; the metadata now persists and round-trips.
    - GetRandomPassword treated explicit zero as omission and accepted oversized lengths; omission and modeled bounds are now distinct.
    - CloudFormation generated-secret template validation ran after password generation, panicked for JSON null, and overwrote GenerateStringKey collisions; validation is now pre-dispatch and non-mutating.
    - AWS::SecretsManager::Secret dropped KmsKeyId and Tags on create; both now flow through Secrets Manager APIs, including stack-tag propagation and update reconciliation.
    - "#178 (deletion recovery): DeleteSecret now validates its two optional parameters and schedules the delete instead of performing it — a 7..30 day recovery window (default 30), DeletedDate on the record, hidden from ListSecrets unless IncludePlannedDeletion, InvalidRequestException on every value operation, and RestoreSecret to cancel it. The window is enforced lazily on read, so nothing runs in the background. ForceDeleteWithoutRecovery removes the secret immediately."
    - "#179 (docs drift): checked docs/services/secretsmanager.md for a duplicated hand-maintained operations summary that could drift from the generated capability block — none exists. The page's \"What works\"/\"Differences from AWS\" prose tables and the generated <!-- BEGIN overcast:capabilities --> block cover different material (behavior narrative vs. per-operation status) and do not restate each other. Negative finding recorded; no doc change needed."
  remaining_gaps:
    - Changing CloudFormation GenerateSecretString settings does not yet create a new secret version as AWS documents (#678).
  intentionally_partial:
    - KmsKeyId is observable metadata only; Overcast does not encrypt secret payloads through the KMS emulator.
    - "#178 (replication): ReplicateSecretToRegions and its counterpart are not implemented (501), documented in docs/services/secretsmanager.md's Differences table; CloudFormation ReplicaRegions is tracked separately in #679."
handoff:
  start_with: [CloudFormation GenerateSecretString updates (#678)]
  do_not_redo:
    - Create/Update/Describe/List KmsKeyId metadata round-trip and CloudFormation create/tag forwarding are covered by issue 526 tests.
    - "#179: docs/services/secretsmanager.md carries no duplicated hand-maintained operations summary; nothing to fix."
    - "#178: DeleteSecret's recovery window, its parameter validation and RestoreSecret are implemented and tested."
  commands: [go test -count=1 ./internal/services/secretsmanager/... ./tests/integration/secretsmanager/... ./tests/integration/cloudformation/...]
