findings:
  fixed:
    - "#180: multi-protocol tracking for v2 REST-JSON doc-only operations is fixed by #864
      (feat(awsapi): enforce the manifest over the wire facts a service states about itself).
      Every V2* capability row except V2Other is dispatched by a REST route registered in
      RegisterRoutes rather than v1's action table. Before #864, DocOnly sat on all eight V2*
      rows because capgen's manifest check did not read DisplayName — so a row named
      V2SendEmail found no `sesv2` operation of that name and reported UNKNOWN_MODEL_OPERATION —
      and its orphan check read only the v1 action table, missing REST-dispatched handlers
      entirely. #864 fixed both: modeledOperationName now resolves through DisplayName, and the
      orphan cross-check reads the package's handler methods. capgen also now rejects a DocOnly
      row that has an implementation, so the flag cannot silently come back. Only V2Other (the
      catch-all `NotImplemented` response for every other v2 operation) is DocOnly today, which
      is correct — see internal/services/ses/capabilities_dev.go:52-69 for the full explanation
      left in place by #864."
  remaining_gaps: []
  intentionally_partial:
    - "#181: verified. Every unsupported v1 operation routes through
      protocol.NotImplementedQueryXML (internal/services/ses/handler_stubs.go), answering 501
      with x-emulator-unsupported: true, a request ID, and the awsQuery ErrorResponse envelope
      (Error/Type, Code, Message; RequestId) the pinned SES model prescribes.
      tests/integration/ses/ses_test.go pins it for GetIdentityDkimAttributes,
      SetIdentityDkimEnabled and CreateConfigurationSet, and proves a supported operation on the
      same endpoint still answers 200."
