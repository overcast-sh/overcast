findings:
  fixed:
    - "#193: the tracker said \"5 supported\" with \"executions are inert/no-op\"; PR #1955 (\"complete ASL implementation\") and PR #1993 (redrive) landed a real interpreter with 37 StatusSupported operations, all covered by tests/integration/stepfunctions, and docs/services/stepfunctions.md already states Step Functions is \"✅ Supported\". This entry is a full rewrite reflecting that state."
    - "#2003 (a #1670 follow-up): CreateStateMachine accepted any name and any roleArn, and every operation taking a caller-supplied stateMachineArn fell through parseSMARN's failure into a name lookup, so malformed input answered StateMachineDoesNotExist. Now: the name is checked against AWS's documented charset and refused with InvalidName (400), reusing the resourceNamePattern CreateActivity already applies; a non-empty roleArn that is not an IAM role ARN is InvalidArn (400); and StartExecution, StartSyncExecution, DescribeStateMachine, UpdateStateMachine, DeleteStateMachine and ListExecutions all parse the ARN first (requireStateMachineARN, handler.go) and answer InvalidArn. The name-lookup fallback was removed rather than kept: every internal caller — CloudFormation's provisioner, EventBridge and Scheduler targets, the ASL interpreter's states:startExecution Task — passes an ARN, and nothing passes a bare name. Tests: tests/integration/stepfunctions/validation_test.go."
  remaining_gaps:
    - "An omitted roleArn on CreateStateMachine, and an empty stateMachineArn, are still not reported the way AWS's front-end validator reports a missing or zero-length required member; Step Functions does not model that error shape, so each needs its own evidence."
    - "UpdateStateMachine given a version or alias ARN answers StateMachineDoesNotExist rather than refusing the qualifier outright; AWS accepts only an unqualified state machine ARN there."
  intentionally_partial: []
handoff:
  start_with: [Missing or empty required-member handling on CreateStateMachine and the execution operations, UpdateStateMachine given a qualified ARN]
  do_not_redo:
    [CreateStateMachine, DescribeStateMachine, ListStateMachines, DeleteStateMachine, UpdateStateMachine,
     DescribeStateMachineForExecution, ValidateStateMachineDefinition, PublishStateMachineVersion,
     ListStateMachineVersions, DeleteStateMachineVersion, CreateStateMachineAlias, DescribeStateMachineAlias,
     UpdateStateMachineAlias, DeleteStateMachineAlias, ListStateMachineAliases, StartExecution,
     StartSyncExecution, DescribeExecution, ListExecutions, GetExecutionHistory, StopExecution,
     RedriveExecution, TestState, ListMapRuns, DescribeMapRun, UpdateMapRun, CreateActivity,
     DescribeActivity, DeleteActivity, ListActivities, GetActivityTask, SendTaskSuccess, SendTaskFailure,
     SendTaskHeartbeat, TagResource, UntagResource, ListTagsForResource]
  commands: [go test -count=1 ./internal/services/stepfunctions/... ./tests/integration/stepfunctions/...]
