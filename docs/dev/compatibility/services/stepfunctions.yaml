      - tests/integration/stepfunctions/stepfunctions_test.go#TestRPCv2CBOR_StateMachineLifecycle
    scenarios:
      arn_and_name_validation:
        status: remaining_gaps
        gap: "#1670: createStateMachineTyped (typed_logic.go) only rejects an empty Name; it does not validate RoleArn's shape, so a malformed role ARN is accepted, and it does not reject a Name containing a space (AWS's InvalidName)."
