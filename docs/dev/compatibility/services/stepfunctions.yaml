findings:
  fixed:
    - "#193: the tracker said \"5 supported\" with \"executions are inert/no-op\"; PR #1955 (\"complete ASL implementation\") and PR #1993 (redrive) landed a real interpreter with 37 StatusSupported operations, all covered by tests/integration/stepfunctions, and docs/services/stepfunctions.md already states Step Functions is \"✅ Supported\". This entry is a full rewrite reflecting that state."
  remaining_gaps:
    - "CreateStateMachine's role/name validation and resolveExecutionTarget's ARN handling accept malformed input where AWS rejects it — createStateMachineTyped (typed_logic.go) only checks Name==\"\" (no RoleArn shape check, no rejection of a Name containing a space, AWS's InvalidName), and resolveExecutionTarget (execution_target.go) falls through to a name lookup for any ARN parseSMARN cannot parse, answering StateMachineDoesNotExist instead of InvalidArn. Tracked as #2003."
  intentionally_partial: []
handoff:
  start_with: [CreateStateMachine RoleArn/Name validation, resolveExecutionTarget malformed-ARN handling]
  do_not_redo:
    [CreateStateMachine, DescribeStateMachine, ListStateMachines, DeleteStateMachine, UpdateStateMachine,
     DescribeStateMachineForExecution, ValidateStateMachineDefinition, PublishStateMachineVersion,
     ListStateMachineVersions, DeleteStateMachineVersion, CreateStateMachineAlias, DescribeStateMachineAlias,
     UpdateStateMachineAlias, DeleteStateMachineAlias, ListStateMachineAliases, StartExecution,
     StartSyncExecution, DescribeExecution, ListExecutions, GetExecutionHistory, StopExecution,
     RedriveExecution, TestState, ListMapRuns, DescribeMapRun, UpdateMapRun, CreateActivity,
     DescribeActivity, DeleteActivity, ListActivities, GetActivityTask, SendTaskSuccess, SendTaskFailure,
     SendTaskHeartbeat, TagResource, UntagResource, ListTagsForResource]
  commands: [go test -count=1 ./internal/services/stepfunctions/... ./tests/integration/stepfunctions/...]
