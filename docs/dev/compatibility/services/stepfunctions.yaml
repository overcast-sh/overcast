service: stepfunctions
status: in_progress
priority: p1
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-09-20
protocols: [aws_json_1_0, aws_json_1_1, rpcv2_cbor]
implementation: [internal/services/stepfunctions]
integration_tests: [tests/integration/stepfunctions]
capability_docs: docs/services/stepfunctions.md
operation_count_estimate: >-
  37 operations declared in internal/services/stepfunctions/capabilities_dev.go, all
  StatusSupported: 6 State machines, 5 Versions and aliases, 9 Executions, 3 Map runs,
  8 Activities and task tokens, 3 Tags, plus ValidateStateMachineDefinition. The tracker
  previously said "5 supported" and "executions are inert/no-op", which PR #1955 ("complete ASL
  implementation") and PR #1993 (redrive) made false.
current_support_level: >-
  A real Amazon States Language interpreter. StartExecution/StartSyncExecution run the
  definition end to end — Pass/Task/Choice/Wait/Succeed/Fail/Parallel/Map states, error
  handling (Retry/Catch), JSONPath and JSONata query languages, distributed Map with S3
  item sources, task tokens (.waitForTaskToken) and activities, callbacks
  (SendTaskSuccess/Failure/Heartbeat), state-machine versions and aliases with weighted
  routing, RedriveExecution, TestState, and EventBridge execution-status events — matching
  docs/services/stepfunctions.md's "✅ Supported" status. This is a full rewrite of a stale
  entry that said the opposite.
operations:
  # ─── State machines ──────────────────────────────────────────────────────
  CreateStateMachine:
    status: reviewed
    aws_docs: [https://docs.aws.amazon.com/step-functions/latest/apireference/API_CreateStateMachine.html]
    tests:
      - tests/integration/stepfunctions/stepfunctions_test.go#TestCreateStateMachine_success
